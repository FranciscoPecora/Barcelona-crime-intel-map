// ── Vehicle markers (created once, animated every frame via setLatLng) ──
function vehicleIcon(colour, stopped) {
  return L.divIcon({
    html:`<div style="width:9px;height:9px;border-radius:50%;background:${colour};border:1.5px solid rgba(4,12,24,.9);box-shadow:0 0 ${stopped?2:6}px ${colour}${stopped?'55':'cc'}"></div>`,
    className:'', iconSize:[9,9], iconAnchor:[4.5,4.5]
  });
}

function ensureMetroVehicleMarkers() {
  if(!metroVehicleLayer) metroVehicleLayer = L.layerGroup().addTo(map);
  metroLines.forEach(line=>{
    if(!line.runtime || !line.timeline) return;
    const headwayS = METRO_HEADWAY_S[line.ref] || 300;
    const count = Math.max(1, Math.min(6, Math.round(line.timeline.cycleMs/(headwayS*1000))));
    for(let k=0;k<count;k++){
      const key = `${line.ref}__${k}`;
      if(metroVehicleMarkers[key]) continue;
      const m = L.marker([0,0], {icon: vehicleIcon(line.colour, false)});
      m.bindTooltip('', {sticky:true, opacity:1, className:''});
      metroVehicleLayer.addLayer(m);
      metroVehicleMarkers[key] = {marker:m, line, k, phaseMs:k*line.timeline.cycleMs/count, lastStopped:null};
    }
  });
}

function ensureBusVehicleMarkers() {
  if(!busVehicleLayer) busVehicleLayer = L.layerGroup().addTo(map);
  busLines.forEach(line=>{
    if(!line.runtime || !line.timeline) return;
    const count = Math.max(1, Math.min(4, Math.round(line.timeline.cycleMs/(BUS_HEADWAY_S*1000))));
    for(let k=0;k<count;k++){
      const key = `${line.ref}__${k}`;
      if(busVehicleMarkers[key]) continue;
      const m = L.marker([0,0], {icon: vehicleIcon('#3da8ff', false)});
      m.bindTooltip('', {sticky:true, opacity:1, className:''});
      busVehicleLayer.addLayer(m);
      busVehicleMarkers[key] = {marker:m, line, phaseMs:k*line.timeline.cycleMs/count, lastStopped:null};
    }
  });
}

let _lastVehicleAnimTick = 0;
function animateNetworkVehicles(nowRaf) {
  if(currentMap==='transit' && nowRaf - _lastVehicleAnimTick > 150) {
    _lastVehicleAnimTick = nowRaf;
    const now = performance.now();
    if(activeFilters.has('metro')) {
      Object.values(metroVehicleMarkers).forEach(v=>{
        const live = tmbMetroLiveData[v.line.ref];
        // Live TMB data only. No live data for this line = no marker shown.
        if(!live || live.length<2 || v.k!==0){ v.marker.setOpacity(0); return; }
        v.marker.setOpacity(1);
        const pos = liveEtaPosition(v.line);
        if(!pos){ v.marker.setOpacity(0); return; }
        v.marker.setLatLng([pos.lat,pos.lng]);
        if(pos.stopped !== v.lastStopped){
          v.lastStopped = pos.stopped;
          v.marker.setIcon(vehicleIcon(v.line.colour, pos.stopped));
          v.marker.setTooltipContent(`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(4,12,24,.94);border:1px solid #1a3050;padding:5px 9px;color:#c0d4e8">
            <strong style="color:${v.line.colour}">${v.line.ref}</strong> · ${pos.stopped?'Arriving':'En route'} · Live (TMB)</div>`);
        }
      });
    }
    if(activeFilters.has('bus')) {
      // No live bus feed wired yet — under the live-or-nothing policy, don't show
      // simulated bus vehicles. Bus stops and lines still render statically.
      Object.values(busVehicleMarkers).forEach(v=>{ v.marker.setOpacity(0); });
    }
    if(false && activeFilters.has('bus')) {
      Object.values(busVehicleMarkers).forEach(v=>{
        const pos = positionOnTimeline(v.line.runtime, v.line.timeline, now, v.phaseMs);
        v.marker.setLatLng([pos.lat,pos.lng]);
        if(pos.stopped !== v.lastStopped){
          v.lastStopped = pos.stopped;
          v.marker.setIcon(vehicleIcon('#3da8ff', pos.stopped));
          v.marker.setTooltipContent(`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(4,12,24,.94);border:1px solid #1a3050;padding:5px 9px;color:#c0d4e8">
            <strong style="color:#3da8ff">Bus ${v.line.ref}</strong> · ${pos.stopped?'At stop':'En route'}${tmbLiveOk?'':' · simulated'}</div>`);
        }
      });
    }
  }
  requestAnimationFrame(animateNetworkVehicles);
}
requestAnimationFrame(animateNetworkVehicles);

function updateAllTransitLayers() {

// Fly the map to fit a whole metro line's geometry — called from the sidebar metro list.
function flyToMetroLine(ref) {
  const line = metroLines.find(l=>l.ref===ref);
  if(!line) return;
  const allPts = line.segments.flat();
  if(!allPts.length) return;
  map.flyToBounds(L.latLngBounds(allPts), {padding:[40,40], duration:1.1});
}

function getCurrentRisk(districtId, crimeType) {
  const now = new Date();
  const hour = new Date().toLocaleString("en", {timeZone:"Europe/Madrid", hour:"numeric", hour12:false})*1;
  const day = now.getDay();
  const month = now.getMonth();

  const base = (crimeData[districtId] || FALLBACK_CRIME[districtId] || {})[crimeType] || 0;
  const annual = base / 12;

  const hMul = (HOURLY_MULTIPLIERS[crimeType] || [])[Math.min(hour % 24, 23)] || 1;
  const dMul = (DAY_MULTIPLIERS[crimeType] || [])[day] || 1;
  const sMul = (SEASONAL_MULTIPLIERS[crimeType] || [])[month] || 1;

  return annual * hMul * dMul * sMul;
}

let _cityMaxCache = { key: null, value: 1 };

function getDistrictRiskScore(districtId) {
  const types = ['theft','assault','robbery','vandalism','drugs','fraud'];
  const total = types.reduce((s, t) => s + getCurrentRisk(districtId, t), 0);

  const tickKey = Math.floor(Date.now() / 60000);
  if (_cityMaxCache.key !== tickKey) {
    const allTotals = Object.keys(DISTRICTS_GEO).map(id =>
      types.reduce((s, t) => s + getCurrentRisk(id, t), 0));
    _cityMaxCache = { key: tickKey, value: Math.max(...allTotals) || 1 };
  }
  return Math.round((total / _cityMaxCache.value) * 100);
}

function getRiskLevel(score) {
  if(score >= 80) return {label:'CRITICAL',color:'#ff1040',bg:'rgba(255,16,64,.12)'};
  if(score >= 60) return {label:'HIGH',    color:'#ff4060',bg:'rgba(255,64,96,.10)'};
  if(score >= 40) return {label:'ELEVATED',color:'#ffb040',bg:'rgba(255,176,64,.10)'};
  if(score >= 20) return {label:'MODERATE',color:'#00c8ff',bg:'rgba(0,200,255,.08)'};
  return              {label:'LOW',      color:'#00e8a0',bg:'rgba(0,232,160,.08)'};
}

function getDominantThreat(districtId) {
  const types = ['theft','assault','robbery','vandalism','drugs','fraud'];
  const labels = {theft:'Theft',assault:'Assault',robbery:'Robbery',vandalism:'Vandalism',drugs:'Drug Offences',fraud:'Fraud'};
  const risks = types.map(t => ({type:t, risk: getCurrentRisk(districtId, t)}));
  risks.sort((a,b) => b.risk - a.risk);
  return labels[risks[0].type] || 'Unknown';
}

function pearsonCorrelation(xs, ys) {
  const n = xs.length;
  if(n < 3) return 0;
  const mx = xs.reduce((a,b)=>a+b,0)/n;
  const my = ys.reduce((a,b)=>a+b,0)/n;
  const num = xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0);
  const den = Math.sqrt(xs.reduce((s,x)=>s+(x-mx)**2,0)*ys.reduce((s,y)=>s+(y-my)**2,0));
  return den===0 ? 0 : num/den;
}

function pearsonCI(r, n, z = 1.959963985) {
  if (n < 4) return { lo: -1, hi: 1 };
  const zr = 0.5 * Math.log((1 + r) / (1 - r));
  const se = 1 / Math.sqrt(n - 3);
  const lo = Math.tanh(zr - z * se);
  const hi = Math.tanh(zr + z * se);
  return { lo: Math.max(-1, lo), hi: Math.min(1, hi) };
}

function bootstrapFragility(xs, ys, iters = 2000) {
  const n = xs.length, r0 = pearsonCorrelation(xs, ys);
  let opposite = 0;
  for (let k = 0; k < iters; k++) {
    const bx = [], by = [];
    for (let i = 0; i < n; i++) {
      const j = (Math.random() * n) | 0;
      bx.push(xs[j]); by.push(ys[j]);
    }
    if (Math.sign(pearsonCorrelation(bx, by)) !== Math.sign(r0)) opposite++;
  }
  return opposite / iters;
}

function getCorrelationLabel(r) {
  const abs = Math.abs(r);
  const dir = r >= 0 ? 'positive' : 'negative';
  if(abs >= 0.8) return {str:`Strong ${dir}`,  color: r>=0?'#ff4060':'#00e8a0'};
  if(abs >= 0.6) return {str:`Moderate ${dir}`, color: r>=0?'#ffb040':'#00c8ff'};
  if(abs >= 0.3) return {str:`Weak ${dir}`,     color:'#7090a8'};
  return              {str:'No correlation',   color:'#3d4a5c'};
}

          const ciStr=`95% CI [${ci.lo>=0?'+':''}${ci.lo.toFixed(2)}, ${ci.hi>=0?'+':''}${ci.hi.toFixed(2)}] · n=${c.x.length}`;
          return `<div style="background:rgba(7,21,37,.8);border:1px solid var(--border2);padding:14px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div style="font-family:var(--mono);font-size:9px;color:#c0d4e8;letter-spacing:.06em;text-transform:uppercase;max-width:190px;line-height:1.5">${c.title}</div>
              <div style="text-align:right;flex-shrink:0;margin-left:10px">
                <div style="font-family:var(--mono);font-size:18px;color:${color};line-height:1">${c.r>=0?'+':''}${c.r.toFixed(3)}</div>
                <div style="font-family:var(--mono);font-size:7px;color:${color};letter-spacing:.1em;text-transform:uppercase">${str}</div>
                <div style="font-family:var(--mono);font-size:7px;color:var(--muted2);margin-top:3px;letter-spacing:.04em">${ciStr}</div>
              </div>
            </div>
            <div style="height:2px;background:var(--border);margin-bottom:10px;position:relative">
              <div style="position:absolute;${c.r>=0?'left:50%':'right:50%'};width:${Math.abs(c.r)*50}%;height:100%;background:${color}"></div>
              <div style="position:absolute;left:50%;top:-2px;width:1px;height:6px;background:var(--muted2)"></div>
            </div>
            <div style="margin-bottom:8px">${scatterSVG(c.x,c.y,color)}</div>
            <div style="font-family:var(--mono);font-size:9px;padding:5px 8px;margin-bottom:8px;
              background:${color}0d;border-left:2px solid ${color};color:${color};line-height:1.5">
              ${Math.abs(c.r)>=0.5
                ? `${c.r>0?'↑':'↓'} ${str} — ${c.r>0?'increases':'decreases'} with ${c.title.split(' vs ')[0].toLowerCase()}`
                : `No meaningful correlation detected`}
            </div>
            <div style="font-family:var(--mono);font-size:8px;color:var(--muted2);line-height:1.6;margin-bottom:8px">${c.insight}</div>
            <div style="display:flex;gap:5px;flex-wrap:wrap">
              ${c.datasets.map(d=>`<span style="font-family:var(--mono);font-size:7px;color:var(--muted);padding:2px 5px;border:1px solid var(--border);letter-spacing:.06em">${d}</span>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>

      <div style="margin-top:16px;padding:10px 14px;border:1px solid var(--border);background:rgba(7,21,37,.4)">
        <div style="font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Methodological Note</div>
        <div style="font-family:var(--mono);font-size:8px;color:var(--muted2);line-height:1.6">Pearson r computed across ${districts.length} Barcelona districts. Small sample (n=${districts.length}) — interpret with caution. All correlations are descriptive, not causal. Confounders (tourism density, economic inequality, nighttime economy) are not controlled for. This analysis identifies hypotheses for further investigation.</div>
      </div>
    </div>`;
}

const activityLog = [];
function logActivity(text, color='#7090a8') {
  const now = new Date();
  const time = now.toUTCString().split(' ')[4];
  activityLog.unshift({time, text, color});
  if(activityLog.length > 5) activityLog.pop();
  const feed = document.getElementById('activityFeed');
  if(!feed) return;
  feed.innerHTML = activityLog.map(a =>
    `<div class="activity-item">
      <span class="activity-time">${a.time}</span>
      <div class="activity-dot" style="background:${a.color}"></div>
      <span class="activity-text">${a.text}</span>
    </div>`
  ).join('');
}

(function(){
  let landingActive = true;
  const cursor=document.getElementById('cursor');
  const cursorRing=document.getElementById('cursorRing');
  let mx=window.innerWidth/2,my=window.innerHeight/2,rx=mx,ry=my;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
  (function animRing(){if(!landingActive) return; rx+=(mx-rx)*.12;ry+=(my-ry)*.12;cursorRing.style.left=rx+'px';cursorRing.style.top=ry+'px';requestAnimationFrame(animRing);})();

  const canvas=document.getElementById('eyeCanvas');
  const ctx=canvas.getContext('2d');
  const CW=800,CH=348,CX=CW/2,CY=CH/2,EW=320,EH=130;
  let globeAngle=0,pupilTX=0,pupilTY=0,pupilX=0,pupilY=0;
  let blinking=false,blinkPhase=0,nextBlink=4000,lastBlink=Date.now(),breatheT=0;
  const MAX_TRAVEL=22;

  function eyePath(scaleY=1){ctx.beginPath();ctx.moveTo(CX-EW,CY);ctx.bezierCurveTo(CX-EW/2,CY-EH*scaleY,CX+EW/2,CY-EH*scaleY,CX+EW,CY);ctx.bezierCurveTo(CX+EW/2,CY+EH*scaleY,CX-EW/2,CY+EH*scaleY,CX-EW,CY);ctx.closePath();}

  function drawEye(){
    if(!landingActive) return;
    ctx.clearRect(0,0,CW,CH);
    let lidScale=1;
    const now=Date.now();
    if(!blinking&&now-lastBlink>nextBlink){blinking=true;blinkPhase=0;lastBlink=now;nextBlink=3500+Math.random()*4000;}
    if(blinking){blinkPhase+=0.12;lidScale=Math.abs(Math.cos(blinkPhase));if(blinkPhase>Math.PI)blinking=false;}
    globeAngle+=0.004;breatheT+=0.018;
    const irisR=90+Math.sin(breatheT)*3,pupilR=28-Math.sin(breatheT*1.1)*3;
    pupilX+=(pupilTX-pupilX)*.08;pupilY+=(pupilTY-pupilY)*.08;
    const px=CX+pupilX,py=CY+pupilY*lidScale;
    ctx.save();eyePath(lidScale);ctx.clip();
    const ig=ctx.createRadialGradient(px,py,0,px,py,irisR);
    ig.addColorStop(0,'#1a3459');ig.addColorStop(.55,'#0b1e3a');ig.addColorStop(1,'#040a15');
    ctx.beginPath();ctx.arc(CX,CY,irisR,0,Math.PI*2);ctx.fillStyle=ig;ctx.fill();
    ctx.save();ctx.translate(CX,CY);ctx.rotate(globeAngle);ctx.translate(-CX,-CY);
    [11,27,44,60].forEach(r=>{ctx.beginPath();ctx.ellipse(CX,CY,irisR,r*(irisR/90),0,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${.06+.08*(1-r/90)})`;ctx.lineWidth=.7;ctx.stroke();});
    [11,27,44,60].forEach(r=>{ctx.beginPath();ctx.ellipse(CX,CY,r*(irisR/90),irisR,0,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${.06+.08*(1-r/90)})`;ctx.lineWidth=.7;ctx.stroke();});
    ctx.beginPath();ctx.arc(CX,CY,irisR,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=.8;ctx.stroke();
    ctx.restore();
    const lim=ctx.createRadialGradient(CX,CY,irisR-12,CX,CY,irisR);lim.addColorStop(0,'rgba(0,0,0,0)');lim.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.beginPath();ctx.arc(CX,CY,irisR,0,Math.PI*2);ctx.fillStyle=lim;ctx.fill();
    ctx.beginPath();ctx.arc(px,py,pupilR,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();
    const pdg=ctx.createRadialGradient(px,py,0,px,py,pupilR);pdg.addColorStop(0,'rgba(20,20,40,.6)');pdg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(px,py,pupilR,0,Math.PI*2);ctx.fillStyle=pdg;ctx.fill();
    ctx.beginPath();ctx.arc(px-7,py-7,5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();
    ctx.beginPath();ctx.arc(px-9,py-9,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
    ctx.restore();
    ctx.save();eyePath(lidScale);ctx.strokeStyle='rgba(255,255,255,.82)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    [[CX-EW,CY],[CX+EW,CY]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();});
    requestAnimationFrame(drawEye);
  }
  requestAnimationFrame(drawEye);

  const eyeEl=document.querySelector('.eye-container');
  document.addEventListener('mousemove',e=>{
    if(!eyeEl) return;
    const rect=eyeEl.getBoundingClientRect();
    const dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);
    const dist=Math.sqrt(dx*dx+dy*dy),angle=Math.atan2(dy,dx),travel=Math.min(dist*.12,MAX_TRAVEL);
    pupilTX=Math.cos(angle)*travel;pupilTY=Math.sin(angle)*travel;
  });

  function updateTS(){const el=document.getElementById('ts');if(el)el.textContent=new Date().toUTCString().replace('GMT','UTC');}
  updateTS();setInterval(updateTS,1000);

  document.getElementById('enterBtn').addEventListener('click',function(e){
    e.preventDefault();
    landingActive = false;
    const overlay=document.getElementById('landingOverlay');
    overlay.classList.add('fade-out');
    setTimeout(()=>{overlay.style.display='none';},650);
  });
})();
</script>
