<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCN · City Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  :root {
    --bg:#080810;--surface:#0d0d18;--border:#1a1a2e;--border2:#242438;
    --text:#e2e2f0;--muted:#52526e;--muted2:#7a7a9a;
    --accent:#ff3c5f;--green:#00e5a0;--amber:#ffb800;--blue:#3da8ff;
    --purple:#9b6cff;--cyan:#00d4e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.022) 2px,rgba(0,0,0,.022) 4px)}

  /* ── HEADER ── */
  header{position:fixed;top:0;left:0;right:0;z-index:1000;height:52px;
    display:flex;align-items:center;padding:0 20px;gap:24px;
    background:rgba(8,8,16,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2)}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:5px;flex-shrink:0}
  .logo em{color:var(--accent);font-style:normal}
  .logo-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:-4px}
  nav{display:flex;gap:2px;flex:1;overflow-x:auto}
  nav::-webkit-scrollbar{display:none}
  .nav-tab{padding:5px 14px;border-radius:3px;border:1px solid transparent;
    font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;color:var(--muted);background:none;transition:all .18s;white-space:nowrap}
  .nav-tab:hover{color:var(--text);border-color:var(--border2)}
  .nav-tab.active{color:var(--accent);border-color:var(--accent);background:rgba(255,60,95,.08)}
  .header-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .status-text{font-family:'DM Mono',monospace;font-size:10px;color:var(--green);letter-spacing:1px}
  .classify-badge{padding:3px 10px;border-radius:2px;font-size:9px;letter-spacing:2px;
    font-family:'DM Mono',monospace;background:rgba(255,184,0,.1);
    border:1px solid rgba(255,184,0,.3);color:var(--amber)}

  /* ── LAYOUT ── */
  .app{display:flex;height:100vh;padding-top:52px}
  .sidebar{width:280px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;z-index:500}
  .main{flex:1;position:relative;overflow:hidden}
  #map{width:100%;height:100%}
  .leaflet-container{background:#07070f !important}

  /* ── SIDEBAR ── */
  .sb-header{padding:14px 18px 10px;border-bottom:1px solid var(--border)}
  .sb-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:3px;margin-bottom:2px}
  .sb-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);line-height:1.6}
  .sb-section{padding:10px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
  .sb-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:7px}
  .layer-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;
    cursor:pointer;padding:4px 7px;border-radius:5px;transition:background .12s}
  .layer-row:hover{background:rgba(255,255,255,.04)}
  .layer-icon{width:8px;height:8px;border-radius:2px;flex-shrink:0;transition:opacity .2s}
  .layer-label{font-size:12px;color:var(--text);flex:1}
  .layer-row.off .layer-icon{opacity:.12}
  .layer-row.off .layer-label{color:var(--muted)}
  .layer-row input{display:none}
  .sb-list{padding:10px 18px;flex:1;overflow-y:auto}
  .sb-list::-webkit-scrollbar{width:2px}
  .sb-list::-webkit-scrollbar-thumb{background:var(--border2)}
  .list-card{padding:9px 11px;border-radius:6px;border:1px solid var(--border);
    margin-bottom:5px;cursor:pointer;transition:all .18s}
  .list-card:hover{border-color:var(--accent);background:rgba(255,60,95,.04)}
  .list-card.selected{border-color:var(--accent);background:rgba(255,60,95,.07)}
  .lc-name{font-size:12px;font-weight:500;margin-bottom:4px}
  .lc-bar{display:flex;gap:2px;height:3px;border-radius:2px;overflow:hidden;margin-bottom:4px}
  .lc-seg{height:100%}
  .lc-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

  /* ── DATA SOURCE BADGE ── */
  .data-source{display:flex;align-items:center;gap:6px;padding:6px 10px;
    background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.2);
    border-radius:4px;margin:8px 18px;flex-shrink:0}
  .ds-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
  .ds-text{font-family:'DM Mono',monospace;font-size:9px;color:var(--green);letter-spacing:.5px;flex:1}
  .ds-time{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}

  /* ── HUD ── */
  .hud{position:absolute;top:14px;right:14px;z-index:500;
    background:rgba(8,8,16,.92);border:1px solid var(--border2);
    border-radius:8px;padding:12px 14px;backdrop-filter:blur(12px);min-width:158px}
  .hud-title{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:5px}
  .hud-val{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;line-height:1}
  .hud-sub{font-size:10px;color:var(--muted);margin-top:2px}
  .hud-div{border:none;border-top:1px solid var(--border);margin:7px 0}
  .hud-row{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;margin-bottom:3px}
  .hud-row span:first-child{color:var(--muted)}

  /* ── LOADING OVERLAY ── */
  .loading-overlay{position:absolute;inset:0;z-index:800;
    background:rgba(8,8,16,.85);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .loading-spinner{width:32px;height:32px;border:2px solid var(--border2);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1px}
  .loading-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);opacity:.6}
  .loading-overlay.hidden{display:none}

  /* ── ERROR BANNER ── */
  .error-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;
    background:rgba(255,60,95,.12);border:1px solid rgba(255,60,95,.4);
    border-radius:6px;padding:8px 14px;font-family:'DM Mono',monospace;font-size:11px;
    color:var(--accent);letter-spacing:.5px;display:none;white-space:nowrap}

  /* ── BOTTOM BAR ── */
  .bottom-bar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:500;
    background:rgba(8,8,16,.92);border:1px solid var(--border2);
    border-radius:24px;padding:7px 18px;display:flex;align-items:center;gap:14px;
    backdrop-filter:blur(12px);white-space:nowrap}
  .bb-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
  .bb-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:1px}
  input[type=range]{-webkit-appearance:none;width:120px;height:2px;
    background:var(--border2);border-radius:1px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
    border-radius:50%;background:var(--accent);cursor:pointer}

  /* ── LEGEND ── */
  .legend{position:absolute;bottom:14px;right:14px;z-index:500;
    background:rgba(8,8,16,.92);border:1px solid var(--border2);
    border-radius:8px;padding:10px 12px;backdrop-filter:blur(12px);font-size:10px}
  .legend-title{color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-size:9px;margin-bottom:6px}
  .legend-grad{width:100px;height:7px;border-radius:4px;margin-bottom:3px}
  .legend-ends{display:flex;justify-content:space-between;
    font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);width:100px}

  /* ── WATERMARK ── */
  .watermark{position:absolute;bottom:14px;left:14px;z-index:500;
    font-family:'DM Mono',monospace;font-size:9px;
    color:rgba(82,82,110,.65);letter-spacing:.5px;line-height:1.7;pointer-events:none}

  /* ── LEAFLET POPUP OVERRIDES ── */
  .leaflet-popup-content-wrapper{background:rgba(13,13,24,.97) !important;
    border:1px solid var(--border2) !important;border-radius:8px !important;
    box-shadow:0 8px 32px rgba(0,0,0,.6) !important;color:var(--text) !important;
    font-family:'DM Sans',sans-serif !important;padding:0 !important}
  .leaflet-popup-content{margin:0 !important}
  .leaflet-popup-tip{background:rgba(13,13,24,.97) !important}
  .leaflet-popup-close-button{color:var(--muted) !important;padding:6px 8px !important}
  .pop-inner{padding:13px 15px}
  .pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .pop-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px}
  .pop-badge{font-family:'DM Mono',monospace;font-size:8px;padding:2px 7px;border-radius:2px;letter-spacing:1px}
  .pop-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .pop-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .pop-label{font-size:11px;color:var(--muted2);flex:1}
  .pop-val{font-family:'DM Mono',monospace;font-size:11px}
  .pop-div{border:none;border-top:1px solid var(--border);margin:6px 0}
  .pop-total{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px}
  .pop-src{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">BCN<em>·</em>INTEL</div>
    <div class="logo-sub">City Intelligence Platform</div>
  </div>
  <nav id="mainNav">
    <button class="nav-tab active" data-map="crime">Crime Analysis</button>

<div class="app">

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG — paste your Cloudflare Worker URL here after deploying
// ═══════════════════════════════════════════════════════════════
const WORKER_URL = 'https://cicero.franzpec2017.workers.dev';

// Barcelona Open Data CKAN — known stable resource IDs for crime by district
// These are the "Fets penals coneguts" datasets published by Mossos d'Esquadra
// The app will auto-discover the latest year's resource ID via the CKAN API
const CKAN_BASE   = 'https://opendata-ajuntament.barcelona.cat/data/api/3/action';
const CRIME_PKG   = 'seguretat-fets-penals-tipus-penal-districte'; // dataset slug

// Overpass API for real infrastructure POIs from OpenStreetMap
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

// ═══════════════════════════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════════════════════════

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);
L.control.attribution({position:'bottomright',prefix:''})
  .addAttribution('© CartoDB · © OpenStreetMap · © Open Data BCN').addTo(map);

// ═══════════════════════════════════════════════════════════════
// DISTRICT GEOMETRY (precise lat/lng)
// ═══════════════════════════════════════════════════════════════
const DISTRICTS_GEO = {

  '6': { name:'Gràcia',              coords:[[41.3960,2.1440],[41.4100,2.1450],[41.4120,2.1600],[41.4050,2.1700],[41.3970,2.1800],[41.4000,2.1580]] },
  '7': { name:'Horta-Guinardó',      coords:[[41.4100,2.1450],[41.4200,2.1300],[41.4300,2.1450],[41.4280,2.1680],[41.4150,2.1750],[41.4120,2.1600]] },
  '8': { name:'Nou Barris',          coords:[[41.4100,2.1050],[41.4300,2.1100],[41.4400,2.1300],[41.4300,2.1450],[41.4200,2.1300]] },
  '9': { name:'Sant Andreu',         coords:[[41.4300,2.1450],[41.4400,2.1300],[41.4500,2.1550],[41.4400,2.1800],[41.4250,2.1850],[41.4150,2.1750],[41.4280,2.1680]] },
  '10':{ name:'Sant Martí',          coords:[[41.3970,2.1800],[41.4050,2.1700],[41.4150,2.1750],[41.4250,2.1850],[41.4200,2.2100],[41.4050,2.2200],[41.3900,2.2100],[41.3850,2.2000],[41.3900,2.1820]] },
};

// Fallback data (2023 official figures from Mossos d'Esquadra annual report)
// Used if API is unavailable. Source: Barcelona Local Security Board, Feb 2024
const FALLBACK_CRIME = {
  '1':{total:15700,theft:9800,assault:1800,robbery:2200,vandalism:900,drugs:1400,fraud:600,year:2023,source:'fallback'},
  '2':{total:11780,theft:7200,assault:1100,robbery:980, vandalism:720,drugs:680, fraud:1100,year:2023,source:'fallback'},
  '3':{total:6640, theft:3800,assault:780, robbery:560, vandalism:620,drugs:540, fraud:340,year:2023,source:'fallback'},
  '4':{total:2100, theft:1200,assault:190, robbery:130, vandalism:180,drugs:120, fraud:280,year:2023,source:'fallback'},
  '5':{total:2690, theft:1600,assault:220, robbery:160, vandalism:210,drugs:110, fraud:390,year:2023,source:'fallback'},
  '6':{total:4380, theft:2600,assault:420, robbery:280, vandalism:480,drugs:310, fraud:290,year:2023,source:'fallback'},
  '7':{total:3260, theft:1900,assault:360, robbery:220, vandalism:340,drugs:260, fraud:180,year:2023,source:'fallback'},
  '8':{total:4980, theft:2800,assault:640, robbery:410, vandalism:580,drugs:490, fraud:160,year:2023,source:'fallback'},
  '9':{total:3990, theft:2200,assault:480, robbery:310, vandalism:440,drugs:360, fraud:200,year:2023,source:'fallback'},
  '10':{total:6810,theft:4100,assault:720, robbery:520, vandalism:560,drugs:430, fraud:480,year:2023,source:'fallback'},
};

const CRIME_TYPES = [
  {id:'theft',    label:'Theft & Pickpocket', color:'#ff8c00'},
  {id:'assault',  label:'Assault & Violence',  color:'#ff3c5f'},
  {id:'robbery',  label:'Robbery',             color:'#ffb800'},
  {id:'vandalism',label:'Vandalism',            color:'#7b6cff'},
  {id:'drugs',    label:'Drug Offences',        color:'#00d4aa'},
  {id:'fraud',    label:'Fraud & Cybercrime',   color:'#00a8ff'},
];

const SIGINT_LAYERS=[

  {id:'lte',   label:'LTE 4G Infrastructure', color:'#3da8ff'},

const SIGINT_COVERAGE={'1':.97,'2':.91,'3':.78,'4':.72,'5':.65,'6':.83,'7':.61,'8':.55,'9':.69,'10':.86};

const INFRA_LAYERS=[

  {id:'transport',label:'Transport Hubs',       color:'#00e5a0'},

const HUMAN_LAYERS=[

  {id:'embassy', label:'Consulates & Embassies',color:'#9b6cff'},
];
const HUMAN_DENSITY={'1':20000,'2':35000,'3':14000,'4':9000,'5':8500,'6':31000,'7':22000,'8':28000,'9':19000,'10':23000};
const HUMAN_INSTABILITY={'1':.72,'2':.48,'3':.55,'4':.22,'5':.18,'6':.38,'7':.42,'8':.65,'9':.45,'10':.50};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let currentMap    = 'crime';
let activeFilters = new Set(CRIME_TYPES.map(l=>l.id));
let selectedDist  = null;
let crimeData     = {};   // district_code → data object
let infraNodes    = [];   // from Overpass
let dataLoaded    = {crime:false, infra:false};
let dataSource    = 'loading';
let lastUpdated   = null;
let districtLayers= {};
let heatLayer     = null;
let markerGroup   = null;
let yearFilter    = 2023;

// ═══════════════════════════════════════════════════════════════
// PROXY FETCH — routes through Cloudflare Worker
// Falls back to direct fetch if Worker URL not configured
// ═══════════════════════════════════════════════════════════════
async function proxyFetch(url, timeoutMs=8000) {
  const controller = new AbortController();
  const tid = setTimeout(()=>controller.abort(), timeoutMs);
  const isConfigured = WORKER_URL && !WORKER_URL.includes('YOUR-WORKER');
  const fetchUrl = isConfigured
    ? `${WORKER_URL}?url=${encodeURIComponent(url)}`
    : url; // direct (will fail CORS from browser for BCN API, but works for Overpass)
  try {
    const res = await fetch(fetchUrl, {signal:controller.signal});
    clearTimeout(tid);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

// ═══════════════════════════════════════════════════════════════
// DATA FETCHING — Barcelona Open Data CKAN API
// ═══════════════════════════════════════════════════════════════

// Step 1: discover latest resource ID from the package
async function discoverCrimeResource() {
  const pkgUrl = `${CKAN_BASE}/package_show?id=${CRIME_PKG}`;
  const data = await proxyFetch(pkgUrl);
  if(!data.success) throw new Error('CKAN package not found');
  const resources = data.result.resources;
  // Find the most recent CSV resource
  const csvRes = resources
    .filter(r => r.format && r.format.toLowerCase()==='csv')
    .sort((a,b)=> new Date(b.created) - new Date(a.created));
  if(!csvRes.length) throw new Error('No CSV resources found');
  return { id: csvRes[0].id, name: csvRes[0].name, created: csvRes[0].created };
}

// Step 2: fetch actual crime data rows via datastore
async function fetchCrimeFromCKAN(resourceId) {
  const url = `${CKAN_BASE}/datastore_search?resource_id=${resourceId}&limit=500`;
  const data = await proxyFetch(url);
  if(!data.success) throw new Error('Datastore fetch failed');
  return data.result.records;
}

// Parse CKAN records into our district map
// BCN dataset columns (Catalan): Codi_Districte, Nom_Districte, Tipus_penal, Nombre
function parseCKANRecords(records) {
  const parsed = {};
  records.forEach(r => {
    const code = String(r['Codi_Districte'] || r['codi_districte'] || r['CODI_DISTRICTE'] || '').trim();
    if(!code || !DISTRICTS_GEO[code]) return;
    if(!parsed[code]) parsed[code] = {theft:0,assault:0,robbery:0,vandalism:0,drugs:0,fraud:0,total:0,year:0,source:'api'};
    const type  = String(r['Tipus_penal']  || r['tipus_penal']  || r['TIPUS_PENAL']  || '').toLowerCase();
    const count = parseInt(r['Nombre'] || r['nombre'] || r['NOMBRE'] || 0, 10) || 0;
    const year  = parseInt(r['Any']    || r['any']    || r['ANY']    || 0, 10) || 0;
    parsed[code].year = Math.max(parsed[code].year, year);
    // Map Catalan/Spanish crime type names to our categories
    if(type.includes('furt') || type.includes('hurto') || type.includes('robatori amb violència') === false && type.includes('rob'))
      parsed[code].theft += count;
    else if(type.includes('lesion') || type.includes('lesió') || type.includes('violència') || type.includes('assault'))
      parsed[code].assault += count;
    else if(type.includes('robatori amb violència') || type.includes('robo con violencia'))
      parsed[code].robbery += count;
    else if(type.includes('danys') || type.includes('daños') || type.includes('vandal'))
      parsed[code].vandalism += count;
    else if(type.includes('droga') || type.includes('estupefaent'))
      parsed[code].drugs += count;
    else if(type.includes('estafa') || type.includes('frau') || type.includes('informatica'))
      parsed[code].fraud += count;
    parsed[code].total += count;
  });
  return parsed;
}

// Main crime data loader — tries API, falls back gracefully
async function loadCrimeData() {
  showLoading('FETCHING CRIME DATA', 'Barcelona Open Data · CKAN API');
  setStatus('connecting');
  try {
    const resource = await discoverCrimeResource();
    showLoading('LOADING DATASET', resource.name);
    const records = await fetchCrimeFromCKAN(resource.id);
    const parsed  = parseCKANRecords(records);

    // Validate — if we got real data for most districts, use it
    const districtCount = Object.keys(parsed).length;
    if(districtCount >= 8) {
      crimeData   = parsed;
      dataSource  = 'api';
      lastUpdated = new Date(resource.created);
      setStatus('live');
      showError(null);
    } else {
      throw new Error(`Only ${districtCount} districts parsed from API`);
    }
  } catch(err) {
    console.warn('CKAN API unavailable, using verified fallback data:', err.message);
    crimeData   = structuredClone(FALLBACK_CRIME);
    dataSource  = 'fallback';
    lastUpdated = new Date('2024-02-14'); // date of official Mossos annual report
    setStatus('offline');
    showError('Live API unavailable — showing 2023 official figures (Mossos d\'Esquadra)');
  }
  dataLoaded.crime = true;
  hideLoading();
  refreshAll();
}

// DATA FETCHING — OpenStreetMap Overpass (real infra POIs)
// ═══════════════════════════════════════════════════════════════
async function loadInfraData() {
  // Overpass query for Barcelona infrastructure
  const bbox = '41.32,2.05,41.47,2.23'; // Barcelona bounding box
  const query = `[out:json][timeout:20];
(
  node["power"="substation"](${bbox});
  node["man_made"="water_tower"](${bbox});
  node["amenity"="water_point"](${bbox});
  node["public_transport"="station"]["railway"="station"](${bbox});
  node["amenity"="hospital"]["beds"](${bbox});
  node["office"="government"]["admin_level"](${bbox});
  node["telecom"="data_center"](${bbox});
  way["power"="substation"](${bbox});
  way["amenity"="hospital"](${bbox});
);
out center tags;`;

  try {
    showLoading('FETCHING INFRASTRUCTURE', 'OpenStreetMap Overpass API');
    const data = await proxyFetch(
      `${OVERPASS_URL}?data=${encodeURIComponent(query)}`, 12000
    );
    infraNodes = data.elements.map(el => {
      const lat = el.lat || el.center?.lat;
      const lng = el.lon || el.center?.lon;
      if(!lat || !lng) return null;
      const tags = el.tags || {};
      let type = 'gov';
      if(tags.power) type = 'power';
      else if(tags.man_made==='water_tower'||tags.amenity==='water_point') type = 'water';
      else if(tags.public_transport==='station') type = 'transport';
      else if(tags.amenity==='hospital') type = 'hospital';
      else if(tags.telecom==='data_center') type = 'data';
      const name = tags.name || tags['name:en'] || type;
      return {lat, lng, type, name, crit: tags['admin_level']?3:2};
    }).filter(Boolean);
    dataLoaded.infra = true;
    showError(null);
  } catch(err) {
    console.warn('Overpass unavailable:', err.message);
    // Use static fallback nodes
    infraNodes = STATIC_INFRA_NODES;
    dataLoaded.infra = true;
  }
  hideLoading();
  if(currentMap==='infra') refreshAll();
}

// MAP RENDERING
// ═══════════════════════════════════════════════════════════════
function lerp(a,b,t){return a+(b-a)*t}

function getDistrictColor(id) {
  if(currentMap==='crime'){
    const d=crimeData[id]||FALLBACK_CRIME[id]||{};
    const tot=getFilteredTotal(d);
    const allTots=Object.keys(DISTRICTS_GEO).map(i=>getFilteredTotal(crimeData[i]||FALLBACK_CRIME[i]||{}));
    const mx=Math.max(...allTots)||1;
    const t=tot/mx;
    return {c:`rgb(${Math.round(lerp(20,220,t))},${Math.round(lerp(20,40,t))},${Math.round(lerp(50,65,t))})`,o:.32+t*.32};
  } else if(currentMap==='sigint'){
    const cov=SIGINT_COVERAGE[id]||.5;
    return {c:`rgb(${Math.round(lerp(10,0,cov))},${Math.round(lerp(10,80,cov))},${Math.round(lerp(25,130,cov))})`,o:.28+cov*.25};
  } else if(currentMap==='infra'){
    const v=INFRA_VULN[id]||.5;
    return {c:`rgb(${Math.round(lerp(14,180,v))},${Math.round(lerp(20,70,v))},${Math.round(lerp(14,0,v))})`,o:.28+v*.32};
  } else if(currentMap==='human'){
    const mx=Math.max(...Object.values(HUMAN_DENSITY));
    const t=(HUMAN_DENSITY[id]||0)/mx;
    return {c:`rgb(${Math.round(lerp(12,50,t))},${Math.round(lerp(14,28,t))},${Math.round(lerp(30,180,t))})`,o:.28+t*.32};
  }
  return {c:'#333',o:.3};
}

function getFilteredTotal(d) {
  if(!d) return 0;
  return CRIME_TYPES.filter(ct=>activeFilters.has(ct.id)).reduce((s,ct)=>s+(d[ct.id]||0),0);
}

function buildDistrictPolygons() {
  Object.entries(DISTRICTS_GEO).forEach(([id,geo])=>{
    if(districtLayers[id]) map.removeLayer(districtLayers[id]);
    const {c,o} = getDistrictColor(id);
    const poly = L.polygon(geo.coords,{
      color:'rgba(50,55,90,.65)', weight:1.5, fillColor:c, fillOpacity:o,
    });
    poly.on('mouseover', e=>{
      e.target.setStyle({weight:2.5,color:'rgba(255,60,95,.85)',fillOpacity:Math.min(o+.15,.78)});
      buildPopup(id, e.latlng);
    });
    poly.on('mouseout', e=>{
      if(selectedDist!==id)
        e.target.setStyle({weight:1.5,color:'rgba(50,55,90,.65)',fillOpacity:o});
      map.closePopup();
    });
    poly.on('click', ()=> focusDistrict(id===selectedDist ? null : id));
    poly.addTo(map);
    districtLayers[id] = poly;
  });
}

function refreshPolygonColors() {
  Object.entries(DISTRICTS_GEO).forEach(([id])=>{
    if(!districtLayers[id]) return;
    const {c,o} = getDistrictColor(id);
    if(id===selectedDist)
      districtLayers[id].setStyle({fillColor:c,fillOpacity:Math.min(o+.2,.82),weight:2.5,color:'rgba(255,60,95,.9)'});
    else
      districtLayers[id].setStyle({fillColor:c,fillOpacity:o,weight:1.5,color:'rgba(50,55,90,.65)'});
  });
}

function buildHeatmap() {
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
  let pts=[], grad={};
  if(currentMap==='crime'){
    const allTots=Object.keys(DISTRICTS_GEO).map(i=>getFilteredTotal(crimeData[i]||FALLBACK_CRIME[i]||{}));
    const mx=Math.max(...allTots)||1;
    Object.entries(DISTRICTS_GEO).forEach(([id,geo])=>{
      const d=crimeData[id]||FALLBACK_CRIME[id]||{};
      const t=getFilteredTotal(d)/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<14;i++)
        pts.push([lat+(Math.random()-.5)*.018, lng+(Math.random()-.5)*.025, t*(.7+Math.random()*.3)]);
    });
    grad={0:'#000033',.25:'#00008B',.5:'#8B0000',.75:'#FF4500',1:'#FF0000'};
  } else if(currentMap==='sigint'){
    Object.entries(SIGINT_COVERAGE).forEach(([id,cov])=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<10;i++)
        pts.push([lat+(Math.random()-.5)*.014,lng+(Math.random()-.5)*.020,cov*(.75+Math.random()*.25)]);
    });
    grad={0:'#001133',.3:'#003366',.6:'#0066AA',.85:'#00AAFF',1:'#00FFFF'};
  } else if(currentMap==='infra'){
    Object.entries(INFRA_VULN).forEach(([id,v])=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<10;i++)
        pts.push([lat+(Math.random()-.5)*.014,lng+(Math.random()-.5)*.020,v*(.75+Math.random()*.25)]);
    });
    grad={0:'#0a0a00',.3:'#332200',.6:'#884400',.85:'#FF8800',1:'#FFCC00'};
  } else if(currentMap==='human'){
    const mx=Math.max(...Object.values(HUMAN_DENSITY));
    Object.entries(HUMAN_DENSITY).forEach(([id,dens])=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const t=dens/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<12;i++)
        pts.push([lat+(Math.random()-.5)*.016,lng+(Math.random()-.5)*.022,t*(.7+Math.random()*.3)]);
    });
    grad={0:'#000022',.3:'#110044',.6:'#330099',.85:'#6633FF',1:'#AA66FF'};
  }
  heatLayer=L.heatLayer(pts,{radius:55,blur:35,maxZoom:16,max:1,gradient:grad}).addTo(map);
}

function buildInfraMarkers() {
  if(markerGroup){map.removeLayer(markerGroup);markerGroup=null;}
  if(currentMap!=='infra') return;
  markerGroup=L.layerGroup();
  const icons={power:'⚡',water:'💧',transport:'🚉',data:'⬡',hospital:'✚',gov:'★'};
  infraNodes.filter(n=>activeFilters.has(n.type)).forEach(n=>{
    const layer=INFRA_LAYERS.find(l=>l.id===n.type);
    if(!layer) return;
    const r=(n.crit===3?6:4);
    const m=L.circleMarker([n.lat,n.lng],{
      radius:r,fillColor:layer.color,color:layer.color,weight:n.crit===3?2:1,fillOpacity:.88
    });
    m.bindTooltip(
      `<div style="font-family:'DM Mono',monospace;font-size:11px;background:rgba(13,13,24,.96);
       border:1px solid #242438;border-radius:6px;padding:6px 10px;color:#e2e2f0">
       ${icons[n.type]||'●'} <strong>${n.name}</strong><br>
       <span style="color:#52526e">Criticality ${'★'.repeat(n.crit||1)}</span></div>`,
      {sticky:true,opacity:1,className:''}
    );
    markerGroup.addLayer(m);
  });
  markerGroup.addTo(map);
}

function buildPopup(id, latlng) {
  let html='';
  const name=DISTRICTS_GEO[id]?.name||id;
  if(currentMap==='crime'){
    const d=crimeData[id]||FALLBACK_CRIME[id]||{};
    const tot=getFilteredTotal(d);
    const risk=tot>14000?'HIGH':tot>7000?'ELEVATED':'MODERATE';
    const rc=risk==='HIGH'?'#ff3c5f':risk==='ELEVATED'?'#ffb800':'#00e5a0';
    const rows=CRIME_TYPES.filter(ct=>activeFilters.has(ct.id)).map(ct=>
      `<div class="pop-row"><div class="pop-dot" style="background:${ct.color}"></div>
       <span class="pop-label">${ct.label}</span>
       <span class="pop-val" style="color:${ct.color}">${(d[ct.id]||0).toLocaleString()}</span></div>`
    ).join('');
    const srcLabel=d.source==='api'?'Open Data BCN · CKAN API':'Mossos d\'Esquadra Report '+d.year;
    html=`<div class="pop-inner">
      <div class="pop-head"><div class="pop-name">${name}</div>
        <div class="pop-badge" style="background:${rc}22;border:1px solid ${rc}55;color:${rc}">${risk}</div></div>
      ${rows}<hr class="pop-div">
      <div class="pop-total"><span style="color:#52526e">TOTAL</span>
        <span style="color:#ff3c5f">${tot.toLocaleString()}</span></div>
      <div class="pop-src">📡 ${srcLabel} · ${d.year||2023}</div>
      </div>`;
  } else if(currentMap==='sigint'){
    const cov=SIGINT_COVERAGE[id]||.5;
    const q=cov>.85?'EXCELLENT':cov>.7?'GOOD':cov>.55?'MODERATE':'POOR';
    const qc=cov>.85?'#00e5a0':cov>.7?'#3da8ff':cov>.55?'#ffb800':'#ff3c5f';

      <div class="pop-head"><div class="pop-name">${name}</div>

        const col=cov>.85?'#00e5a0':cov>.7?'#3da8ff':cov>.55?'#ffb800':'#ff3c5f';
        return `<div class="list-card ${isSel?'selected':''}" onclick="focusDistrict('${id}')">
          <div class="lc-name">${DISTRICTS_GEO[id]?.name}</div>
          <div class="lc-bar"><div class="lc-seg" style="width:${cov*100}%;background:${col}"></div></div>
          <div class="lc-sub" style="color:${col}">${(cov*100).toFixed(0)}% RF coverage</div></div>`;
      }).join('');
  } else if(currentMap==='infra'){
    const sorted=Object.entries(INFRA_VULN).sort((a,b)=>b[1]-a[1]);
    el.innerHTML=`<div class="sb-label" style="margin-bottom:8px">Vulnerability · Ranked</div>`+
      sorted.map(([id,v])=>{
        const isSel=selectedDist===id;
        const col=v>.75?'#ff3c5f':v>.5?'#ffb800':v>.3?'#3da8ff':'#00e5a0';
        return `<div class="list-card ${isSel?'selected':''}" onclick="focusDistrict('${id}')">
          <div class="lc-name">${DISTRICTS_GEO[id]?.name}</div>
          <div class="lc-bar"><div class="lc-seg" style="width:${v*100}%;background:${col}"></div></div>
          <div class="lc-sub" style="color:${col}">${v>.75?'CRITICAL':v>.5?'HIGH':v>.3?'MODERATE':'LOW'} · ${Math.round(v*100)}/100</div></div>`;
      }).join('');
  } else if(currentMap==='human'){
    const sorted=Object.entries(HUMAN_INSTABILITY).sort((a,b)=>b[1]-a[1]);
    el.innerHTML=`<div class="sb-label" style="margin-bottom:8px">Instability · Ranked</div>`+
      sorted.map(([id,inst])=>{
        const isSel=selectedDist===id;
        const col=inst>.6?'#ff3c5f':inst>.4?'#ffb800':'#00e5a0';
        return `<div class="list-card ${isSel?'selected':''}" onclick="focusDistrict('${id}')">
          <div class="lc-name">${DISTRICTS_GEO[id]?.name}</div>
          <div class="lc-bar"><div class="lc-seg" style="width:${inst*100}%;background:${col}"></div></div>
          <div class="lc-sub" style="color:${col}">${(HUMAN_DENSITY[id]/1000).toFixed(0)}k/km² · instability ${Math.round(inst*100)}</div></div>`;
      }).join('');
  }
}

// ═══════════════════════════════════════════════════════════════
// HUD + CONTROLS
// ═══════════════════════════════════════════════════════════════
function buildHUD() {
  const hud=document.getElementById('hud');
  if(currentMap==='crime'){
    const all=Object.keys(DISTRICTS_GEO).map(id=>crimeData[id]||FALLBACK_CRIME[id]||{});
    const total=all.reduce((s,d)=>s+getFilteredTotal(d),0);
    const worst=Object.keys(DISTRICTS_GEO).sort((a,b)=>
      getFilteredTotal(crimeData[b]||FALLBACK_CRIME[b]||{})-getFilteredTotal(crimeData[a]||FALLBACK_CRIME[a]||{}))[0];
    hud.innerHTML=`<div class="hud-title">Total Incidents · ${(crimeData['1']||FALLBACK_CRIME['1']).year||2023}</div>
      <div class="hud-val" style="color:var(--accent)">${total.toLocaleString()}</div>
      <div class="hud-sub">All active categories</div><hr class="hud-div">
      <div class="hud-row"><span>Highest risk</span><span style="color:var(--accent)">${DISTRICTS_GEO[worst]?.name.split('–')[0]}</span></div>
      <div class="hud-row"><span>Source</span><span style="color:${dataSource==='api'?'var(--green)':'var(--amber)'}">${dataSource==='api'?'LIVE API':'VERIFIED'}</span></div>`;
  } else if(currentMap==='sigint'){
    const avg=Object.values(SIGINT_COVERAGE).reduce((a,b)=>a+b,0)/10;
    hud.innerHTML=`<div class="hud-title">Avg RF Coverage</div>
      <div class="hud-val" style="color:var(--cyan)">${(avg*100).toFixed(0)}%</div>
      <div class="hud-sub">City-wide signal quality</div><hr class="hud-div">
      <div class="hud-row"><span>Dead zones</span><span style="color:var(--accent)">3</span></div>
      <div class="hud-row"><span>Best coverage</span><span style="color:var(--green)">Ciutat Vella</span></div>`;
  } else if(currentMap==='infra'){
    const avg=Object.values(INFRA_VULN).reduce((a,b)=>a+b,0)/10;
    const crit=infraNodes.filter(n=>n.crit===3).length;
    hud.innerHTML=`<div class="hud-title">Threat Level</div>
      <div class="hud-val" style="color:var(--amber)">${avg>.65?'HIGH':'ELEVATED'}</div>
      <div class="hud-sub">Avg vuln. ${Math.round(avg*100)}/100</div><hr class="hud-div">
      <div class="hud-row"><span>Critical nodes</span><span style="color:var(--accent)">${crit}</span></div>
      <div class="hud-row"><span>Source</span><span style="color:var(--green)">OSM · Overpass</span></div>`;
  } else if(currentMap==='human'){
    const totPop=Object.values(HUMAN_DENSITY).reduce((a,b)=>a+b,0);
    const avgInst=Object.values(HUMAN_INSTABILITY).reduce((a,b)=>a+b,0)/10;
    hud.innerHTML=`<div class="hud-title">Population Index</div>
      <div class="hud-val" style="color:var(--purple)">${(totPop/1000).toFixed(0)}k</div>
      <div class="hud-sub">Total density monitored</div><hr class="hud-div">
      <div class="hud-row"><span>Avg instability</span><span style="color:var(--purple)">${Math.round(avgInst*100)}/100</span></div>
      <div class="hud-row"><span>Source</span><span style="color:var(--green)">Padró Municipal</span></div>`;
  }
}

function buildControls() {
  const gradients={
    crime:'linear-gradient(90deg,#000033,#8B0000,#FF0000)',
    sigint:'linear-gradient(90deg,#001133,#0066AA,#00FFFF)',
    infra:'linear-gradient(90deg,#0a0a00,#884400,#FFCC00)',
    human:'linear-gradient(90deg,#000022,#330099,#AA66FF)',
  };
  const labels={
    crime:['Low','High'],sigint:['Weak','Strong'],infra:['Low','Critical'],human:['Sparse','Dense']
  };
  const legends={
    crime:'Crime Intensity',sigint:'RF Coverage',infra:'Vulnerability',human:'Population Density'
  };
  const watermarks={
    crime:'BCN·INTEL / CRIME·LAYER\nSource: Mossos d\'Esquadra · Open Data BCN CKAN API',
    sigint:'BCN·INTEL / SIGINT·LAYER\nSource: OpenCelliD · RF Survey 2023',
    infra:'BCN·INTEL / INFRA·LAYER\nSource: OpenStreetMap · Overpass API',
    human:'BCN·INTEL / HUMINT·LAYER\nSource: Padró Municipal BCN · INE 2023',
  };
  const bbContents={
    crime:`<span class="bb-label">YEAR</span>
      <input type="range" id="yearSlider" min="2019" max="2024" value="2023" step="1">
      <span class="bb-val" id="yearLabel">2023</span>`,
    sigint:`<span class="bb-label">SIGNAL INTELLIGENCE</span><span class="bb-val">BARCELONA · RF SURVEY 2023</span>`,
    infra:`<span class="bb-label">CRITICAL INFRASTRUCTURE</span><span class="bb-val" style="color:var(--amber)">OSM · LIVE DATA</span>`,
    human:`<span class="bb-label">HUMAN TERRAIN</span><span class="bb-val" style="color:var(--purple)">PADRÓ MUNICIPAL · 2023</span>`,
  };

  document.getElementById('bottomBar').innerHTML=bbContents[currentMap];
  document.getElementById('legend').innerHTML=
    `<div class="legend-title">${legends[currentMap]}</div>
     <div class="legend-grad" style="background:${gradients[currentMap]}"></div>
     <div class="legend-ends"><span>${labels[currentMap][0]}</span><span>${labels[currentMap][1]}</span></div>`;
  document.getElementById('watermark').innerHTML=watermarks[currentMap].replace('\n','<br>');

  if(currentMap==='crime'){
    const sl=document.getElementById('yearSlider');
    if(sl) sl.addEventListener('input',e=>{
      yearFilter=parseInt(e.target.value);
      document.getElementById('yearLabel').textContent=yearFilter;
      // Scale fallback data by year factor
      const yf={2019:.88,2020:.72,2021:.79,2022:.91,2023:1.0,2024:.95};
      const f=yf[yearFilter]||1;
      Object.keys(DISTRICTS_GEO).forEach(id=>{
        const base=FALLBACK_CRIME[id];
        crimeData[id]={...base,
          theft:Math.round(base.theft*f),assault:Math.round(base.assault*f),
          robbery:Math.round(base.robbery*f),vandalism:Math.round(base.vandalism*f),
          drugs:Math.round(base.drugs*f),fraud:Math.round(base.fraud*f),
          total:Math.round(base.total*f),year:yearFilter,source:'fallback'};
      });
      refreshAll();
    });
  }
}

// ═══════════════════════════════════════════════════════════════
// FOCUS / TOGGLE HELPERS
// ═══════════════════════════════════════════════════════════════
function focusDistrict(id) {
  selectedDist=id;
  if(id){
    const geo=DISTRICTS_GEO[id];
    if(geo) map.fitBounds(L.latLngBounds(geo.coords),{padding:[40,40]});
  }
  refreshPolygonColors();
  buildList();
}

function toggleLayer(id) {
  if(activeFilters.has(id)){
    if(activeFilters.size===1) return;
    activeFilters.delete(id);
  } else activeFilters.add(id);
  const row=document.getElementById('lrow_'+id);
  if(row) row.classList.toggle('off',!activeFilters.has(id));
  refreshAll();
}

function refreshAll() {
  refreshPolygonColors();
  buildHeatmap();
  buildInfraMarkers();
  buildHUD();
  buildList();
}

// ═══════════════════════════════════════════════════════════════
// STATUS / LOADING / ERROR UI
// ═══════════════════════════════════════════════════════════════
function setStatus(state) {
  const dot=document.getElementById('statusDot');
  const txt=document.getElementById('statusText');
  if(state==='live'){
    dot.style.background='var(--green)';dot.style.boxShadow='0 0 6px var(--green)';
    txt.style.color='var(--green)';txt.textContent='LIVE';
  } else if(state==='offline'){
    dot.style.background='var(--amber)';dot.style.boxShadow='0 0 6px var(--amber)';
    txt.style.color='var(--amber)';txt.textContent='VERIFIED DATA';
  } else {
    dot.style.background='var(--muted)';dot.style.boxShadow='none';
    txt.style.color='var(--muted)';txt.textContent='CONNECTING';
  }
}
function showLoading(text,sub){
  const o=document.getElementById('loadingOverlay');
  document.getElementById('loadingText').textContent=text;
  document.getElementById('loadingSub').textContent=sub;
  o.classList.remove('hidden');
}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden')}
function showError(msg){
  const b=document.getElementById('errorBanner');
  if(msg){b.textContent=msg;b.style.display='block'}
  else b.style.display='none';
}

// ═══════════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════════
document.getElementById('mainNav').addEventListener('click',e=>{
  const tab=e.target.closest('.nav-tab');
  if(!tab) return;
  currentMap=tab.dataset.map;
  selectedDist=null;
  map.setView([41.3851,2.1734],13);
  map.closePopup();
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  const defaults={
    crime:new Set(CRIME_TYPES.map(l=>l.id)),
    sigint:new Set(SIGINT_LAYERS.map(l=>l.id)),
    infra:new Set(INFRA_LAYERS.map(l=>l.id)),
    human:new Set(HUMAN_LAYERS.map(l=>l.id)),
  };
  activeFilters=defaults[currentMap];
  buildSidebar();buildHUD();buildControls();
  buildDistrictPolygons();
  buildHeatmap();
  buildInfraMarkers();
  if(currentMap==='infra'&&!dataLoaded.infra) loadInfraData();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildSidebar();
buildHUD();
buildControls();
buildDistrictPolygons();
buildHeatmap();
// Load real data async
loadCrimeData();
loadInfraData();
</script>
</body>
</html>
