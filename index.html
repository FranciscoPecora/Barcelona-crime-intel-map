<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCN · City Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg:#040c18;
    --surface:#071525;
    --surface2:#0c1e33;
    --border:#102040;
    --border2:#1a3050;
    --text:#c0d4e8;
    --text2:#7090a8;
    --muted:#2a4060;
    --muted2:#406080;
    --accent:#00c8ff;
    --accent-dim:rgba(0,200,255,.08);
    --accent-line:rgba(0,200,255,.25);
    --green:#00e8a0;
    --green-dim:rgba(0,232,160,.06);
    --amber:#ffb040;
    --amber-dim:rgba(255,176,64,.06);
    --red:#ff3055;
    --red-dim:rgba(255,48,85,.06);
    --purple:#a060ff;
    --cyan:#00c8ff;
    --navy:#071525;
    --mono:'JetBrains Mono',monospace;
    --sans:'Outfit','Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    height:44px;display:flex;align-items:stretch;
    background:var(--bg);border-bottom:1px solid var(--border2);
  }
  .logo-block{
    width:200px;flex-shrink:0;padding:0 16px;
    border-right:1px solid var(--border2);
    display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  .logo{font-family:var(--mono);font-size:12px;font-weight:500;
    letter-spacing:.18em;color:#d0d8e8;text-transform:uppercase}
  .logo-sub{font-family:var(--mono);font-size:8px;color:var(--muted);
    letter-spacing:.14em;text-transform:uppercase}
  nav{display:flex;flex:1;height:100%;overflow-x:auto;padding:0 4px}
  nav::-webkit-scrollbar{display:none}
  .nav-tab{
    height:100%;padding:0 14px;border:none;
    border-bottom:1px solid transparent;
    border-top:1px solid transparent;
    font-family:var(--mono);font-size:10px;font-weight:400;
    letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;color:var(--muted);background:none;
    transition:color .15s,border-color .15s,background .15s;
    white-space:nowrap;position:relative;
  }
  .nav-tab:hover{color:var(--text2);background:rgba(74,158,255,.04)}
  .nav-tab.active{
    color:var(--accent);background:rgba(74,158,255,.06);
    border-bottom-color:var(--accent);
  }
  .nav-tab.active::after{
    content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
    background:var(--accent);box-shadow:0 0 8px var(--accent);
  }
  .header-right{
    display:flex;align-items:center;gap:0;padding:0;
    border-left:1px solid var(--border2);flex-shrink:0;
  }
  .feed-status{
    display:flex;flex-direction:column;justify-content:center;
    padding:0 10px;height:100%;border-right:1px solid var(--border2);
    gap:2px;min-width:72px;
  }
  .feed-label{font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .feed-val{font-family:var(--mono);font-size:10px;letter-spacing:.06em}
  .feed-val.live{color:var(--green)}
  .feed-val.offline{color:var(--muted)}
  .feed-val.connecting{color:var(--amber)}
  .sys-clock{
    display:flex;flex-direction:column;justify-content:center;
    padding:0 14px;height:100%;gap:2px;
  }
  .sys-clock .feed-label{color:var(--muted)}
  .sys-clock .clock-val{font-family:var(--mono);font-size:11px;color:var(--text2);letter-spacing:.08em}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .app{display:flex;height:100vh;padding-top:44px}
  .sidebar{
    width:210px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border2);
    display:flex;flex-direction:column;overflow:hidden;z-index:500;
  }
  .main{flex:1;position:relative;overflow:hidden}
  #map{width:100%;height:100%}
  .leaflet-container{background:#040c18 !important}

  .map-grid-overlay{
    position:absolute;inset:0;pointer-events:none;z-index:350;
    background-image:
      linear-gradient(rgba(0,200,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,.04) 1px, transparent 1px);
    background-size:80px 80px;
  }
  .map-edge{
    position:absolute;inset:0;pointer-events:none;z-index:351;
    background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(4,12,24,.7) 100%);
  }

  .leaflet-control-zoom{border:1px solid var(--border2) !important;border-radius:0 !important}
  .leaflet-control-zoom a{
    background:var(--surface) !important;color:var(--text2) !important;
    border-bottom:1px solid var(--border2) !important;border-radius:0 !important;
    font-size:16px !important;line-height:26px !important;
  }
  .leaflet-control-zoom a:hover{background:var(--surface2) !important;color:var(--text) !important}


  .sb-header{
    padding:12px 14px 10px;border-bottom:1px solid var(--border2);
    flex-shrink:0;
  }
  .sb-map-label{
    font-family:var(--mono);font-size:8px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3px;
  }
  .sb-title{font-family:var(--mono);font-size:11px;font-weight:500;color:#c8d4e8;margin-bottom:1px;letter-spacing:.06em;text-transform:uppercase}
  .sb-meta{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .data-source{
    display:flex;align-items:center;gap:8px;
    padding:5px 14px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .ds-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;animation:pulse 2.5s infinite}
  .ds-text{font-family:var(--mono);font-size:8px;letter-spacing:.08em;flex:1;text-transform:uppercase}
  .ds-time{font-family:var(--mono);font-size:8px;color:var(--muted)}

  .sb-section{padding:8px 14px 6px;border-bottom:1px solid var(--border);flex-shrink:0}
  .sb-label{
    font-family:var(--mono);font-size:8px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  .layer-row{
    display:flex;align-items:center;gap:8px;margin-bottom:1px;
    cursor:pointer;padding:3px 4px;transition:background .1s;
  }
  .layer-row:hover{background:rgba(74,158,255,.04)}
  .layer-icon{width:2px;height:12px;flex-shrink:0;transition:opacity .15s}
  .layer-label{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--text2);flex:1;letter-spacing:.04em}
  .layer-row.off .layer-icon{opacity:.12}
  .layer-row.off .layer-label{color:var(--muted)}
  .layer-row input{display:none}

  .sb-list{padding:6px 0;flex:1;overflow-y:auto}
  .sb-list::-webkit-scrollbar{width:2px}
  .sb-list::-webkit-scrollbar-thumb{background:var(--border2)}
  .sb-list-label{
    font-family:var(--mono);font-size:8px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
    padding:0 14px;margin-bottom:4px;
  }
  .list-card{
    padding:7px 14px;border-left:2px solid transparent;
    margin-bottom:0;cursor:pointer;transition:all .1s;
    border-bottom:1px solid var(--border);
  }
  .list-card:hover{background:rgba(74,158,255,.04);border-left-color:var(--accent-line)}
  .list-card.selected{background:rgba(74,158,255,.06);border-left-color:var(--accent)}
  .lc-name{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text);margin-bottom:4px;letter-spacing:.04em}
  .lc-bar{height:1px;background:var(--border);overflow:hidden;margin-bottom:4px;position:relative}
  .lc-seg{height:100%;position:absolute;left:0;top:0;transition:width .3s}
  .lc-sub{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.06em}

  .hud{
    position:absolute;top:52px;right:10px;z-index:500;
    background:rgba(4,12,24,.92);border:1px solid var(--border2);
    min-width:210px;backdrop-filter:blur(8px);
  }
  .hud-header{
    padding:6px 12px;border-bottom:1px solid var(--border2);
    font-family:var(--mono);font-size:8px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  .hud-body{padding:10px 12px}
  .hud-val{font-family:var(--mono);font-size:24px;font-weight:400;line-height:1;margin-bottom:2px;letter-spacing:-.01em}
  .hud-sub{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .hud-div{border:none;border-top:1px solid var(--border);margin:8px 0}
  .hud-row{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:9px;margin-bottom:3px;letter-spacing:.04em;
  }
  .hud-row span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hud-row span:last-child{color:var(--text2)}

  .infra-popup .leaflet-popup-content-wrapper{
    background:rgba(4,12,24,.96) !important;
    border:1px solid rgba(0,200,255,.2) !important;
    border-radius:0 !important;
    box-shadow:0 4px 24px rgba(0,0,0,.8) !important;
    padding:0 !important;
  }
  .infra-popup .leaflet-popup-content{margin:0 !important}
  .infra-popup .leaflet-popup-tip{background:rgba(4,12,24,.96) !important}
  .infra-popup .leaflet-popup-close-button{color:rgba(112,144,168,.6) !important;padding:6px !important}
  .pulse-marker{position:relative}
  .pulse-ring{
    position:absolute;border-radius:50%;
    border:1px solid currentColor;
    animation:ringPulse 2s ease-out infinite;
    pointer-events:none;
  }
  @keyframes ringPulse{
    0%{transform:translate(-50%,-50%) scale(1);opacity:.8}
    100%{transform:translate(-50%,-50%) scale(2.8);opacity:0}
  }

  .activity-feed{
    position:absolute;bottom:40px;left:220px;z-index:500;
    width:280px;max-height:120px;overflow:hidden;
    pointer-events:none;
  }
  .activity-item{
    font-family:var(--mono);font-size:9px;color:var(--muted2);
    letter-spacing:.04em;padding:2px 0;
    display:flex;gap:8px;align-items:baseline;
    animation:slideIn .3s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .activity-time{color:var(--muted);flex-shrink:0}
  .activity-text{color:var(--text2)}
  .activity-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:3px}


  .error-banner{
    position:absolute;top:0;left:0;right:0;z-index:600;
    background:var(--amber-dim);border-bottom:1px solid rgba(245,158,11,.2);
    padding:5px 16px;font-family:var(--mono);font-size:9px;
    color:var(--amber);letter-spacing:.06em;text-transform:uppercase;
    display:none;
  }

  .bottom-bar{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:500;
    background:rgba(10,13,21,.85);border:1px solid var(--border2);
    padding:5px 16px;display:flex;align-items:center;gap:14px;white-space:nowrap;
    backdrop-filter:blur(4px);
  }
  .bb-label{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .bb-val{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:.06em}
  .coord-display{
    position:absolute;bottom:10px;right:180px;z-index:500;
    font-family:var(--mono);font-size:9px;color:var(--muted2);
    letter-spacing:.08em;background:rgba(10,13,21,.7);
    border:1px solid var(--border);padding:4px 10px;
  }

  .legend{
    position:absolute;bottom:12px;right:12px;z-index:500;
    background:var(--surface);border:1px solid var(--border2);
    padding:0;font-size:10px;min-width:130px;
  }
  .legend-title{
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);
    padding:6px 10px;border-bottom:1px solid var(--border);
  }
  .legend-body{padding:8px 10px}
  .legend-grad{width:110px;height:4px;margin-bottom:4px}
  .legend-ends{
    display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:9px;color:var(--muted);width:110px;
  }

  .watermark{
    position:absolute;bottom:12px;left:12px;z-index:500;
    font-family:var(--mono);font-size:8px;
    color:var(--muted);letter-spacing:.05em;line-height:1.8;pointer-events:none;
    text-transform:uppercase;opacity:.6;
  }

  .leaflet-popup-content-wrapper{
    background:rgba(4,12,24,.96) !important;border:1px solid var(--border2) !important;
    border-radius:0 !important;box-shadow:0 4px 32px rgba(0,0,0,.8),0 0 0 1px rgba(0,200,255,.1) !important;
    color:var(--text) !important;font-family:var(--mono) !important;padding:0 !important;
    backdrop-filter:blur(12px);
  }
  .leaflet-tooltip{
    background:transparent !important;border:none !important;box-shadow:none !important;
    padding:0 !important;
  }
  .leaflet-tooltip-top:before,.leaflet-tooltip-bottom:before,
  .leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none !important}
  .leaflet-popup-content{margin:0 !important}
  .leaflet-popup-tip-container{display:none}
  .leaflet-popup-close-button{
    color:var(--muted) !important;padding:8px !important;
    font-size:14px !important;top:4px !important;right:4px !important;
  }
  .pop-inner{padding:12px 14px}
  .pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pop-name{font-family:var(--mono);font-size:11px;font-weight:500;color:#c0d4e8;letter-spacing:.1em;text-transform:uppercase}
  .pop-badge{
    font-family:var(--mono);font-size:7px;padding:2px 6px;letter-spacing:.12em;text-transform:uppercase;
  }
  .pop-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .pop-dot{width:2px;height:10px;flex-shrink:0}
  .pop-label{font-family:var(--mono);font-size:9px;color:var(--muted2);flex:1;letter-spacing:.06em;text-transform:uppercase}
  .pop-val{font-family:var(--mono);font-size:10px;font-weight:400}
  .pop-div{border:none;border-top:1px solid var(--border);margin:7px 0}
  .pop-total{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px}
  .pop-src{font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:6px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>

<div id="landingOverlay" style="position:fixed;inset:0;z-index:9000;background:#000;overflow:hidden;cursor:none">
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
  <div class="classify">OSINT · Unclassified</div>
  <div class="timestamp" id="ts"></div>
  <div class="stage" id="stage">
    <div class="eye-container">
      <canvas id="eyeCanvas" width="800" height="348"></canvas>
    </div>
    <div class="wordmark">
      <h1>PROVI<span></span>DENCE</h1>
      <p>City Intelligence Platform</p>
      <p style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-top:8px">Francisco Pecora</p>
    </div>
    <div class="enter-wrap">
      <a class="enter-btn" href="#" id="enterBtn">
        <span>Enter Platform</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>
</div>

<style>
#landingOverlay *{margin:0;padding:0;box-sizing:border-box}
#landingOverlay{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
#landingOverlay::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:10;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.01) 2px,rgba(255,255,255,.01) 4px)}
.cursor{position:fixed;width:6px;height:6px;background:#fff;border-radius:50%;
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
  transition:transform .1s,width .2s,height .2s,background .2s;mix-blend-mode:difference}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(255,255,255,.25);
  border-radius:50%;pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);transition:all .12s ease}
.bracket{position:fixed;width:28px;height:28px;border-color:rgba(255,255,255,.1);border-style:solid;z-index:20}
.tl{top:24px;left:24px;border-width:1px 0 0 1px}
.tr{top:24px;right:24px;border-width:1px 1px 0 0}
.bl{bottom:24px;left:24px;border-width:0 0 1px 1px}
.br{bottom:24px;right:24px;border-width:0 1px 1px 0}
.classify{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;
  color:rgba(255,255,255,.4);text-transform:uppercase;
  border:1px solid rgba(255,255,255,.12);padding:3px 12px}
.timestamp{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;
  color:rgba(255,255,255,.18);text-transform:uppercase}
.stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;
  animation:stageIn 1.4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes stageIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.eye-container{position:relative;width:400px;height:174px}
canvas#eyeCanvas{position:absolute;inset:0;width:100%;height:100%}
.wordmark{text-align:center;animation:wordIn .9s 1s cubic-bezier(.16,1,.3,1) both}
@keyframes wordIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.wordmark h1{font-size:32px;font-weight:600;letter-spacing:.35em;color:#fff;text-transform:uppercase}
.wordmark h1 span{color:#3b82f6}
.wordmark p{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-top:8px}
.enter-wrap{animation:wordIn .9s 1.8s cubic-bezier(.16,1,.3,1) both}
.enter-btn{display:inline-flex;align-items:center;gap:12px;padding:11px 36px;background:transparent;
  border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.45);
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  cursor:none;transition:all .25s;text-decoration:none}
.enter-btn:hover{border-color:rgba(59,130,246,.55);color:#3b82f6;background:rgba(59,130,246,.07)}
.arrow{transition:transform .25s;font-size:14px}
.enter-btn:hover .arrow{transform:translateX(4px)}
#landingOverlay.fade-out{animation:fadeOut .65s ease forwards;pointer-events:none}
@keyframes fadeOut{to{opacity:0;transform:scale(1.025)}}
</style>

<header>
  <div class="logo-block">
    <div class="logo">PROVIDENCE</div>
    <div class="logo-sub">City Intelligence Platform · BCN</div>
  </div>
  <nav id="mainNav">
    <button class="nav-tab active" data-map="crime">Crime Analysis</button>
    <button class="nav-tab" data-map="sigint">SIGINT / RF</button>
    <button class="nav-tab" data-map="infra">Infrastructure</button>
    <button class="nav-tab" data-map="human">Human Terrain</button>
    <button class="nav-tab" data-map="maritime">Maritime</button>
    <button class="nav-tab" data-map="aircraft">Air Traffic</button>
    <button class="nav-tab" data-map="transit">Transit</button>
    <button class="nav-tab" data-map="analysis">Analysis</button>
  </nav>
  <div class="header-right">
    <div class="feed-status">
      <div class="feed-label">Crime</div>
      <div class="feed-val connecting" id="crimeFeedStatus">—</div>
    </div>
    <div class="feed-status">
      <div class="feed-label">AIS</div>
      <div class="feed-val offline" id="aisFeedStatus">—</div>
    </div>
    <div class="feed-status">
      <div class="feed-label">ADS-B</div>
      <div class="feed-val offline" id="adsbFeedStatus">—</div>
    </div>
    <div class="feed-status">
      <div class="feed-label">Rail</div>
      <div class="feed-val offline" id="railFeedStatus">—</div>
    </div>
    <div class="feed-status">
      <div class="feed-label">Padró</div>
      <div class="feed-val offline" id="popFeedStatus">—</div>
    </div>

// Tries each public Overpass mirror in turn (the main instance is frequently
// overloaded/rate-limited) and returns the first successful, well-formed response.
async function overpassFetch(query, timeoutMs=30000) {
  let lastErr = new Error('No Overpass mirrors configured');
  for(const base of OVERPASS_MIRRORS) {
    const controller = new AbortController();
    const tid = setTimeout(()=>controller.abort(), timeoutMs);
    try {
      const res = await fetch(`${base}?data=${encodeURIComponent(query)}`, {signal: controller.signal});
      clearTimeout(tid);
      if(!res.ok) throw new Error(`HTTP ${res.status} from ${base}`);
      const data = await res.json();
      if(!data || !Array.isArray(data.elements)) throw new Error(`Malformed response from ${base}`);
      return data;
    } catch(e) {
      clearTimeout(tid);
      console.warn(`Overpass mirror failed (${base}):`, e.message);
      lastErr = e;
    }
  }
  throw lastErr;
}

async function loadDistrictGeoJSON() {
  try {
    const url = 'https://raw.githubusercontent.com/martgnz/bcn-geodata/master/districtes/districtes.geojson';
    const res  = await fetch(url);
    if(!res.ok) throw new Error('GeoJSON fetch failed');
    const geo  = await res.json();
    geo.features.forEach(f => {
      const code = String(parseInt(f.properties.c_distri || f.properties.DISTRICTE || 0));
      const name = f.properties.n_distri   || f.properties.NOM        || DISTRICTS_GEO[code]?.name;
      if(!code || !DISTRICTS_GEO[code]) return;
      let coords = f.geometry.type === 'Polygon'
        ? f.geometry.coordinates[0]
        : f.geometry.coordinates[0][0];
      const step = Math.max(1, Math.floor(coords.length / 40));
      coords = coords.filter((_,i) => i % step === 0);
      DISTRICTS_GEO[code] = { name, coords: coords.map(([lng,lat]) => [lat,lng]) };
    });
    console.log('Loaded official BCN district boundaries from CartoBCN');
    const recomputed = computeRealCoverage();
    Object.assign(SIGINT_COVERAGE, recomputed.coverage);
    Object.assign(TOWER_COUNTS, recomputed.counts);
    Object.values(districtLayers).forEach(l => map.removeLayer(l));
    Object.keys(districtLayers).forEach(k => delete districtLayers[k]);
    buildDistrictPolygons();
    buildHeatmap();
    buildInfraMarkers();
  } catch(e) {
    console.warn('GeoJSON unavailable, using approximate boundaries:', e.message);
  }
}

async function proxyFetch(url, timeoutMs=8000) {
  const controller = new AbortController();
  const tid = setTimeout(()=>controller.abort(), timeoutMs);
  const isConfigured = WORKER_URL && !WORKER_URL.includes('YOUR-WORKER');
  const fetchUrl = isConfigured
    ? `${WORKER_URL}?url=${encodeURIComponent(url)}`
    : url;
  try {
    const res = await fetch(fetchUrl, {signal:controller.signal});
    clearTimeout(tid);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

const MOSSOS_API = 'https://analisi.transparenciacatalunya.cat/resource/qnyt-emjc.json';

const ABP_TO_DISTRICT = {
  'ABP Ciutat Vella':       '1',
  'ABP Eixample':           '2',
  'ABP Sants-Montjuïc':     '3',
  'ABP Les Corts':          '4',

};

function mapCrimeType(tipus) {
  const t = tipus.toLowerCase();
  if(t.includes('furt') || t.includes('robatori i furt d\'ús')) return 'theft';
  if(t.includes('lesion') || t.includes('lesió') || t.includes('homicidi') || t.includes('agressions sexuals')) return 'assault';
  if(t.includes('robatori amb violència') || t.includes('robatori amb força')) return 'robbery';
  if(t.includes('danys')) return 'vandalism';
  if(t.includes('droga') || t.includes('estupefaent') || t.includes('salut pública')) return 'drugs';
  if(t.includes('estaf') || t.includes('frau') || t.includes('falsedad') || t.includes('falsedats')) return 'fraud';
  return null;
}

async function loadCrimeData() {
  setStatus('connecting');
  crimeData   = structuredClone(FALLBACK_CRIME);
  dataSource  = 'fallback';
  lastUpdated = new Date('2024-02-14');
  dataLoaded.crime = true;
  hideLoading();
  refreshAll();

  try {
    const soql =
      `?$select=rea_b_sica_policial_abp,tipus_de_fet,sum(total_coneguts) AS total` +
      `&$where=any='2024'` +
      `&$group=rea_b_sica_policial_abp,tipus_de_fet` +
      `&$limit=5000`;
    const apiUrl = `${MOSSOS_API}${soql}`;

    const records = await proxyFetch(apiUrl, 8000);
    if (!Array.isArray(records) || !records.length) throw new Error('No records');

    const parsed = {};
    records.forEach(r => {
      const code = ABP_TO_DISTRICT[r['rea_b_sica_policial_abp'] || ''];
      if (!code) return;
      if (!parsed[code])
        parsed[code] = { theft:0, assault:0, robbery:0, vandalism:0, drugs:0, fraud:0, total:0, year:2024, source:'api' };
      const count    = parseInt(r['total'] || 0, 10) || 0;
      const category = mapCrimeType(r['tipus_de_fet'] || '');
      if (category) parsed[code][category] += count;
      parsed[code].total += count;
    });

    const districtCount = Object.keys(parsed).length;
    if (districtCount >= 8) {
      crimeData   = parsed;
      dataSource  = 'api';
      lastUpdated = new Date();
      setStatus('live');
      showError(null);
      logActivity(`Crime feed · ${districtCount} districts · Mossos 2024 (full-year)`, 'var(--red)');
      if (currentMap === 'crime') refreshAll();
    } else {
      throw new Error(`Only ${districtCount} districts parsed`);
    }
  } catch(err) {
    console.warn('Mossos API unavailable, using fallback:', err.message);
    setStatus('offline');
    showError("Mossos d'Esquadra · Official figures · Falls back to verified baseline");
  }
}

async function loadInfraData() {
  const bbox = '41.30,2.05,41.50,2.25';
  const query = `[out:json][timeout:40];
(
  node["amenity"="police"](${bbox});
  way["amenity"="police"](${bbox});
  node["amenity"="fire_station"](${bbox});
  way["amenity"="fire_station"](${bbox});
  node["amenity"="townhall"](${bbox});
  node["office"="government"](${bbox});
  node["office"="diplomatic"](${bbox});
  node["amenity"="embassy"](${bbox});
  way["amenity"="townhall"](${bbox});
  way["office"="government"](${bbox});
  way["office"="diplomatic"](${bbox});
  node["amenity"="hospital"](${bbox});
  way["amenity"="hospital"](${bbox});
  node["amenity"="clinic"](${bbox});
  node["landuse"="military"](${bbox});
  way["landuse"="military"](${bbox});
);
out center tags;`;

  try {
    const data = await overpassFetch(query, 45000);
    const nodes = data.elements.map(el => {
      const lat = el.lat || el.center?.lat;
      const lng = el.lon || el.center?.lon;
      if(!lat || !lng) return null;
      const tags = el.tags || {};
      const amenity = tags.amenity || '';
      const office = tags.office || '';
      const landuse = tags.landuse || '';
      let type, crit;
      if(amenity==='police') { type='police'; crit=3; }
      else if(amenity==='fire_station') { type='fire'; crit=3; }
      else if(amenity==='townhall'||office==='government') { type='gov'; crit=3; }
      else if(office==='diplomatic'||amenity==='embassy') { type='embassy'; crit=3; }
      else if(amenity==='hospital') { type='hospital'; crit=3; }
      else if(amenity==='clinic') { type='hospital'; crit=2; }
      else if(landuse==='military') { type='military'; crit=3; }
      else return null;
      const name = tags.name || tags['name:en'] || tags['name:ca'] || type;
      const website = tags.website || tags['contact:website'] || tags['url'] || null;
      const phone = tags.phone || tags['contact:phone'] || null;
      return {lat, lng, type, name, crit, website, phone};
    }).filter(Boolean);

    if(nodes.length > 5) {
      infraNodes = nodes;
      console.log(`Loaded ${nodes.length} real infrastructure nodes from OSM`);
      showError(null);
    } else {
      infraNodes = STATIC_INFRA_NODES;
      showError(`Live OSM query returned too few results (${nodes.length}) — showing ${STATIC_INFRA_NODES.length} verified baseline nodes instead.`);
    }
    dataLoaded.infra = true;
  } catch(err) {
    console.warn('Overpass unavailable on all mirrors:', err.message);
    infraNodes = STATIC_INFRA_NODES;
    dataLoaded.infra = true;
    showError(`Live OSM infrastructure data unavailable (Overpass unreachable: ${err.message}) — showing ${STATIC_INFRA_NODES.length} verified baseline nodes.`);
  }
  if(currentMap==='infra') refreshAll();
}

async function loadCCTVData() {
  const CCTV_RESOURCE = 'cd1957a6-a06e-4a90-80bb-83e0e4c2d6e9';
  const url = `${CKAN_BASE}/datastore_search?resource_id=${CCTV_RESOURCE}&limit=500`;
  try {
    const data = await proxyFetch(url, 10000);
    if(!data.success || !data.result.records.length) throw new Error('No CCTV records');
    cctvNodes = data.result.records
      .map(r => {
        const lat = parseFloat(r['Latitud']  || r['latitud']  || r['LATITUD']  || 0);
        const lng = parseFloat(r['Longitud'] || r['longitud'] || r['LONGITUD'] || 0);
        if(!lat || !lng || lat < 41.2 || lat > 41.6 || lng < 1.9 || lng > 2.4) return null;
        return {
          lat, lng,
          district: String(r['Codi_Districte'] || r['codi_districte'] || ''),
          name:     String(r['Nom_Districte']  || r['nom_districte']  || 'Camera'),
          type:     String(r['Tipus_Camera']   || r['tipus_camera']   || 'CCTV'),
        };
      })
      .filter(Boolean);
    dataLoaded.cctv = true;
    console.log(`Loaded ${cctvNodes.length} real CCTV cameras from Open Data BCN`);
    if(currentMap==='sigint') {
      const metaEl = document.querySelector('.sb-meta');
      if(metaEl) metaEl.textContent = `Open Data BCN · ${cctvNodes.length} real cameras`;
      buildList();
      buildHeatmap();
      buildCCTVMarkers();
    }
  } catch(err) {
    console.warn('CCTV API unavailable:', err.message);
    dataLoaded.cctv = true;
  }
}

async function loadPopulationData() {
  const url = `${CKAN_BASE}/datastore_search?resource_id=${POPULATION_RESOURCE}&limit=7000`;
  try {
    const data = await proxyFetch(url, 12000);
    if(!data.success || !data.result.records.length) throw new Error('No population records');

    const totalByDistrict = {};
    const foreignByDistrict = {};

    data.result.records.forEach(r => {
      const rawCode = r['Codi_Districte'] || r['codi_districte'] || '';
      const code = String(parseInt(rawCode) || '').trim();
      if(!code || !DISTRICTS_GEO[code]) return;
      const nat  = parseInt(r['NACIONALITAT_G'] || 0);
      const val  = parseInt(r['Valor'] || 0) || 0;
      if(!totalByDistrict[code])   totalByDistrict[code]   = 0;
      if(!foreignByDistrict[code]) foreignByDistrict[code] = 0;
      totalByDistrict[code] += val;
      if(nat === 2 || nat === 3 || nat === 4) foreignByDistrict[code] += val;
    });

    const districtAreas = {'1':4.4,'2':7.5,'3':22.9,'4':6.0,'5':20.1,'6':4.2,'7':12.0,'8':8.0,'9':6.6,'10':10.8};
    Object.keys(totalByDistrict).forEach(code => {
      const area = districtAreas[code] || 10;
      HUMAN_DENSITY[code] = Math.round(totalByDistrict[code] / area);
    });
    foreignPopByDistrict = foreignByDistrict;

    dataLoaded.population = true;
    console.log('Loaded real 2025 population data:', totalByDistrict);
    setFeedStatus('popFeedStatus','live','2025');
    logActivity('Population feed · Padró Municipal BCN 2025', 'var(--accent)');

    if(currentMap==='human'){
      const metaEl = document.querySelector('.sb-meta');
      if(metaEl) metaEl.textContent = 'Padró Municipal BCN · 2025 · Live';
      buildList(); buildHUD(); buildHeatmap();
    }
    showError(null);
  } catch(err) {
    console.warn('Population API unavailable:', err.message);
    HUMAN_DENSITY = {...HUMAN_DENSITY_FALLBACK};
    dataLoaded.population = true;
  }
}

function getWebsiteForNode(n) {
  if(n.website && n.website.startsWith('http')) return n.website;
  return KNOWN_WEBSITES[n.name] || null;
}

function lerp(a,b,t){return a+(b-a)*t}

function getNodesForDistrict(districtId) {
  if(!infraNodes.length) return [];
  const geo = DISTRICTS_GEO[districtId];
  if(!geo) return [];
  return infraNodes.filter(n => {
    return pointInLatLng(n.lat, n.lng, geo.coords);
  });
}

function getNodeCountByDistrict() {
  const counts = {};
  Object.keys(DISTRICTS_GEO).forEach(id => {
    counts[id] = getNodesForDistrict(id).length;
  });
  return counts;
}

function getInfraNodeDensity(id) {
  const nodes = getNodesForDistrict(id);
  const criticalCount = nodes.filter(n => n.crit === 3).length;
  const totalCount = nodes.length;
  return { totalCount, criticalCount };
}



function getDistrictColor(id) {
  if(currentMap==='maritime'||currentMap==='aircraft') return {c:'rgba(20,25,35,0.1)',o:.1};
  if(currentMap==='crime'){
    const d=crimeData[id]||FALLBACK_CRIME[id]||{};
    const tot=getFilteredTotal(d);
    const allTots=Object.keys(DISTRICTS_GEO).map(i=>getFilteredTotal(crimeData[i]||FALLBACK_CRIME[i]||{}));
    const mx=Math.max(...allTots)||1;
    const t=tot/mx;
    return {c:`rgb(${Math.round(lerp(20,220,t))},${Math.round(lerp(20,40,t))},${Math.round(lerp(50,65,t))})`,o:.18+t*.22};
  } else if(currentMap==='sigint'){
    const cov=SIGINT_COVERAGE[id]||.5;
    return {c:`rgb(${Math.round(lerp(10,0,cov))},${Math.round(lerp(10,80,cov))},${Math.round(lerp(25,130,cov))})`,o:.15+cov*.18};
  } else if(currentMap==='infra'){
    const {totalCount}=getInfraNodeDensity(id);
    const allCounts=Object.keys(DISTRICTS_GEO).map(i=>getInfraNodeDensity(i).totalCount);
    const mx=Math.max(...allCounts)||1;
    const t=totalCount/mx;
    return {c:`rgb(${Math.round(lerp(14,180,t))},${Math.round(lerp(20,70,t))},${Math.round(lerp(14,0,t))})`,o:.15+t*.22};
  } else if(currentMap==='human'){
    const mx=Math.max(...Object.values(HUMAN_DENSITY));
    const t=(HUMAN_DENSITY[id]||0)/mx;
    return {c:`rgb(${Math.round(lerp(12,50,t))},${Math.round(lerp(14,28,t))},${Math.round(lerp(30,180,t))})`,o:.15+t*.22};
  }
  return {c:'#333',o:.3};
}

function getFilteredTotal(d) {
  if(!d) return 0;
  return CRIME_TYPES.filter(ct=>activeFilters.has(ct.id)).reduce((s,ct)=>s+(d[ct.id]||0),0);
}

function buildDistrictPolygons() {
  Object.entries(DISTRICTS_GEO).forEach(([id,geo])=>{
    if(districtLayers[id]) map.removeLayer(districtLayers[id]);
    const {c,o} = getDistrictColor(id);
    const poly = L.polygon(geo.coords,{
      color:'rgba(0,200,255,0.2)', weight:1, fillColor:c, fillOpacity:o,
      dashArray: null,
    });
    poly.on('mouseover', e=>{
      e.target.setStyle({weight:1.5,color:'rgba(0,200,255,0.7)',fillOpacity:Math.min(o+.12,.75)});
      buildPopup(id, e.latlng);
    });
    poly.on('mouseout', e=>{
      if(selectedDist!==id)
        e.target.setStyle({weight:1,color:'rgba(0,200,255,0.2)',fillOpacity:o});
      map.closePopup();
    });
    poly.on('click', ()=> focusDistrict(id===selectedDist ? null : id));
    poly.addTo(map);
    districtLayers[id] = poly;
  });
}

function refreshPolygonColors() {
  Object.entries(DISTRICTS_GEO).forEach(([id])=>{
    if(!districtLayers[id]) return;
    const {c,o} = getDistrictColor(id);
    if(id===selectedDist)
      districtLayers[id].setStyle({fillColor:c,fillOpacity:Math.min(o+.15,.8),weight:2,color:'rgba(0,200,255,0.9)'});
    else
      districtLayers[id].setStyle({fillColor:c,fillOpacity:o,weight:1,color:'rgba(0,200,255,0.2)'});
  });
}

function buildHeatmap() {
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
  return;

  let pts=[], grad={};
  if(currentMap==='crime'){
    const allTots=Object.keys(DISTRICTS_GEO).map(i=>getFilteredTotal(crimeData[i]||FALLBACK_CRIME[i]||{}));
    const mx=Math.max(...allTots)||1;
    Object.entries(DISTRICTS_GEO).forEach(([id,geo])=>{
      const d=crimeData[id]||FALLBACK_CRIME[id]||{};
      const t=getFilteredTotal(d)/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<20;i++)
        pts.push([lat+(Math.random()-.5)*.018, lng+(Math.random()-.5)*.025, t*(.6+Math.random()*.4)]);
    });
    grad={0:'#000033',.25:'#00008B',.5:'#8B0000',.75:'#FF4500',1:'#FF0000'};
  } else if(currentMap==='sigint'){
    Object.entries(SIGINT_COVERAGE).forEach(([id,cov])=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<15;i++)
        pts.push([lat+(Math.random()-.5)*.014,lng+(Math.random()-.5)*.020,cov*(.7+Math.random()*.3)]);
    });
    grad={0:'#001133',.3:'#003366',.6:'#0066AA',.85:'#00AAFF',1:'#00FFFF'};
  } else if(currentMap==='infra'){
    const allCounts=Object.keys(DISTRICTS_GEO).map(id=>getInfraNodeDensity(id).totalCount);
    const mx=Math.max(...allCounts)||1;
    Object.keys(DISTRICTS_GEO).forEach(id=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const t=getInfraNodeDensity(id).totalCount/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<15;i++)
        pts.push([lat+(Math.random()-.5)*.014,lng+(Math.random()-.5)*.020,t*(.7+Math.random()*.3)]);
    });
    grad={0:'#0a0a00',.3:'#332200',.6:'#884400',.85:'#FF8800',1:'#FFCC00'};
  } else if(currentMap==='human'){
    const mx=Math.max(...Object.values(HUMAN_DENSITY));

      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const t=dens/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<15;i++)
        pts.push([lat+(Math.random()-.5)*.016,lng+(Math.random()-.5)*.022,t*(.7+Math.random()*.3)]);
    });
    grad={0:'#000022',.3:'#110044',.6:'#330099',.85:'#6633FF',1:'#AA66FF'};
  }
  heatLayer=L.heatLayer(pts,{radius:55,blur:35,maxZoom:16,max:1,gradient:grad}).addTo(map);
}

function computeRealCoverage() {
  const counts = {};
  Object.keys(DISTRICTS_GEO).forEach(id => counts[id] = 0);
  REAL_CELL_TOWERS.forEach(t => {
    for(const [id, geo] of Object.entries(DISTRICTS_GEO)) {
      const pts = geo.coords.map(([la,ln]) => [la,ln]);
      if(pointInLatLng(t.lat, t.lng, pts)) { counts[id]++; break; }
    }
  });
  const max = Math.max(...Object.values(counts)) || 1;
  const coverage = {};
  Object.keys(counts).forEach(id => {
    coverage[id] = Math.min(0.45 + (counts[id]/max)*0.52, 0.99);
  });
  return {coverage, counts};
}

function pointInLatLng(lat, lng, poly) {
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if(((xi>lat)!==(xj>lat))&&(lng<(yj-yi)*(lat-xi)/(xj-xi)+yi)) inside=!inside;
  }
  return inside;
}

function toggleLayer(id) {
  if(activeFilters.has(id)){
    if(activeFilters.size===1) return;
    activeFilters.delete(id);
  } else activeFilters.add(id);
  const row=document.getElementById('lrow_'+id);
  if(row) row.classList.toggle('off',!activeFilters.has(id));
  refreshAll();
}

  buildHeatmap();
  buildInfraMarkers();
  buildHUD();
  buildList();
}

// Single source of truth for tab isolation: removes every layer/marker/interval
// belonging to every special tab, unconditionally, before any tab-specific logic
// runs. This replaces scattered per-tab cleanup blocks (the cause of previous
// cross-tab leaks) with one wall that can't be bypassed by adding a new tab.
function wipeAllTabLayers() {
  // Maritime
  if(aisSocket){ aisSocket.close(); aisSocket=null; }
  if(maritimeMarkers){ map.removeLayer(maritimeMarkers); maritimeMarkers=null; }
  vesselMarkerMap = {};
  maritimeVessels = {};
  aisKeyFailCount = 0;

  // Air Traffic
  if(aircraftInterval){ clearInterval(aircraftInterval); aircraftInterval=null; }
  if(aircraftMarkers){ map.removeLayer(aircraftMarkers); aircraftMarkers=null; }

  // Infrastructure / SIGINT (shared layer)
  if(markerGroup){ map.removeLayer(markerGroup); markerGroup=null; }

  // Transit (Rodalies + Metro + Bus)
  if(transitInterval){ clearInterval(transitInterval); transitInterval=null; }
  if(tmbMetroInterval){ clearInterval(tmbMetroInterval); tmbMetroInterval=null; }
  if(transitMarkers){ map.removeLayer(transitMarkers); transitMarkers=null; }
  if(metroLayerGroup){ map.removeLayer(metroLayerGroup); metroLayerGroup=null; }
  if(busLayerGroup){ map.removeLayer(busLayerGroup); busLayerGroup=null; }
  if(metroVehicleLayer){ map.removeLayer(metroVehicleLayer); metroVehicleLayer=null; }
  if(busVehicleLayer){ map.removeLayer(busVehicleLayer); busVehicleLayer=null; }
  metroVehicleMarkers = {};
  busVehicleMarkers = {};
  transitVehicleMarkerMap = {};
  transitVehicles = {};

  // District heatmap (shared, currently unused but wiped defensively)
  if(heatLayer){ map.removeLayer(heatLayer); heatLayer=null; }
}

document.getElementById('mainNav').addEventListener('click',e=>{
  const tab=e.target.closest('.nav-tab');
  if(!tab) return;
  const prevMap = currentMap;
  currentMap=tab.dataset.map;
  wipeAllTabLayers();

  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');

  const analysisPanel = document.getElementById('analysisPanel');
  if(currentMap === 'analysis') {
    analysisPanel.style.display = 'block';
    buildAnalysisPanel();
    document.getElementById('hud').style.display = 'none';
    document.getElementById('sidebar').style.display = 'none';
    if(riskLayerActive) stopRiskLayer();
    return;
  } else {
    analysisPanel.style.display = 'none';
    document.getElementById('hud').style.display = '';
    document.getElementById('sidebar').style.display = '';
  }

  if(prevMap === 'crime' && currentMap !== 'crime' && riskLayerActive) {
    stopRiskLayer();
  }

  selectedDist=null;
  map.setView([41.3951,2.1734],12);
  map.closePopup();

  const defaults={
    crime:new Set(CRIME_TYPES.map(l=>l.id)),
    sigint:new Set(SIGINT_LAYERS.map(l=>l.id)),
    infra:new Set(INFRA_LAYERS.map(l=>l.id)),
    human:new Set(HUMAN_LAYERS.map(l=>l.id)),
    maritime:new Set(MARITIME_LAYERS.map(l=>l.id)),
    aircraft:new Set(AIRCRAFT_LAYERS.map(l=>l.id)),
    transit:new Set(TRANSIT_LAYERS.map(l=>l.id).filter(id=>id!=='bus')),
  };
  activeFilters=defaults[currentMap]||new Set();

  buildSidebar();buildHUD();buildControls();
  buildDistrictPolygons();
  buildHeatmap();
  buildInfraMarkers();

  if(currentMap==='infra'&&!dataLoaded.infra) loadInfraData();
  if(currentMap==='sigint'&&!dataLoaded.cctv) loadCCTVData();
  if(currentMap==='human'&&!dataLoaded.population) loadPopulationData();
  if(currentMap==='maritime'){
    map.setView([41.37,2.16],11);
    connectAIS();
  }
  if(currentMap==='aircraft'){
    map.setView([41.40,2.15],10);
    fetchAircraft();
    aircraftInterval=setInterval(fetchAircraft,10000);
  }
  if(currentMap==='transit'){
    map.setView([41.3951,2.1734],11);
    fetchTransit();
    transitInterval=setInterval(fetchTransit,20000);
    loadMetroData().then(()=>{ loadTmbGtfsStops().then(fetchTmbMetroLive); });
    loadBusData();
    if(TMB_CONFIGURED && !tmbMetroInterval) tmbMetroInterval = setInterval(fetchTmbMetroLive, 25000);
  }
});

function connectAIS() {
  if(currentMap !== 'maritime') return;
  if(aisSocket) aisSocket.close();

  fetch(`${WORKER_URL}/ais-key`, {signal: AbortSignal.timeout(6000)})
    .then(r => {
      if(!r.ok) throw new Error(`HTTP ${r.status} from /ais-key`);
      return r.json();
    })
    .then(data => {
      if(!data.key) throw new Error('Worker returned no AIS key');
      aisKeyFailCount = 0;
      _connectAISWithKey(data.key);
    })
    .catch((err) => {
      aisKeyFailCount++;
      console.warn(`AIS key fetch failed (attempt ${aisKeyFailCount}):`, err.message);
      if(aisKeyFailCount === 2 && Object.keys(maritimeVessels).length === 0) {
        showError(`AIS feed unavailable (${err.message}) — showing demo vessels. Check that the Worker exposes a working /ais-key route.`);
        loadMaritimeFallback();
      }
      if(currentMap === 'maritime') setTimeout(connectAIS, 8000);
    });
}

function _connectAISWithKey(apiKey) {
  aisSocket = new WebSocket('wss://stream.aisstream.io/v0/stream');

  aisSocket.onopen = () => {
    aisSocket.send(JSON.stringify({
      APIkey: apiKey,
      BoundingBoxes: [AIS_BBOX],
      FilterMessageTypes: ['PositionReport','ShipStaticData']
    }));
    // Clear any demo/fallback vessels now that a live connection is up
    const hadDemo = Object.values(maritimeVessels).some(v=>v.demo);
    if(hadDemo) {
      maritimeVessels = {};
      vesselMarkerMap = {};
      if(maritimeMarkers) { map.removeLayer(maritimeMarkers); maritimeMarkers = null; }
    }
    setStatus('live');
    setFeedStatus('aisFeedStatus','live','Live');
    showError(null);
    logActivity('AIS stream connected · Barcelona coast', 'var(--green)');
    console.log('AIS WebSocket connected — live vessel tracking active');
  };

  aisSocket.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      const mmsi = String(msg.MetaData?.MMSI || '');
      if(!mmsi) return;

      const lat = msg.MetaData?.latitude;
      const lng = msg.MetaData?.longitude;

      if(msg.Message?.ShipStaticData) {
        const sd = msg.Message.ShipStaticData;
        const name = (sd.Name || msg.MetaData?.ShipName || '').trim() || `MMSI:${mmsi}`;
        const typeCode = sd.Type || 0;
        const [cat, typeName] = getShipCategory(typeCode);
        if(!maritimeVessels[mmsi]) maritimeVessels[mmsi] = {mmsi, lat:lat||0, lng:lng||0, name, cat, typeName, sog:0, cog:0, updated:Date.now()};
        else { maritimeVessels[mmsi].name = name; maritimeVessels[mmsi].cat = cat; maritimeVessels[mmsi].typeName = typeName; }
      }

      if(msg.Message?.PositionReport && lat && lng) {
        const pr = msg.Message.PositionReport;
        const sog = pr.Sog || 0;
        const cog = pr.Cog || 0;

        const likelyOnLand = (lng < 2.10 && lat > 41.28 && lat < 41.55);
        if(likelyOnLand) return;

        if(!maritimeVessels[mmsi]) {
          const name = (msg.MetaData?.ShipName || '').trim() || `MMSI:${mmsi}`;
          maritimeVessels[mmsi] = {mmsi, lat, lng, name, cat:'other', typeName:'Unknown', sog, cog, updated:Date.now()};
        } else {
          maritimeVessels[mmsi].lat = lat;
          maritimeVessels[mmsi].lng = lng;
          maritimeVessels[mmsi].sog = sog;
          maritimeVessels[mmsi].cog = cog;
          maritimeVessels[mmsi].updated = Date.now();
        }

        if(currentMap === 'maritime') updateSingleVessel(maritimeVessels[mmsi]);
        if(sog > 1 && Math.random() < 0.05) {
          logActivity(`${maritimeVessels[mmsi].name || mmsi} · ${sog.toFixed(1)}kn · ${maritimeVessels[mmsi].typeName}`, 'var(--green)');
        }
      }
    } catch(e) { console.warn('AIS parse error:', e); }
  };

  aisSocket.onerror = (e) => {
    console.warn('AIS WebSocket error', e);
    if(Object.keys(maritimeVessels).length === 0) loadMaritimeFallback();
  };

  aisSocket.onclose = () => {
    console.log('AIS WebSocket closed — reconnecting in 5s');
    setFeedStatus('aisFeedStatus','connecting','...');
    if(currentMap === 'maritime') setTimeout(connectAIS, 5000);
  };

  setTimeout(() => {
    if(Object.keys(maritimeVessels).length === 0 && currentMap === 'maritime') {
      loadMaritimeFallback();
    }
  }, 45000);
}

async function fetchAircraft() {
  if(currentMap !== 'aircraft') return;
  try {
    const apiUrl = 'https://api.adsb.lol/v2/lat/41.39/lon/2.17/dist/40';
    const workerUrl = `${WORKER_URL}?url=${encodeURIComponent(apiUrl)}`;
    const res = await fetch(workerUrl, {signal: AbortSignal.timeout(15000)});
    if(!res.ok) throw new Error(`HTTP ${res.status} from proxy — check that api.adsb.lol is allowlisted on the Cloudflare Worker`);
    const data = await res.json();
    if(!data.ac) throw new Error('No aircraft data in response');

    aircraftData = {};
    data.ac.forEach(a => {
      const lat = a.lat, lng = a.lon;
      if(!lat || !lng) return;
      const callsign = (a.flight||'').trim();
      const alt = a.alt_baro === 'ground' ? 0 : (a.alt_baro || a.alt_geom || 0);
      const spd = Math.round(a.gs||0);
      const hdg = Math.round(a.track||0);
      if(alt < 50) return;

      let cat = 'commercial';
      if(/^(UPS|FDX|DHL|TNT|CAO)/.test(callsign)) cat = 'cargo_air';
      else if(alt < 3000 && spd < 150) cat = 'helicopter';
      else if(!callsign || callsign.length < 3) cat = 'private';

      aircraftData[a.hex] = {icao:a.hex, callsign:callsign||a.hex, lat, lng, alt:Math.round(alt), spd, hdg, cat};
    });

    updateAircraftMarkers();
    setFeedStatus('adsbFeedStatus','live','Live');
    logActivity(`ADS-B · ${Object.keys(aircraftData).length} aircraft · El Prat FIR`, 'var(--amber)');
    console.log(`ADS-B: ${Object.keys(aircraftData).length} aircraft`);
    showError(null);
  } catch(err) {
    console.warn('ADS-B fetch failed:', err.message);
    setFeedStatus('adsbFeedStatus','offline','—');
    if(Object.keys(aircraftData).length === 0) {
      loadAircraftFallback();
      showError(`Live ADS-B feed unavailable (${err.message}) — showing demo aircraft. Check the Worker's domain allowlist for api.adsb.lol.`);

  }
}

// TRANSIT — Renfe GTFS-Realtime · Live Rodalies train positions
// Public JSON feed (CC BY 4.0), updates ~20s. Routed through the
// same Cloudflare Worker used for ADS-B, since Renfe's CORS policy
// is unconfirmed from the browser.
// ═══════════════════════════════════════════════════════════════
let transitVehicles = {};
let transitMarkers = null;
let transitInterval = null;
let transitVehicleMarkerMap = {};

const RENFE_FEED_URL = 'https://gtfsrt.renfe.com/vehicle_positions.json';
const RODALIES_BCN_LINES = new Set([
  'R1','R2','R2N','R2S','R3','R4','R7','R8',
  'R11','R12','R13','R14','R15','R16','RL3','RL4','RG1'
]);

function extractLineCode(label) {
  const match = (label||'').match(/^([A-Z]+\d*[A-Z]?)-/);
  return match ? match[1] : null;
}

async function fetchTransit() {
  if(currentMap !== 'transit') return;
  try {
    const workerUrl = `${WORKER_URL}?url=${encodeURIComponent(RENFE_FEED_URL)}`;
    const res = await fetch(workerUrl, {signal: AbortSignal.timeout(10000)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if(!data.entity) throw new Error('No transit data');

    const seen = new Set();
    data.entity.forEach(entity => {
      const v = entity.vehicle;
      if(!v?.position) return;
      const lineCode = extractLineCode(v.vehicle?.label);
      if(!lineCode || !RODALIES_BCN_LINES.has(lineCode)) return;

      const id = v.vehicle.id;
      seen.add(id);
      const newPos = [v.position.latitude, v.position.longitude];
      const bearing = (typeof v.position.bearing === 'number') ? v.position.bearing : null;

      if(transitVehicles[id]) {
        transitVehicles[id].from = transitVehicles[id].to;
        transitVehicles[id].to = newPos;
        transitVehicles[id].tStart = performance.now();
        transitVehicles[id].status = v.currentStatus;
        transitVehicles[id].line = lineCode;
        transitVehicles[id].stopId = v.stopId || null;
        transitVehicles[id].bearing = bearing;
      } else {
        transitVehicles[id] = {
          id, line: lineCode, from: newPos, to: newPos,
          tStart: performance.now(), status: v.currentStatus,
          stopId: v.stopId || null, bearing
        };
      }
    });

    // Drop vehicles no longer reported (left the network / feed rolled over)
    Object.keys(transitVehicles).forEach(id => { if(!seen.has(id)) delete transitVehicles[id]; });

    if(currentMap === 'transit') {
      updateTransitMarkers();
      buildHUD();
      buildList();
    }
    setFeedStatus('railFeedStatus','live','Live');
    logActivity(`Rodalies feed · ${seen.size} trains · Barcelona lines`, 'var(--green)');
  } catch(err) {
    console.warn('Renfe transit fetch failed:', err.message);
    setFeedStatus('railFeedStatus','offline','—');
  }
}

// Fly the map to a train and briefly pop its tooltip. Called from the
// sidebar train list (click-to-fly) via onclick="flyToTrain('id')".
function flyToTrain(id) {
  const marker = transitVehicleMarkerMap[id];
  const train = transitVehicles[id];
  if(!marker || !train) return;
  if(currentMap !== 'transit') return;

  const latlng = marker.getLatLng();
  map.flyTo(latlng, 15, {duration: 1.1});

  setTimeout(() => {
    marker.openTooltip();
    setTimeout(() => { marker.closeTooltip(); }, 2200);
  }, 1150);
}

function updateTransitMarkers() {
  if(!activeFilters.has('rodalies')) {
    if(transitMarkers){map.removeLayer(transitMarkers);transitMarkers=null;}
    transitVehicleMarkerMap = {};
    return;
  }
  if(!transitMarkers) transitMarkers = L.layerGroup().addTo(map);

  const activeIds = new Set(Object.keys(transitVehicles));
  Object.keys(transitVehicleMarkerMap).forEach(id => {
    if(!activeIds.has(id)) {
      transitMarkers.removeLayer(transitVehicleMarkerMap[id]);
      delete transitVehicleMarkerMap[id];
    }
  });

  Object.values(transitVehicles).forEach(t => {
    if(transitVehicleMarkerMap[t.id]) {
      transitVehicleMarkerMap[t.id].setIcon(getTransitIcon(t.bearing));
      transitVehicleMarkerMap[t.id].setTooltipContent(getTransitTooltip(t));
    } else {
      const m = L.marker(t.to, {icon: getTransitIcon(t.bearing)});
      m.bindTooltip(getTransitTooltip(t), {sticky:true, opacity:1, className:''});
      m.on('click', () => flyToTrain(t.id));
      transitMarkers.addLayer(m);
      transitVehicleMarkerMap[t.id] = m;
    }
  });
}

// Smooth glide between ~20s polls — runs continuously in the background,
// only moves markers while the transit tab is actually open.
function animateTransit() {
  if(currentMap === 'transit') {
    const now = performance.now();
    Object.values(transitVehicles).forEach(t => {
      const marker = transitVehicleMarkerMap[t.id];
      if(!marker) return;
      const dur = 20000;
      const frac = Math.min((now - t.tStart) / dur, 1);
      const lat = t.from[0] + (t.to[0] - t.from[0]) * frac;
      const lng = t.from[1] + (t.to[1] - t.from[1]) * frac;
      marker.setLatLng([lat, lng]);
    });
  }
  requestAnimationFrame(animateTransit);
}
requestAnimationFrame(animateTransit);

// ── Geometry / simulation engine ──
// OSM stores each direction of a route (and sometimes seasonal/night variants) as
// a separate relation. Without merging these, every line gets counted 2-4x over,
// which inflates both visual clutter and the number of simulated vehicles spawned.
// Reconstructs a single continuous, correctly-ordered path from a set of
// unordered/mixed-direction OSM way segments by greedily chaining whichever
// remaining segment's start or end point is closest to the current path's
// current end (reversing that segment if it connects backwards).
function stitchSegments(segments) {
  if(!segments.length) return [];
  const segs = segments.filter(s=>s && s.length>1).map(s=>s.slice());
  if(!segs.length) return [];
  const used = new Array(segs.length).fill(false);
  let path = segs[0].slice();
  used[0] = true;
  let remaining = segs.length - 1;

  while(remaining > 0) {
    const tail = path[path.length-1];
    let bestIdx = -1, bestReverse = false, bestDist = Infinity;
    for(let i=0;i<segs.length;i++){
      if(used[i]) continue;
      const s = segs[i];
      const dStart = haversineM(tail[0],tail[1], s[0][0],s[0][1]);
      const dEnd   = haversineM(tail[0],tail[1], s[s.length-1][0],s[s.length-1][1]);
      if(dStart < bestDist){ bestDist=dStart; bestIdx=i; bestReverse=false; }
      if(dEnd < bestDist){ bestDist=dEnd; bestIdx=i; bestReverse=true; }
    }
    if(bestIdx === -1) break;
    const seg = bestReverse ? segs[bestIdx].slice().reverse() : segs[bestIdx];
    path.push(...seg);
    used[bestIdx] = true;
    remaining--;
  }
  return path;
}

function dedupeLinesByRef(lines) {
  const byRef = {};
  lines.forEach(line=>{
    const key = line.ref || line.name;
    if(!key) return;
    if(!byRef[key]) {
      byRef[key] = {ref:key, name:line.name, colour:line.colour, segments:[], stopSequence:[], variants:[]};
    }
    byRef[key].segments.push(...line.segments);
    byRef[key].stopSequence.push(...(line.stopSequence||[]));
    byRef[key].variants.push(line.segments); // each direction/variant kept separate for path reconstruction
  });
  return Object.values(byRef).map(line=>{
    // De-duplicate stops that are effectively the same physical location
    // (different relation variants often repeat the same platform node).
    const seen = new Set();
    line.stopSequence = line.stopSequence.filter(s=>{
      const key = `${s.lat.toFixed(5)},${s.lng.toFixed(5)}`;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    // Use only ONE direction's geometry for the simulated path — the ping-pong
    // simulation already provides the return trip, so combining both directions
    // here would double back on itself and zigzag. Pick whichever variant has
    // the most total points as the fuller/more representative direction.
    let best = line.variants[0] || [];
    let bestLen = best.reduce((s,seg)=>s+seg.length,0);
    line.variants.forEach(v=>{
      const len = v.reduce((s,seg)=>s+seg.length,0);
      if(len > bestLen){ bestLen = len; best = v; }
    });
    line.primaryPath = stitchSegments(best);
    delete line.variants;
    return line;
  });
}

function haversineM(lat1,lng1,lat2,lng2) {
  const R = 6371000, toRad = d=>d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}

// Flattens a line's segments into one ordered path with cumulative distance, and
// projects the line's ordered stops onto the nearest point along that path so a
// simulated vehicle can pause there. Run once per line when data loads.
function buildLineRuntime(line) {
  const path = (line.primaryPath && line.primaryPath.length >= 2) ? line.primaryPath : line.segments.flat();
  if(path.length < 2) return null;
  const cum = [0];
  for(let i=1;i<path.length;i++){
    cum.push(cum[i-1] + haversineM(path[i-1][0],path[i-1][1], path[i][0],path[i][1]));
  }
  const totalDist = cum[cum.length-1];
  if(!totalDist) return null;

  const stopSeq = line.stopSequence || [];
  const stopDists = [...new Set(stopSeq.map(s=>{
    let best = 0, bestD = Infinity;
    for(let i=0;i<path.length;i++){
      const d = haversineM(s.lat,s.lng, path[i][0],path[i][1]);
      if(d < bestD){ bestD = d; best = cum[i]; }
    }
    return Math.round(best);
  }))].sort((a,b)=>a-b).filter(d=>d>5 && d<totalDist-5);

  return {path, cum, totalDist, stopDists};
}

function pointAtDistance(runtime, dist) {
  const {path, cum, totalDist} = runtime;
  const d = Math.max(0, Math.min(totalDist, dist));
  let i = 1;
  while(i < cum.length && cum[i] < d) i++;
  i = Math.min(i, path.length-1);
  const segStart = cum[i-1], segEnd = cum[i];
  const t = segEnd>segStart ? (d-segStart)/(segEnd-segStart) : 0;
  const [lat1,lng1] = path[i-1], [lat2,lng2] = path[i];
  return { lat: lat1+(lat2-lat1)*t, lng: lng1+(lng2-lng1)*t };
}

// Builds one full there-and-back timetable (a list of travel/dwell segments with
// start/end times) for a line, given a speed and per-stop dwell time.
function buildRoundTripTimeline(runtime, speedMps, dwellMs) {
  const totalDist = runtime.totalDist;
  const waypoints = [0, ...runtime.stopDists, totalDist];
  const timeline = [];
  let t = 0;

  function addDirection(points) {
    for(let i=0;i<points.length-1;i++){
      const d0=points[i], d1=points[i+1];
      const dur = (Math.abs(d1-d0)/speedMps)*1000;
      timeline.push({tStart:t, tEnd:t+dur, distStart:d0, distEnd:d1, stopped:false});
      t += dur;
      if(i < points.length-2){
        timeline.push({tStart:t, tEnd:t+dwellMs, distStart:d1, distEnd:d1, stopped:true});
        t += dwellMs;
      }
    }
  }
  addDirection(waypoints);
  addDirection([...waypoints].reverse());
  return {timeline, cycleMs: t || 1};
}

function positionOnTimeline(runtime, tl, nowMs, phaseMs) {
  const t = ((nowMs + phaseMs) % tl.cycleMs + tl.cycleMs) % tl.cycleMs;
  for(const seg of tl.timeline){
    if(t >= seg.tStart && t <= seg.tEnd){
      const frac = seg.tEnd>seg.tStart ? (t-seg.tStart)/(seg.tEnd-seg.tStart) : 1;
      const dist = seg.distStart + (seg.distEnd-seg.distStart)*frac;
      return {...pointAtDistance(runtime, dist), stopped:seg.stopped};
    }
  }
  return {...pointAtDistance(runtime, 0), stopped:true};
}

// ── Real TMB live data ──
// Two calls: (1) once, download+parse TMB's GTFS static feed to get the numeric
// station codes the real-time API requires (matched to our OSM stations by
// proximity); (2) repeatedly, fetch live next-arrival ETAs for those codes and
// use them to place each line's vehicle between its two soonest-arrival stations,
// weighted by ETA — a position derived directly from TMB's official real-time data.
let tmbStopsList = [];        // [{id, code, name, lat, lng}] from GTFS stops.txt
let tmbMetroLiveData = {};    // lineRef -> [{dist, eta}]
let tmbMetroInterval = null;

function splitCsvLine(line) {
  const out = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(c === '"'){ inQuotes = !inQuotes; continue; }
    if(c === ',' && !inQuotes){ out.push(cur); cur=''; continue; }
    cur += c;
  }
  out.push(cur);
  return out;
}

function parseGtfsStops(csvText) {
  const lines = csvText.split(/\r?\n/).filter(Boolean);
  if(!lines.length) return [];
  const header = splitCsvLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));
  const idx = name => header.indexOf(name);
  const iId=idx('stop_id'), iCode=idx('stop_code'), iName=idx('stop_name'), iLat=idx('stop_lat'), iLon=idx('stop_lon');
  const out = [];
  for(let i=1;i<lines.length;i++){
    const cols = splitCsvLine(lines[i]);
    if(cols.length <= Math.max(iId,iName,iLat,iLon)) continue;
    out.push({
      id: cols[iId],
      code: iCode>=0 && cols[iCode] ? cols[iCode] : cols[iId],
      name: cols[iName],
      lat: parseFloat(cols[iLat]),
      lng: parseFloat(cols[iLon]),
    });
  }
  return out;
}

function matchTmbStopsToMetro() {
  if(!tmbStopsList.length || !metroStations.length) return;
  let matched = 0;
  metroStations.forEach(s=>{
    let best=null, bestD=Infinity;
    tmbStopsList.forEach(t=>{
      if(!isFinite(t.lat) || !isFinite(t.lng)) return;
      const d = haversineM(s.lat,s.lng,t.lat,t.lng);
      if(d<bestD){ bestD=d; best=t; }
    });
    if(best && bestD < 80){ s.tmbCode = best.code; matched++; }
  });
  console.log(`Matched ${matched}/${metroStations.length} metro stations to TMB codes`);
}

async function loadTmbGtfsStops() {
  if(!TMB_CONFIGURED || tmbStopsList.length) return;

  const cached = loadNetworkCache('providence_tmb_stops_v1');
  if(cached){ tmbStopsList = cached; matchTmbStopsToMetro(); return; }

  try {
    const gtfsUrl = `https://api.tmb.cat/v1/static/datasets/gtfs.zip?app_id=${TMB_APP_ID}&app_key=${TMB_APP_KEY}`;
    const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(gtfsUrl)}`, {signal: AbortSignal.timeout(30000)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const stopsFile = zip.file('stops.txt');
    if(!stopsFile) throw new Error('stops.txt not found in GTFS feed');
    const text = await stopsFile.async('string');
    tmbStopsList = parseGtfsStops(text);
    if(tmbStopsList.length) saveNetworkCache('providence_tmb_stops_v1', tmbStopsList);
    console.log(`Loaded ${tmbStopsList.length} TMB GTFS stops`);
    matchTmbStopsToMetro();
  } catch(e) {
    console.warn('TMB GTFS stops load failed:', e.message);
  }
}

async function fetchTmbMetroLive() {
  if(!TMB_CONFIGURED) return;
  const codes = [...new Set(metroStations.map(s=>s.tmbCode).filter(Boolean))];
  if(!codes.length) return;

  const chunks = [];
  for(let i=0;i<codes.length;i+=40) chunks.push(codes.slice(i,i+40));

  const results = await Promise.allSettled(chunks.map(async chunk=>{
    const apiUrl = `https://api.tmb.cat/v1/itransit/metro/estacions?estacions=${chunk.join(',')}&app_id=${TMB_APP_ID}&app_key=${TMB_APP_KEY}`;
    const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(apiUrl)}`, {signal: AbortSignal.timeout(10000)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }));

  const byLine = {}; // ref -> [{code, eta}]
  let anyOk = false;
  results.forEach(r=>{
    if(r.status!=='fulfilled') return;
    anyOk = true;
    (r.value.linies||[]).forEach(l=>{
      const ref = l.nom_linia;
      (l.estacions||[]).forEach(st=>{
        (st.linies_trajectes||[]).forEach(tr=>{
          const trains = tr.propers_trens||[];
          if(!trains.length) return;
          const eta = Math.min(...trains.map(t=>Number(t.temps_arribada)).filter(n=>isFinite(n)));
          // TMB returns the next SCHEDULED train even when service is closed for the
          // night — that can be 20+ minutes or hours away. Only treat an ETA as a real
          // "train currently approaching" signal if it's genuinely imminent.
          if(!isFinite(eta) || eta > 900 || eta < 0) return;
          (byLine[ref] = byLine[ref]||[]).push({code:String(st.codi_estacio), eta});
        });
      });
    });
  });

  const newData = {};
  metroLines.forEach(line=>{
    const entries = byLine[line.ref];
    if(!entries || !line.runtime) return;
    const {path, cum} = line.runtime;
    const withDist = entries.map(e=>{
      const st = metroStations.find(s=>s.tmbCode===e.code);
      if(!st) return null;
      let bestD=Infinity, bestDist=0;
      for(let i=0;i<path.length;i++){
        const d = haversineM(st.lat,st.lng,path[i][0],path[i][1]);
        if(d<bestD){ bestD=d; bestDist=cum[i]; }
      }
      return {dist:bestDist, eta:e.eta};
    }).filter(Boolean);
    if(withDist.length>=2) newData[line.ref] = withDist;
  });

  tmbMetroLiveData = newData;
  if(anyOk && Object.keys(newData).length){
    if(!tmbLiveOk) logActivity(`TMB live · ${Object.keys(newData).length} metro lines · real ETA data`, '#ff6600');
    tmbLiveOk = true;
  }
}

// Positions a vehicle between the two soonest-arrival stations on a line,
// weighted by ETA (closer ETA = closer to that station) — a real position
// calculated from TMB's official arrival predictions, not GPS, not a guess.
function liveEtaPosition(line) {
  const entries = tmbMetroLiveData[line.ref];
  if(!entries || entries.length<2 || !line.runtime) return null;
  const sorted = [...entries].sort((a,b)=>a.eta-b.eta);
  const [p1,p2] = sorted;
  const w = p1.eta + p2.eta;
  const dist = w>0 ? p1.dist + (p2.dist-p1.dist)*(p1.eta/w) : p1.dist;
  return {...pointAtDistance(line.runtime, dist), stopped:p1.eta<20};
}

// ── Local cache for metro/bus network geometry ──
// This network barely changes year to year, so once Overpass succeeds we save
// the parsed result and skip hitting any Overpass mirror on future page loads.
// Makes the tab load instantly and removes the dependency on a volunteer-run
// public API being available at demo time.
const NETWORK_CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000; // 30 days

function saveNetworkCache(key, payload) {
  try {
    localStorage.setItem(key, JSON.stringify({ t: Date.now(), payload }));
  } catch(e) {
    console.warn(`Could not cache "${key}" (localStorage unavailable or full):`, e.message);
  }
}

function loadNetworkCache(key) {
  try {
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const {t, payload} = JSON.parse(raw);
    if(!payload || Date.now() - t > NETWORK_CACHE_TTL_MS) return null;
    return payload;
  } catch(e) {
    return null;
  }
}

function stripLineForCache(line) {
  return {ref:line.ref, name:line.name, colour:line.colour, segments:line.segments,
          stopSequence:line.stopSequence, primaryPath:line.primaryPath};
}

async function loadMetroData() {
  if(dataLoaded.metro) return;

  const cached = loadNetworkCache('providence_metro_v2');
  if(cached) {
    metroLines = cached.metroLines;
    metroStations = cached.metroStations;
    metroLines.forEach(line=>{
      line.runtime = buildLineRuntime(line);
      line.timeline = line.runtime ? buildRoundTripTimeline(line.runtime, METRO_SPEED_MPS, METRO_DWELL_MS) : null;
    });
    dataLoaded.metro = true;
    console.log(`Loaded ${metroLines.length} metro lines, ${metroStations.length} stations from local cache`);
    logActivity(`Metro feed · ${metroLines.length} lines · ${metroStations.length} stations · cached`, '#ff6600');
    if(currentMap==='transit'){ updateAllTransitLayers(); buildHUD(); buildList(); }
    return;
  }
  const bbox = '41.30,2.05,41.50,2.25';
  const query = `[out:json][timeout:45];
(
  relation["route"="subway"](${bbox});
);
(._;>>;);
out geom;`;
  try {
    const data = await overpassFetch(query, 50000);

    const relations = data.elements.filter(e=>e.type==='relation');
    const wayById = {};
    data.elements.filter(e=>e.type==='way').forEach(w=>{ wayById[w.id]=w; });
    const nodeById = {};
    data.elements.filter(e=>e.type==='node').forEach(n=>{ nodeById[n.id]=n; });

    const lines = [];
    const stationsMap = {};

    relations.forEach(rel=>{
      const tags = rel.tags||{};
      const ref = (tags.ref||tags.name||'').trim();
      const colour = tags.colour || METRO_LINE_COLORS[ref] || '#ff6600';
      const segments = [];
      const stopSequence = [];
      (rel.members||[]).forEach(m=>{
        if(m.type==='way'){
          const w = wayById[m.ref];
          if(w && w.geometry) segments.push(w.geometry.map(pt=>[pt.lat,pt.lon]));
        } else if(m.type==='node'){
          const n = nodeById[m.ref];
          if(!n) return;
          const role = m.role || '';
          const looksLikeStop = role.includes('stop') || role.includes('platform') ||
            (n.tags && (n.tags.railway==='station' || n.tags.station==='subway' ||
              n.tags.public_transport==='station' || n.tags.public_transport==='stop_position'));
          if(looksLikeStop){
            const name = (n.tags && n.tags.name) || 'Station';
            if(!stationsMap[n.id]) stationsMap[n.id]={lat:n.lat,lng:n.lon,name,lines:new Set()};
            stationsMap[n.id].lines.add(ref);
            stopSequence.push({lat:n.lat,lng:n.lon,name});
          }
        }
      });
      if(segments.length) lines.push({ref, name:tags.name||ref, colour, segments, stopSequence});
    });

    metroLines = dedupeLinesByRef(lines);
    metroStations = Object.values(stationsMap).map(s=>({...s, lines:[...s.lines]}));

    metroLines.forEach(line=>{
      line.runtime = buildLineRuntime(line);
      line.timeline = line.runtime ? buildRoundTripTimeline(line.runtime, METRO_SPEED_MPS, METRO_DWELL_MS) : null;
    });

    dataLoaded.metro = true;

    if(!metroLines.length){
      metroError = true;
      showError('Metro network query returned no lines — Overpass may have partially timed out. Try reopening the Transit tab.');
    }

    console.log(`Loaded ${metroLines.length} metro lines, ${metroStations.length} stations from OSM`);
    if(metroLines.length) {
      saveNetworkCache('providence_metro_v2', {
        metroLines: metroLines.map(stripLineForCache),
        metroStations,
      });
    }
    logActivity(`Metro feed · ${metroLines.length} lines · ${metroStations.length} stations · OSM`, '#ff6600');
    if(currentMap==='transit'){ updateAllTransitLayers(); buildHUD(); buildList(); }
  } catch(err){
    console.warn('Metro Overpass fetch failed on all mirrors:', err.message);
    metroError = true;
    dataLoaded.metro = true;
    showError(`Metro network unavailable — Overpass unreachable on all mirrors (${err.message}).`);
    if(currentMap==='transit'){ buildHUD(); buildList(); }
  }
}

async function loadBusData() {
  if(dataLoaded.bus) return;

  const cached = loadNetworkCache('providence_bus_v2');
  if(cached) {
    busLines = cached.busLines;
    busStops = cached.busStops;
    busLines.forEach(line=>{
      line.runtime = buildLineRuntime(line);
      line.timeline = line.runtime ? buildRoundTripTimeline(line.runtime, BUS_SPEED_MPS, BUS_DWELL_MS) : null;
    });
    dataLoaded.bus = true;
    console.log(`Loaded ${busLines.length} bus lines, ${busStops.length} stops from local cache`);
    logActivity(`Bus feed · ${busLines.length} lines · ${busStops.length} stops · cached`, '#3da8ff');
    if(currentMap==='transit'){ updateAllTransitLayers(); buildHUD(); buildList(); }
    return;
  }

  const bbox = '41.30,2.05,41.50,2.25';
  const stopsQuery = `[out:json][timeout:25];node["highway"="bus_stop"](${bbox});out body;`;
  const linesQuery = `[out:json][timeout:55];
(
  relation["route"="bus"](${bbox});
);
(._;>>;);
out geom;`;

  const [stopsResult, linesResult] = await Promise.allSettled([
    overpassFetch(stopsQuery, 30000),
    overpassFetch(linesQuery, 60000),
  ]);

  if(stopsResult.status === 'fulfilled') {
    busStops = stopsResult.value.elements
      .filter(e=>e.type==='node')
      .map(n=>({lat:n.lat,lng:n.lon,name:(n.tags&&n.tags.name)||'Bus Stop'}));
  } else {
    console.warn('Bus stops query failed on all mirrors:', stopsResult.reason?.message);
  }

  if(linesResult.status === 'fulfilled') {
    const data = linesResult.value;
    const wayById = {};
    data.elements.filter(e=>e.type==='way').forEach(w=>{ wayById[w.id]=w; });
    const nodeById = {};
    data.elements.filter(e=>e.type==='node').forEach(n=>{ nodeById[n.id]=n; });
    const relations = data.elements.filter(e=>e.type==='relation' && e.tags && e.tags.route==='bus');

    busLines = relations.map(rel=>{
      const tags = rel.tags||{};
      const ref = (tags.ref||tags.name||'').trim();
      const colour = tags.colour || '#3da8ff';
      const segments = [];
      const stopSequence = [];
      (rel.members||[]).forEach(m=>{
        if(m.type==='way'){
          const w = wayById[m.ref];
          if(w && w.geometry) segments.push(w.geometry.map(pt=>[pt.lat,pt.lon]));
        } else if(m.type==='node'){
          const role = m.role || '';
          if(role.includes('stop') || role.includes('platform')){
            const n = nodeById[m.ref];
            if(n) stopSequence.push({lat:n.lat,lng:n.lon,name:(n.tags&&n.tags.name)||'Bus Stop'});
          }
        }
      });
      return segments.length ? {ref, name:tags.name||ref, colour, segments, stopSequence} : null;
    }).filter(Boolean);

    busLines = dedupeLinesByRef(busLines);

    busLines.forEach(line=>{
      line.runtime = buildLineRuntime(line);
      line.timeline = line.runtime ? buildRoundTripTimeline(line.runtime, BUS_SPEED_MPS, BUS_DWELL_MS) : null;
    });
  } else {
    console.warn('Bus lines query failed on all mirrors:', linesResult.reason?.message);
  }

  dataLoaded.bus = true;
  console.log(`Loaded ${busLines.length} bus lines, ${busStops.length} stops from OSM`);
  if(busLines.length && busStops.length) {
    saveNetworkCache('providence_bus_v2', {
      busLines: busLines.map(stripLineForCache),
      busStops,
    });
  }

  if(!busStops.length && !busLines.length) {
    busError = true;
    showError('Bus network unavailable — Overpass API unreachable on all mirrors for both stops and line queries.');
  } else if(!busLines.length) {
    showError(`Bus stops loaded (${busStops.length}), but bus line itineraries timed out on all mirrors — showing stops only.`);
  } else if(!busStops.length) {
    showError(`Bus lines loaded (${busLines.length}), but the bus stops query timed out on all mirrors — showing lines only.`);
  }

  logActivity(`Bus feed · ${busLines.length} lines · ${busStops.length} stops · OSM`, '#3da8ff');
  if(currentMap==='transit'){ updateAllTransitLayers(); buildHUD(); buildList(); }
}

// ── Static network rendering (dimmed lines, labeled stops) ──
function renderMetroLayer() {
  if(metroLayerGroup){ map.removeLayer(metroLayerGroup); metroLayerGroup=null; }
  if(metroVehicleLayer){ map.removeLayer(metroVehicleLayer); metroVehicleLayer=null; }
  metroVehicleMarkers = {};
  if(!activeFilters.has('metro')) return;

  metroLayerGroup = L.layerGroup().addTo(map);
  const showLabels = map.getZoom() >= METRO_LABEL_MIN_ZOOM;

  metroLines.forEach(line=>{
    line.segments.forEach(seg=>{
      const pl = L.polyline(seg, {color:line.colour, weight:2, opacity:0.4, renderer:transitCanvas});
      pl.on('mouseover', ()=>pl.setStyle({opacity:0.9, weight:3}));
      pl.on('mouseout',  ()=>pl.setStyle({opacity:0.4, weight:2}));
      pl.bindTooltip(`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(4,12,24,.9);padding:4px 8px;color:#c0d4e8">
        <strong style="color:${line.colour}">${line.ref}</strong>${line.name && line.name!==line.ref ? ' · '+line.name : ''}</div>`,
        {sticky:true,opacity:1,className:''});
      metroLayerGroup.addLayer(pl);
    });
  });

  metroStations.forEach(s=>{
    const primaryColor = METRO_LINE_COLORS[s.lines[0]] || '#ff6600';
    const m = L.circleMarker([s.lat,s.lng],{
      radius:3.5, fillColor:'#040c18', color:primaryColor, weight:2, fillOpacity:1, renderer:transitCanvas
    });
    const tooltipHtml = `<div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:#e8f0f8;background:rgba(4,12,24,.8);padding:2px 5px;white-space:nowrap;pointer-events:none">${s.name}</div>`;
    m.bindTooltip(tooltipHtml, {permanent:showLabels, sticky:!showLabels, direction:'right', offset:[5,0], opacity:0.95, className:''});
    metroLayerGroup.addLayer(m);
  });

  ensureMetroVehicleMarkers();
}

const METRO_LABEL_MIN_ZOOM = 15; // metro station names only render permanently once zoomed in this far
const BUS_STOP_MIN_ZOOM = 13; // bus stop dots only render once zoomed in this far

function renderBusLayer() {
  if(busLayerGroup){ map.removeLayer(busLayerGroup); busLayerGroup=null; }
  if(busVehicleLayer){ map.removeLayer(busVehicleLayer); busVehicleLayer=null; }
  busVehicleMarkers = {};
  if(!activeFilters.has('bus')) return;

  busLayerGroup = L.layerGroup().addTo(map);
  const zoom = map.getZoom();
  const showLabels = zoom >= BUS_LABEL_MIN_ZOOM;
  const showStops  = zoom >= BUS_STOP_MIN_ZOOM;
  const lineOpacity = zoom >= BUS_STOP_MIN_ZOOM ? 0.22 : 0.08;

  busLines.forEach(line=>{
    line.segments.forEach(seg=>{
      const pl = L.polyline(seg, {color:'#5580a0', weight:1, opacity:lineOpacity, renderer:transitCanvas});
      pl.bindTooltip(`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(4,12,24,.9);padding:4px 8px;color:#c0d4e8">
        <strong style="color:#3da8ff">Bus ${line.ref}</strong></div>`,
        {sticky:true,opacity:1,className:''});
      busLayerGroup.addLayer(pl);
    });
  });

  if(showStops) {
    busStops.forEach(s=>{
      const m = L.circleMarker([s.lat,s.lng],{
        radius:1.6, fillColor:'#3da8ff', color:'#3da8ff', weight:1, fillOpacity:0.6, renderer:transitCanvas
      });
      const tooltipHtml = `<div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:#dce8f4;background:rgba(4,12,24,.8);padding:2px 5px;white-space:nowrap;pointer-events:none">${s.name}</div>`;
      m.bindTooltip(tooltipHtml, {permanent:showLabels, sticky:!showLabels, direction:'right', offset:[4,0], opacity:0.9, className:''});
      busLayerGroup.addLayer(m);
    });
  }

  ensureBusVehicleMarkers();
}

// Re-render bus/metro stop labels when the user zooms past the label threshold
map.on('zoomend', () => {
