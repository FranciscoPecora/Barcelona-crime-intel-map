<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCN · City Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  :root {
    --bg:#08090c;
    --surface:#0c0e12;
    --surface2:#111318;
    --border:#1c1f26;
    --border2:#252a34;
    --text:#c8cdd8;
    --text2:#8b919e;
    --muted:#4a5060;
    --muted2:#636878;
    --accent:#3b82f6;
    --accent-dim:rgba(59,130,246,.12);
    --accent-line:rgba(59,130,246,.35);
    --green:#10b981;
    --green-dim:rgba(16,185,129,.1);
    --amber:#f59e0b;
    --amber-dim:rgba(245,158,11,.1);
    --red:#ef4444;
    --red-dim:rgba(239,68,68,.1);
    --mono:'JetBrains Mono',monospace;
    --sans:'Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* ── HEADER ── */
  header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    height:48px;display:flex;align-items:center;padding:0 0 0 0;
    background:var(--bg);border-bottom:1px solid var(--border2);
  }
  .logo-block{
    width:220px;flex-shrink:0;padding:0 20px;
    border-right:1px solid var(--border2);height:100%;
    display:flex;flex-direction:column;justify-content:center;
  }
  .logo{font-family:var(--sans);font-size:13px;font-weight:600;
    letter-spacing:.08em;color:#e2e6ed;text-transform:uppercase}
  .logo em{color:var(--accent);font-style:normal}
  .logo-sub{font-family:var(--mono);font-size:9px;color:var(--muted);
    letter-spacing:.1em;margin-top:1px;text-transform:uppercase}
  nav{display:flex;flex:1;height:100%;overflow-x:auto;padding:0 8px}
  nav::-webkit-scrollbar{display:none}
  .nav-tab{
    height:100%;padding:0 16px;border:none;border-bottom:2px solid transparent;
    font-family:var(--sans);font-size:11px;font-weight:500;
    letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;color:var(--muted2);background:none;
    transition:color .15s,border-color .15s;white-space:nowrap;
  }
  .nav-tab:hover{color:var(--text)}
  .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .header-right{
    display:flex;align-items:center;gap:16px;padding:0 20px;
    border-left:1px solid var(--border2);height:100%;flex-shrink:0;
  }
  .status-indicator{display:flex;align-items:center;gap:7px}
  .status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 2px var(--green-dim);animation:pulse 2.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .status-text{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:.08em;text-transform:uppercase}
  .classify-badge{
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;padding:3px 8px;
    background:var(--amber-dim);border:1px solid rgba(245,158,11,.25);
    color:var(--amber);
  }

  /* ── LAYOUT ── */
  .app{display:flex;height:100vh;padding-top:48px}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border2);
    display:flex;flex-direction:column;overflow:hidden;z-index:500;
  }
  .main{flex:1;position:relative;overflow:hidden}
  #map{width:100%;height:100%}
  .leaflet-container{background:#07080c !important}
  .leaflet-control-zoom{border:1px solid var(--border2) !important;border-radius:0 !important}
  .leaflet-control-zoom a{
    background:var(--surface) !important;color:var(--text2) !important;
    border-bottom:1px solid var(--border2) !important;border-radius:0 !important;
    font-size:16px !important;line-height:26px !important;
  }
  .leaflet-control-zoom a:hover{background:var(--surface2) !important;color:var(--text) !important}

  /* ── SIDEBAR ── */
  .sb-header{
    padding:14px 16px 12px;border-bottom:1px solid var(--border2);
    flex-shrink:0;
  }
  .sb-map-label{
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px;
  }
  .sb-title{font-size:13px;font-weight:600;color:#e2e6ed;margin-bottom:1px;letter-spacing:.01em}
  .sb-meta{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* data source strip */
  .data-source{
    display:flex;align-items:center;gap:8px;
    padding:6px 16px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .ds-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
  .ds-text{font-family:var(--mono);font-size:9px;letter-spacing:.05em;flex:1;text-transform:uppercase}
  .ds-time{font-family:var(--mono);font-size:9px;color:var(--muted)}

  /* layers */
  .sb-section{padding:10px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
  .sb-label{
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;
  }
  .layer-row{
    display:flex;align-items:center;gap:9px;margin-bottom:3px;
    cursor:pointer;padding:4px 6px;transition:background .1s;
  }
  .layer-row:hover{background:rgba(255,255,255,.03)}
  .layer-icon{width:3px;height:14px;flex-shrink:0;transition:opacity .15s}
  .layer-label{font-size:11px;font-weight:400;color:var(--text2);flex:1;letter-spacing:.01em}
  .layer-row.off .layer-icon{opacity:.15}
  .layer-row.off .layer-label{color:var(--muted)}
  .layer-row input{display:none}

  /* district list */
  .sb-list{padding:8px 0;flex:1;overflow-y:auto}
  .sb-list::-webkit-scrollbar{width:2px}
  .sb-list::-webkit-scrollbar-thumb{background:var(--border2)}
  .sb-list-label{
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);
    padding:0 16px;margin-bottom:6px;
  }
  .list-card{
    padding:8px 16px;border-left:2px solid transparent;
    margin-bottom:1px;cursor:pointer;transition:all .12s;
  }
  .list-card:hover{background:rgba(255,255,255,.03);border-left-color:var(--border2)}
  .list-card.selected{background:var(--accent-dim);border-left-color:var(--accent)}
  .lc-name{font-size:11px;font-weight:500;color:var(--text);margin-bottom:5px;letter-spacing:.01em}
  .lc-bar{display:flex;gap:1px;height:2px;overflow:hidden;margin-bottom:4px}
  .lc-seg{height:100%}
  .lc-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.03em}

  /* ── HUD PANELS ── */
  .hud{
    position:absolute;top:12px;right:12px;z-index:500;
    background:var(--surface);border:1px solid var(--border2);
    padding:0;min-width:168px;
  }
  .hud-header{
    padding:8px 12px;border-bottom:1px solid var(--border);
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);
  }
  .hud-body{padding:10px 12px}
  .hud-val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1;margin-bottom:2px}
  .hud-sub{font-size:10px;color:var(--muted2);font-weight:300}
  .hud-div{border:none;border-top:1px solid var(--border);margin:8px 0}
  .hud-row{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:9px;margin-bottom:4px;letter-spacing:.03em;
  }
  .hud-row span:first-child{color:var(--muted);text-transform:uppercase}
  .hud-row span:last-child{color:var(--text2)}

  /* ── LOADING ── */
  .loading-overlay{
    position:absolute;inset:0;z-index:800;
    background:rgba(8,9,12,.9);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  .loading-spinner{
    width:24px;height:24px;border:1px solid var(--border2);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:var(--mono);font-size:10px;color:var(--text2);letter-spacing:.1em;text-transform:uppercase}
  .loading-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.05em}
  .loading-overlay.hidden{display:none}

  /* ── INFO STRIP (replaces error banner) ── */
  .error-banner{
    position:absolute;top:0;left:0;right:0;z-index:600;
    background:var(--amber-dim);border-bottom:1px solid rgba(245,158,11,.2);
    padding:5px 16px;font-family:var(--mono);font-size:9px;
    color:var(--amber);letter-spacing:.06em;text-transform:uppercase;
    display:none;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:500;
    background:var(--surface);border:1px solid var(--border2);
    padding:6px 16px;display:flex;align-items:center;gap:14px;white-space:nowrap;
  }
  .bb-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .bb-val{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.06em}
  input[type=range]{
    -webkit-appearance:none;width:110px;height:1px;
    background:var(--border2);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:10px;height:10px;
    background:var(--accent);cursor:pointer;border:none;
  }

  /* ── LEGEND ── */
  .legend{
    position:absolute;bottom:12px;right:12px;z-index:500;
    background:var(--surface);border:1px solid var(--border2);
    padding:0;font-size:10px;min-width:130px;
  }
  .legend-title{
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);
    padding:6px 10px;border-bottom:1px solid var(--border);
  }
  .legend-body{padding:8px 10px}
  .legend-grad{width:110px;height:4px;margin-bottom:4px}
  .legend-ends{
    display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:9px;color:var(--muted);width:110px;
  }

  /* ── WATERMARK ── */
  .watermark{
    position:absolute;bottom:12px;left:12px;z-index:500;
    font-family:var(--mono);font-size:8px;
    color:var(--muted);letter-spacing:.05em;line-height:1.8;pointer-events:none;
    text-transform:uppercase;opacity:.6;
  }

  /* ── LEAFLET POPUP ── */
  .leaflet-popup-content-wrapper{
    background:var(--surface) !important;border:1px solid var(--border2) !important;
    border-radius:0 !important;box-shadow:0 4px 24px rgba(0,0,0,.6) !important;
    color:var(--text) !important;font-family:var(--sans) !important;padding:0 !important;
  }
  .leaflet-popup-content{margin:0 !important}
  .leaflet-popup-tip-container{display:none}
  .leaflet-popup-close-button{
    color:var(--muted) !important;padding:8px !important;
    font-size:14px !important;top:4px !important;right:4px !important;
  }
  .pop-inner{padding:12px 14px}
  .pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pop-name{font-size:12px;font-weight:600;color:#e2e6ed;letter-spacing:.02em;text-transform:uppercase}
  .pop-badge{
    font-family:var(--mono);font-size:8px;padding:2px 6px;letter-spacing:.1em;text-transform:uppercase;
  }
  .pop-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .pop-dot{width:3px;height:10px;flex-shrink:0}
  .pop-label{font-size:10px;color:var(--muted2);flex:1;font-weight:400}
  .pop-val{font-family:var(--mono);font-size:10px;font-weight:500}
  .pop-div{border:none;border-top:1px solid var(--border);margin:7px 0}
  .pop-total{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px}
  .pop-src{font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <div class="logo">BCN<em>·</em>INTEL</div>
    <div class="logo-sub">City Intelligence Platform</div>
  </div>
  <nav id="mainNav">
    <button class="nav-tab active" data-map="crime">Crime Analysis</button>
    <button class="nav-tab" data-map="sigint">SIGINT / RF</button>
    <button class="nav-tab" data-map="infra">Infrastructure</button>
    <button class="nav-tab" data-map="human">Human Terrain</button>
  </nav>
  <div class="header-right">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Connecting</span>
    </div>
    <div class="classify-badge">OSINT</div>
  </div>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div id="map"></div>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">FETCHING LIVE DATA</div>
      <div class="loading-sub" id="loadingSub">Barcelona Open Data · CKAN API</div>
    </div>
    <div class="error-banner" id="errorBanner"></div>
    <div class="hud" id="hud"></div>
    <div class="bottom-bar" id="bottomBar"></div>
    <div class="legend" id="legend"></div>
    <div class="watermark" id="watermark"></div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG — paste your Cloudflare Worker URL here after deploying
// ═══════════════════════════════════════════════════════════════
const WORKER_URL = 'https://cicero.franzpec2017.workers.dev';

// Barcelona Open Data CKAN — known stable resource IDs for crime by district
// These are the "Fets penals coneguts" datasets published by Mossos d'Esquadra
// The app will auto-discover the latest year's resource ID via the CKAN API
const CKAN_BASE   = 'https://opendata-ajuntament.barcelona.cat/data/api/3/action';
const POPULATION_RESOURCE = '190095dd-feaf-4c50-9fc7-d0578a52297a'; // Padró Municipal 2025 · nationality by district
const CRIME_PKG   = 'seguretat-fets-penals-tipus-penal-districte'; // dataset slug

// Overpass API for real infrastructure POIs from OpenStreetMap
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

// ═══════════════════════════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════════════════════════
const map = L.map('map', {
  center:[41.3951,2.1734], zoom:12,
  zoomControl:false, attributionControl:false,
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
// Subtle street-level labels only
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{
  maxZoom:19, opacity:0.35, zIndex:200,
}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);
L.control.attribution({position:'bottomright',prefix:''})
  .addAttribution('© CartoDB · © OpenStreetMap · © Open Data BCN').addTo(map);

// ═══════════════════════════════════════════════════════════════
// DISTRICT GEOMETRY (precise lat/lng)
// ═══════════════════════════════════════════════════════════════
// District geometry — loaded from official BCN GeoJSON (martgnz/bcn-geodata, CC-BY)
// Falls back to approximate coords if GeoJSON unavailable
let DISTRICTS_GEO = {
  '1': { name:'Ciutat Vella',        coords:[[41.3779,2.1734],[41.3801,2.1640],[41.3850,2.1656],[41.3862,2.1720],[41.3840,2.1795],[41.3800,2.1790]] },
  '2': { name:"L'Eixample",          coords:[[41.3850,2.1440],[41.3960,2.1440],[41.4000,2.1580],[41.3970,2.1800],[41.3900,2.1820],[41.3862,2.1720],[41.3850,2.1656],[41.3830,2.1550]] },
  '3': { name:'Sants-Montjuïc',      coords:[[41.3540,2.1280],[41.3700,2.1280],[41.3800,2.1440],[41.3850,2.1440],[41.3830,2.1550],[41.3779,2.1734],[41.3700,2.1780],[41.3600,2.1700],[41.3540,2.1500]] },
  '4': { name:'Les Corts',           coords:[[41.3800,2.1280],[41.3900,2.1280],[41.3960,2.1440],[41.3850,2.1440],[41.3800,2.1280]] },
  '5': { name:'Sarrià–Sant Gervasi', coords:[[41.3900,2.1000],[41.4100,2.1050],[41.4200,2.1300],[41.4100,2.1450],[41.3960,2.1440],[41.3900,2.1280]] },
  '6': { name:'Gràcia',              coords:[[41.3960,2.1440],[41.4100,2.1450],[41.4120,2.1600],[41.4050,2.1700],[41.3970,2.1800],[41.4000,2.1580]] },
  '7': { name:'Horta-Guinardó',      coords:[[41.4100,2.1450],[41.4200,2.1300],[41.4300,2.1450],[41.4280,2.1680],[41.4150,2.1750],[41.4120,2.1600]] },
  '8': { name:'Nou Barris',          coords:[[41.4100,2.1050],[41.4300,2.1100],[41.4400,2.1300],[41.4300,2.1450],[41.4200,2.1300]] },
  '9': { name:'Sant Andreu',         coords:[[41.4300,2.1450],[41.4400,2.1300],[41.4500,2.1550],[41.4400,2.1800],[41.4250,2.1850],[41.4150,2.1750],[41.4280,2.1680]] },
  '10':{ name:'Sant Martí',          coords:[[41.3970,2.1800],[41.4050,2.1700],[41.4150,2.1750],[41.4250,2.1850],[41.4200,2.2100],[41.4050,2.2200],[41.3900,2.2100],[41.3850,2.2000],[41.3900,2.1820]] },
};

// Load official GeoJSON boundaries from CartoBCN via GitHub
async function loadDistrictGeoJSON() {
  try {
    const url = 'https://raw.githubusercontent.com/martgnz/bcn-geodata/master/districtes/districtes.geojson';
    const res  = await fetch(url);
    if(!res.ok) throw new Error('GeoJSON fetch failed');
    const geo  = await res.json();
    geo.features.forEach(f => {
      const code = String(parseInt(f.properties.c_distri || f.properties.DISTRICTE || 0));
      const name = f.properties.n_distri   || f.properties.NOM        || DISTRICTS_GEO[code]?.name;
      if(!code || !DISTRICTS_GEO[code]) return;
      // Convert GeoJSON [lng,lat] to our [lat,lng] format, simplify to 30 points max
      let coords = f.geometry.type === 'Polygon'
        ? f.geometry.coordinates[0]
        : f.geometry.coordinates[0][0];
      // Simplify — take every Nth point to keep ~40 points
      const step = Math.max(1, Math.floor(coords.length / 40));
      coords = coords.filter((_,i) => i % step === 0);
      DISTRICTS_GEO[code] = { name, coords: coords.map(([lng,lat]) => [lat,lng]) };
    });
    console.log('Loaded official BCN district boundaries from CartoBCN');
    // Rebuild polygons with real boundaries
    Object.values(districtLayers).forEach(l => map.removeLayer(l));
    Object.keys(districtLayers).forEach(k => delete districtLayers[k]);
    buildDistrictPolygons();
    buildHeatmap();
    buildInfraMarkers();
  } catch(e) {
    console.warn('GeoJSON unavailable, using approximate boundaries:', e.message);
  }
}


// Fallback data (2023 official figures from Mossos d'Esquadra annual report)
// Used if API is unavailable. Source: Barcelona Local Security Board, Feb 2024
const FALLBACK_CRIME = {
  '1':{total:15700,theft:9800,assault:1800,robbery:2200,vandalism:900,drugs:1400,fraud:600,year:2023,source:'fallback'},
  '2':{total:11780,theft:7200,assault:1100,robbery:980, vandalism:720,drugs:680, fraud:1100,year:2023,source:'fallback'},
  '3':{total:6640, theft:3800,assault:780, robbery:560, vandalism:620,drugs:540, fraud:340,year:2023,source:'fallback'},
  '4':{total:2100, theft:1200,assault:190, robbery:130, vandalism:180,drugs:120, fraud:280,year:2023,source:'fallback'},
  '5':{total:2690, theft:1600,assault:220, robbery:160, vandalism:210,drugs:110, fraud:390,year:2023,source:'fallback'},
  '6':{total:4380, theft:2600,assault:420, robbery:280, vandalism:480,drugs:310, fraud:290,year:2023,source:'fallback'},
  '7':{total:3260, theft:1900,assault:360, robbery:220, vandalism:340,drugs:260, fraud:180,year:2023,source:'fallback'},
  '8':{total:4980, theft:2800,assault:640, robbery:410, vandalism:580,drugs:490, fraud:160,year:2023,source:'fallback'},
  '9':{total:3990, theft:2200,assault:480, robbery:310, vandalism:440,drugs:360, fraud:200,year:2023,source:'fallback'},
  '10':{total:6810,theft:4100,assault:720, robbery:520, vandalism:560,drugs:430, fraud:480,year:2023,source:'fallback'},

// PROXY FETCH — routes through Cloudflare Worker
// Falls back to direct fetch if Worker URL not configured
// ═══════════════════════════════════════════════════════════════
async function proxyFetch(url, timeoutMs=8000) {
  const controller = new AbortController();
  const tid = setTimeout(()=>controller.abort(), timeoutMs);
  const isConfigured = WORKER_URL && !WORKER_URL.includes('YOUR-WORKER');
  const fetchUrl = isConfigured
    ? `${WORKER_URL}?url=${encodeURIComponent(url)}`
    : url; // direct (will fail CORS from browser for BCN API, but works for Overpass)
  try {
    const res = await fetch(fetchUrl, {signal:controller.signal});
    clearTimeout(tid);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

const MOSSOS_API = 'https://analisi.transparenciacatalunya.cat/resource/qnyt-emjc.json';

const ABP_TO_DISTRICT = {
  'ABP Ciutat Vella':       '1',
  'ABP Eixample':           '2',
  'ABP Sants-Montjuïc':     '3',
  'ABP Les Corts':          '4',

};

// Map Catalan crime type strings to our categories
function mapCrimeType(tipus) {
  const t = tipus.toLowerCase();
  if(t.includes('furt') || t.includes('robatori i furt d\'ús')) return 'theft';
  if(t.includes('lesion') || t.includes('lesió') || t.includes('homicidi') || t.includes('agressions sexuals')) return 'assault';
  if(t.includes('robatori amb violència') || t.includes('robatori amb força')) return 'robbery';
  if(t.includes('danys')) return 'vandalism';
  if(t.includes('droga') || t.includes('estupefaent') || t.includes('salut pública')) return 'drugs';
  if(t.includes('estaf') || t.includes('frau') || t.includes('falsedad') || t.includes('falsedats')) return 'fraud';
  return null;
}

async function loadCrimeData() {
  showLoading('FETCHING CRIME DATA', 'Mossos d\'Esquadra · Generalitat de Catalunya');
  setStatus('connecting');
  try {
    // Fetch 2024 data for all Barcelona districts via Cloudflare Worker (CORS proxy)
    // Fetch all 10 Barcelona districts in parallel — simple queries, no $where needed
    const ABP_NAMES = Object.keys(ABP_TO_DISTRICT);
    const fetches = ABP_NAMES.map(async abp => {
      const encoded = encodeURIComponent(abp);
      const apiUrl  = `${MOSSOS_API}?rea_b_sica_policial_abp=${encoded}&any=2024&$limit=500`;
      const workerUrl = `${WORKER_URL}?url=${apiUrl}`;
      const r = await fetch(workerUrl);
      if(!r.ok) throw new Error(`HTTP ${r.status} for ${abp}`);
      return r.json();
    });
    const results = await Promise.all(fetches);
    const data = results.flat();
    const records = Array.isArray(data) ? data : [];
    if(!records.length) throw new Error('No records returned');

    // Aggregate by district and crime type
    const parsed = {};
    records.forEach(r => {
      const abp  = r['rea_b_sica_policial_abp'] || '';
      const code = ABP_TO_DISTRICT[abp];
      if(!code) return;
      if(!parsed[code]) parsed[code] = {theft:0,assault:0,robbery:0,vandalism:0,drugs:0,fraud:0,total:0,year:2024,source:'api'};
      const count   = parseInt(r['coneguts'] || 0, 10) || 0;
      const category = mapCrimeType(r['tipus_de_fet'] || '');
      if(category) parsed[code][category] += count;
      parsed[code].total += count;
    });

    const districtCount = Object.keys(parsed).length;
    if(districtCount >= 8) {
      crimeData   = parsed;
      dataSource  = 'api';
      lastUpdated = new Date();
      setStatus('live');
      showError(null);
      console.log(`Loaded real 2024 Mossos crime data for ${districtCount} districts`);
    } else {
      throw new Error(`Only ${districtCount} districts parsed`);
    }
  } catch(err) {
    console.warn('Mossos API unavailable, using fallback:', err.message);
    crimeData   = structuredClone(FALLBACK_CRIME);
    dataSource  = 'fallback';
    lastUpdated = new Date('2024-02-14');
    setStatus('offline');
    showError('Mossos d\'Esquadra · Official 2023 figures · Auto-updates annually');
  }
  dataLoaded.crime = true;
  hideLoading();
  refreshAll();
}

// DATA FETCHING — OpenStreetMap Overpass (real infra POIs)
// ═══════════════════════════════════════════════════════════════
async function loadInfraData() {
  // Overpass query for Barcelona infrastructure
  const bbox = '41.32,2.05,41.47,2.23'; // Barcelona bounding box
  const query = `[out:json][timeout:20];
(
  node["power"="substation"](${bbox});
  node["man_made"="water_tower"](${bbox});
  node["amenity"="water_point"](${bbox});
  node["public_transport"="station"]["railway"="station"](${bbox});
  node["amenity"="hospital"]["beds"](${bbox});
  node["office"="government"]["admin_level"](${bbox});
  node["telecom"="data_center"](${bbox});
  way["power"="substation"](${bbox});
  way["amenity"="hospital"](${bbox});
);
out center tags;`;

  try {
    showLoading('FETCHING INFRASTRUCTURE', 'OpenStreetMap Overpass API');
    const data = await proxyFetch(
      `${OVERPASS_URL}?data=${encodeURIComponent(query)}`, 12000
    );
    infraNodes = data.elements.map(el => {
      const lat = el.lat || el.center?.lat;
      const lng = el.lon || el.center?.lon;
      if(!lat || !lng) return null;
      const tags = el.tags || {};
      let type = 'gov';
      if(tags.power) type = 'power';
      else if(tags.man_made==='water_tower'||tags.amenity==='water_point') type = 'water';
      else if(tags.public_transport==='station') type = 'transport';
      else if(tags.amenity==='hospital') type = 'hospital';
      else if(tags.telecom==='data_center') type = 'data';
      const name = tags.name || tags['name:en'] || type;
      return {lat, lng, type, name, crit: tags['admin_level']?3:2};
    }).filter(Boolean);
    dataLoaded.infra = true;
    showError(null);
  } catch(err) {
    console.warn('Overpass unavailable:', err.message);
    // Use static fallback nodes
    infraNodes = STATIC_INFRA_NODES;
    dataLoaded.infra = true;
  }
  hideLoading();
  if(currentMap==='infra') refreshAll();
}

  const url = `${CKAN_BASE}/datastore_search?resource_id=${CCTV_RESOURCE}&limit=500`;

    cctvNodes = data.result.records
      .map(r => {
        const lat = parseFloat(r['Latitud']  || r['latitud']  || r['LATITUD']  || 0);

        if(!lat || !lng || lat < 41.2 || lat > 41.6 || lng < 1.9 || lng > 2.4) return null;
        return {
          lat, lng,
          district: String(r['Codi_Districte'] || r['codi_districte'] || ''),

          type:     String(r['Tipus_Camera']   || r['tipus_camera']   || 'CCTV'),

    console.log(`Loaded ${cctvNodes.length} real CCTV cameras from Open Data BCN`);
    // Update SIGINT meta in sidebar
    if(currentMap==='sigint') {

// Resource: Població segons nacionalitat (Espanya/UE/Resta estranger)
// ID: 190095dd-feaf-4c50-9fc7-d0578a52297a
// NACIONALITAT_G: 1=Spanish, 2=EU foreign, 3=Non-EU foreign, 4=Stateless

async function loadPopulationData() {
  const url = `${CKAN_BASE}/datastore_search?resource_id=${POPULATION_RESOURCE}&limit=7000`;
  try {
    const data = await proxyFetch(url, 12000);
    if(!data.success || !data.result.records.length) throw new Error('No population records');

    // Aggregate by district
    const totalByDistrict = {};
    const foreignByDistrict = {};

    data.result.records.forEach(r => {
      const rawCode = r['Codi_Districte'] || r['codi_districte'] || '';
      const code = String(parseInt(rawCode) || '').trim(); // normalise "01" → "1"
      if(!code || !DISTRICTS_GEO[code]) return;
      const nat  = parseInt(r['NACIONALITAT_G'] || 0);
      const val  = parseInt(r['Valor'] || 0) || 0;
      if(!totalByDistrict[code])   totalByDistrict[code]   = 0;
      if(!foreignByDistrict[code]) foreignByDistrict[code] = 0;
      totalByDistrict[code] += val;
      // NACIONALITAT_G 2 = EU foreign, 3 = Non-EU foreign, 4 = stateless
      if(nat === 2 || nat === 3 || nat === 4) foreignByDistrict[code] += val;
    });

    // Update HUMAN_DENSITY with real figures
    const districtAreas = {'1':4.4,'2':7.5,'3':22.9,'4':6.0,'5':20.1,'6':4.2,'7':12.0,'8':8.0,'9':6.6,'10':10.8}; // km²
    Object.keys(totalByDistrict).forEach(code => {
      const area = districtAreas[code] || 10;
      HUMAN_DENSITY[code] = Math.round(totalByDistrict[code] / area);
    });
    foreignPopByDistrict = foreignByDistrict;

    dataLoaded.population = true;
    console.log('Loaded real 2025 population data:', totalByDistrict);
    setStatus('live');

    // Update sidebar meta
    if(currentMap==='human'){
      const metaEl = document.querySelector('.sb-meta');
      if(metaEl) metaEl.textContent = 'Padró Municipal BCN · 2025 · Live';
      buildList(); buildHUD(); buildHeatmap();
    }
    showError(null);
  } catch(err) {
    console.warn('Population API unavailable:', err.message);
    HUMAN_DENSITY = {...HUMAN_DENSITY_FALLBACK};
    dataLoaded.population = true;
  }
}

// MAP RENDERING
// ═══════════════════════════════════════════════════════════════
function lerp(a,b,t){return a+(b-a)*t}

// Count infrastructure nodes per district from real OSM data
function getNodesForDistrict(districtId) {
  if(!infraNodes.length) return [];
  const geo = DISTRICTS_GEO[districtId];
  if(!geo) return [];
  return infraNodes.filter(n => {
    return pointInLatLng(n.lat, n.lng, geo.coords);
  });
}

function getNodeCountByDistrict() {
  const counts = {};
  Object.keys(DISTRICTS_GEO).forEach(id => {
    counts[id] = getNodesForDistrict(id).length;
  });
  return counts;
}

// Compute district color for infra map based on real node density
function getInfraNodeDensity(id) {
  const nodes = getNodesForDistrict(id);
  const criticalCount = nodes.filter(n => n.crit === 3).length;
  const totalCount = nodes.length;
  return { totalCount, criticalCount };
}



function getDistrictColor(id) {
  if(currentMap==='crime'){
    const d=crimeData[id]||FALLBACK_CRIME[id]||{};
    const tot=getFilteredTotal(d);
    const allTots=Object.keys(DISTRICTS_GEO).map(i=>getFilteredTotal(crimeData[i]||FALLBACK_CRIME[i]||{}));
    const mx=Math.max(...allTots)||1;
    const t=tot/mx;
    return {c:`rgb(${Math.round(lerp(20,220,t))},${Math.round(lerp(20,40,t))},${Math.round(lerp(50,65,t))})`,o:.18+t*.22};
  } else if(currentMap==='sigint'){
    const cov=SIGINT_COVERAGE[id]||.5;
    return {c:`rgb(${Math.round(lerp(10,0,cov))},${Math.round(lerp(10,80,cov))},${Math.round(lerp(25,130,cov))})`,o:.15+cov*.18};
  } else if(currentMap==='infra'){
    const {totalCount} = getInfraNodeDensity(id);
    const allCounts = Object.keys(DISTRICTS_GEO).map(i => getInfraNodeDensity(i).totalCount);
    const mx = Math.max(...allCounts) || 1;
    const t = totalCount / mx;
    return {c:`rgb(${Math.round(lerp(14,180,t))},${Math.round(lerp(20,70,t))},${Math.round(lerp(14,0,t))})`,o:.15+t*.22};
  } else if(currentMap==='human'){
    const mx=Math.max(...Object.values(HUMAN_DENSITY));
    const t=(HUMAN_DENSITY[id]||0)/mx;
    return {c:`rgb(${Math.round(lerp(12,50,t))},${Math.round(lerp(14,28,t))},${Math.round(lerp(30,180,t))})`,o:.15+t*.22};
  }
  return {c:'#333',o:.3};
}

function getFilteredTotal(d) {
  if(!d) return 0;
  return CRIME_TYPES.filter(ct=>activeFilters.has(ct.id)).reduce((s,ct)=>s+(d[ct.id]||0),0);
}

function buildDistrictPolygons() {
  Object.entries(DISTRICTS_GEO).forEach(([id,geo])=>{
    if(districtLayers[id]) map.removeLayer(districtLayers[id]);
    const {c,o} = getDistrictColor(id);
    const poly = L.polygon(geo.coords,{
      color:'rgba(50,55,90,.65)', weight:1.5, fillColor:c, fillOpacity:o,
    });
    poly.on('mouseover', e=>{
      e.target.setStyle({weight:2.5,color:'rgba(255,60,95,.85)',fillOpacity:Math.min(o+.15,.78)});
      buildPopup(id, e.latlng);
    });
    poly.on('mouseout', e=>{
      if(selectedDist!==id)
        e.target.setStyle({weight:1.5,color:'rgba(50,55,90,.65)',fillOpacity:o});
      map.closePopup();
    });
    poly.on('click', ()=> focusDistrict(id===selectedDist ? null : id));
    poly.addTo(map);
    districtLayers[id] = poly;
  });
}

function refreshPolygonColors() {
  Object.entries(DISTRICTS_GEO).forEach(([id])=>{
    if(!districtLayers[id]) return;
    const {c,o} = getDistrictColor(id);
    if(id===selectedDist)
      districtLayers[id].setStyle({fillColor:c,fillOpacity:Math.min(o+.2,.82),weight:2.5,color:'rgba(255,60,95,.9)'});
    else
      districtLayers[id].setStyle({fillColor:c,fillOpacity:o,weight:1.5,color:'rgba(50,55,90,.65)'});
  });
}

function buildHeatmap() {
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
  let pts=[], grad={};
  if(currentMap==='crime'){
    const allTots=Object.keys(DISTRICTS_GEO).map(i=>getFilteredTotal(crimeData[i]||FALLBACK_CRIME[i]||{}));
    const mx=Math.max(...allTots)||1;
    Object.entries(DISTRICTS_GEO).forEach(([id,geo])=>{
      const d=crimeData[id]||FALLBACK_CRIME[id]||{};
      const t=getFilteredTotal(d)/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<14;i++)
        pts.push([lat+(Math.random()-.5)*.018, lng+(Math.random()-.5)*.025, t*(.7+Math.random()*.3)]);
    });
    grad={0:'#000033',.25:'#00008B',.5:'#8B0000',.75:'#FF4500',1:'#FF0000'};
  } else if(currentMap==='sigint'){
    Object.entries(SIGINT_COVERAGE).forEach(([id,cov])=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<10;i++)
        pts.push([lat+(Math.random()-.5)*.014,lng+(Math.random()-.5)*.020,cov*(.75+Math.random()*.25)]);
    });
    grad={0:'#001133',.3:'#003366',.6:'#0066AA',.85:'#00AAFF',1:'#00FFFF'};
  } else if(currentMap==='infra'){
    const allCounts=Object.keys(DISTRICTS_GEO).map(id=>getInfraNodeDensity(id).totalCount);
    const mx=Math.max(...allCounts)||1;
    Object.keys(DISTRICTS_GEO).forEach(id=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const t=getInfraNodeDensity(id).totalCount/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<10;i++)
        pts.push([lat+(Math.random()-.5)*.014,lng+(Math.random()-.5)*.020,t*(.75+Math.random()*.25)]);
    });
    grad={0:'#0a0a00',.3:'#332200',.6:'#884400',.85:'#FF8800',1:'#FFCC00'};
  } else if(currentMap==='human'){
    const mx=Math.max(...Object.values(HUMAN_DENSITY));
    Object.entries(HUMAN_DENSITY).forEach(([id,dens])=>{
      const geo=DISTRICTS_GEO[id];if(!geo)return;
      const t=dens/mx;
      const lat=geo.coords.reduce((s,c)=>s+c[0],0)/geo.coords.length;
      const lng=geo.coords.reduce((s,c)=>s+c[1],0)/geo.coords.length;
      for(let i=0;i<12;i++)
        pts.push([lat+(Math.random()-.5)*.016,lng+(Math.random()-.5)*.022,t*(.7+Math.random()*.3)]);
    });
    grad={0:'#000022',.3:'#110044',.6:'#330099',.85:'#6633FF',1:'#AA66FF'};
  }
  heatLayer=L.heatLayer(pts,{radius:55,blur:35,maxZoom:16,max:1,gradient:grad}).addTo(map);
}

function buildInfraMarkers() {
  if(markerGroup){map.removeLayer(markerGroup);markerGroup=null;}
  if(currentMap==='infra') buildInfraNodeMarkers();
  if(currentMap==='sigint') buildCCTVMarkers();
}

function buildInfraNodeMarkers() {
  markerGroup=L.layerGroup();
  const icons={power:'PWR',water:'H2O',transport:'TRN',data:'DC',hospital:'MED',gov:'GOV'};
  infraNodes.filter(n=>activeFilters.has(n.type)).forEach(n=>{
    const layer=INFRA_LAYERS.find(l=>l.id===n.type);
    if(!layer) return;
    const r=(n.crit===3?6:4);
    const m=L.circleMarker([n.lat,n.lng],{
      radius:r,fillColor:layer.color,color:layer.color,weight:n.crit===3?2:1,fillOpacity:.88
    });
    m.bindTooltip(
      `<div style="font-family:'DM Mono',monospace;font-size:11px;background:rgba(13,13,24,.96);
       border:1px solid #242438;border-radius:6px;padding:6px 10px;color:#e2e2f0">
       ${icons[n.type]||'●'} <strong>${n.name}</strong><br>
       <span style="color:#52526e">Criticality ${'*'.repeat(n.crit||1)}</span></div>`,
      {sticky:true,opacity:1,className:''}
    );
    markerGroup.addLayer(m);
  });
  markerGroup.addTo(map);
}

// Compute real RF coverage from OpenCelliD tower density
function computeRealCoverage() {
  const counts = {};
  Object.keys(DISTRICTS_GEO).forEach(id => counts[id] = 0);
  REAL_CELL_TOWERS.forEach(t => {
    for(const [id, geo] of Object.entries(DISTRICTS_GEO)) {
      const pts = geo.coords.map(([la,ln]) => [la,ln]);
      if(pointInLatLng(t.lat, t.lng, pts)) { counts[id]++; break; }
    }
  });
  const max = Math.max(...Object.values(counts)) || 1;
  const coverage = {};
  Object.keys(counts).forEach(id => {
    coverage[id] = Math.min(0.45 + (counts[id]/max)*0.52, 0.99);
  });
  return {coverage, counts};
}

function pointInLatLng(lat, lng, poly) {
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if(((xi>lat)!==(xj>lat))&&(lng<(yj-yi)*(lat-xi)/(xj-xi)+yi)) inside=!inside;
  }
  return inside;
}

// Compute on load and use as SIGINT_COVERAGE
const {coverage: SIGINT_COVERAGE, counts: TOWER_COUNTS} = computeRealCoverage();

function buildCCTVMarkers() {
  if(markerGroup){map.removeLayer(markerGroup);markerGroup=null;}
  markerGroup = L.layerGroup();
  const radioMap  = {GSM:'gsm', LTE:'lte', NR:'nr', UMTS:'umts'};
  const radioColor= {gsm:'#ffb800', lte:'#3da8ff', nr:'#00e5a0', umts:'#9b6cff'};
  // Real cell towers from OpenCelliD
  REAL_CELL_TOWERS.forEach(t => {
    const lid = radioMap[t.r]||'gsm';
    if(!activeFilters.has(lid)) return;
    const col = radioColor[lid]||'#888';
    const m = L.circleMarker([t.lat,t.lng],{
      radius:lid==='nr'?5:3, fillColor:col, color:col, weight:1, fillOpacity:.7,
    });
    m.bindTooltip(
      `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(12,14,18,.96);border:1px solid #252a34;padding:6px 10px;color:#c8cdd8">
       <strong>${t.r}</strong> Tower<br><span style="color:#4a5060">${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}</span></div>`,
      {sticky:true,opacity:1,className:''}
    );
    markerGroup.addLayer(m);
  });
  // Real CCTV cameras from Open Data BCN
  if(activeFilters.has('cctv')) {
    cctvNodes.forEach(n => {
      const m = L.circleMarker([n.lat,n.lng],{
        radius:4, fillColor:'#ff3c5f', color:'#ff3c5f', weight:1, fillOpacity:.85,
      });
      m.bindTooltip(
        `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(12,14,18,.96);border:1px solid #252a34;padding:6px 10px;color:#c8cdd8">
         <strong>${n.type}</strong><br><span style="color:#4a5060">${n.name}</span></div>`,
        {sticky:true,opacity:1,className:''}
      );
      markerGroup.addLayer(m);
    });
  }
  markerGroup.addTo(map);
}

function focusDistrict(id) {
  selectedDist=id;
  if(id){
    const geo=DISTRICTS_GEO[id];
    if(geo) map.fitBounds(L.latLngBounds(geo.coords),{padding:[40,40]});
  }
  refreshPolygonColors();
  buildList();
}

function toggleLayer(id) {
  if(activeFilters.has(id)){
    if(activeFilters.size===1) return;
    activeFilters.delete(id);
  } else activeFilters.add(id);
  const row=document.getElementById('lrow_'+id);
  if(row) row.classList.toggle('off',!activeFilters.has(id));
  refreshAll();
}

function refreshAll() {
  refreshPolygonColors();
  buildHeatmap();
  buildInfraMarkers();
  buildHUD();
  buildList();
}

function setStatus(state) {
  const dot=document.getElementById('statusDot');
  const txt=document.getElementById('statusText');
  if(state==='live'){
    dot.style.background='var(--green)';dot.style.boxShadow='0 0 6px var(--green)';
    txt.style.color='var(--green)';txt.textContent='LIVE';

    dot.style.background='var(--amber)';dot.style.boxShadow='0 0 6px var(--amber)';
    txt.style.color='var(--amber)';txt.textContent='VERIFIED DATA';
  } else {
    dot.style.background='var(--muted)';dot.style.boxShadow='none';
    txt.style.color='var(--muted)';txt.textContent='CONNECTING';
  }
}

  const o=document.getElementById('loadingOverlay');
  document.getElementById('loadingText').textContent=text;
  document.getElementById('loadingSub').textContent=sub;
  o.classList.remove('hidden');
}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden')}
function showError(msg){
  const b=document.getElementById('errorBanner');
  if(msg){b.textContent=msg;b.style.display='block'}
  else b.style.display='none';
}

// ═══════════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════════
document.getElementById('mainNav').addEventListener('click',e=>{
  const tab=e.target.closest('.nav-tab');
  if(!tab) return;
  currentMap=tab.dataset.map;
  selectedDist=null;
  map.setView([41.3951,2.1734],12);
  map.closePopup();
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  const defaults={
    crime:new Set(CRIME_TYPES.map(l=>l.id)),
    sigint:new Set(SIGINT_LAYERS.map(l=>l.id)),
    infra:new Set(INFRA_LAYERS.map(l=>l.id)),
    human:new Set(HUMAN_LAYERS.map(l=>l.id)),
  };
  activeFilters=defaults[currentMap];
  buildSidebar();buildHUD();buildControls();
  buildDistrictPolygons();
  buildHeatmap();
  buildInfraMarkers();
  if(currentMap==='infra'&&!dataLoaded.infra) loadInfraData();
  if(currentMap==='sigint'&&!dataLoaded.cctv) loadCCTVData();
  if(currentMap==='human'&&!dataLoaded.population) loadPopulationData();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildSidebar();
buildHUD();
buildControls();
buildDistrictPolygons();
buildHeatmap();
// Load real data async
loadCrimeData();
loadInfraData();
loadCCTVData();
loadPopulationData();
loadDistrictGeoJSON(); // Official BCN district boundaries · CartoBCN CC-BY
</script>
