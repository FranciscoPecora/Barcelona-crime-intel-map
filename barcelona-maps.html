<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCN · City Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --surface: #0d0d18;
    --surface2: #111120;
    --border: #1a1a2e;
    --border2: #242438;
    --text: #e2e2f0;
    --muted: #52526e;
    --muted2: #7a7a9a;
    --accent: #ff3c5f;
    --accent-glow: rgba(255,60,95,0.15);
    --green: #00e5a0;
    --amber: #ffb800;
    --blue: #3da8ff;
    --purple: #9b6cff;
    --cyan: #00d4e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}

  /* SCANLINE OVERLAY */
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
  }

  /* HEADER */
  header{
    position:fixed;top:0;left:0;right:0;z-index:200;height:52px;
    display:flex;align-items:center;padding:0 20px;gap:24px;
    background:rgba(8,8,16,0.9);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border2);
  }
  .logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:5px;flex-shrink:0}
  .logo em{color:var(--accent);font-style:normal}
  .logo-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:-4px}

  nav{display:flex;gap:2px;flex:1;overflow-x:auto}
  nav::-webkit-scrollbar{display:none}
  .nav-tab{
    padding:5px 14px;border-radius:3px;border:1px solid transparent;
    font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;color:var(--muted);background:none;transition:all .18s;white-space:nowrap;
  }
  .nav-tab:hover{color:var(--text);border-color:var(--border2)}
  .nav-tab.active{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}

  .header-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .status-text{font-family:'DM Mono',monospace;font-size:10px;color:var(--green);letter-spacing:1px}
  .classify-badge{
    padding:3px 10px;border-radius:2px;font-size:9px;letter-spacing:2px;
    font-family:'DM Mono',monospace;background:rgba(255,184,0,.1);
    border:1px solid rgba(255,184,0,.3);color:var(--amber);
  }

  /* LAYOUT */
  .app{display:flex;height:100vh;padding-top:52px}
  .sidebar{
    width:290px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;
  }
  .main{flex:1;position:relative;overflow:hidden}

  /* SIDEBAR SECTIONS */
  .sb-header{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
  .sb-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;margin-bottom:2px}
  .sb-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px;line-height:1.5}

  .sb-section{padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
  .sb-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px}

  .layer-row{
    display:flex;align-items:center;gap:8px;margin-bottom:5px;
    cursor:pointer;padding:5px 7px;border-radius:5px;transition:background .12s;
  }
  .layer-row:hover{background:rgba(255,255,255,.04)}
  .layer-icon{width:8px;height:8px;border-radius:2px;flex-shrink:0;transition:opacity .2s}
  .layer-label{font-size:12px;color:var(--text);flex:1}
  .layer-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
  .layer-row.off .layer-icon{opacity:.15}
  .layer-row.off .layer-label{color:var(--muted)}
  .layer-row input{display:none}

  .sb-list{padding:12px 18px;flex:1;overflow-y:auto}
  .sb-list::-webkit-scrollbar{width:2px}
  .sb-list::-webkit-scrollbar-thumb{background:var(--border2)}

  .list-card{
    padding:10px 12px;border-radius:6px;border:1px solid var(--border);
    margin-bottom:6px;cursor:pointer;transition:all .18s;
  }
  .list-card:hover{border-color:var(--accent);background:rgba(255,60,95,.04)}
  .list-card.selected{border-color:var(--accent);background:rgba(255,60,95,.07)}
  .lc-name{font-size:12px;font-weight:500;margin-bottom:5px}
  .lc-bar{display:flex;gap:2px;height:3px;border-radius:2px;overflow:hidden;margin-bottom:5px}
  .lc-seg{height:100%}
  .lc-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

  /* CANVAS */
  #mapCanvas{width:100%;height:100%;display:block;background:#07070f}

  /* TOOLTIP */
  #tooltip{
    position:absolute;z-index:150;
    background:rgba(13,13,24,0.97);border:1px solid var(--border2);
    border-radius:8px;padding:12px 14px;pointer-events:none;
    display:none;min-width:210px;max-width:260px;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 32px rgba(0,0,0,.5);
  }
  .tt-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
  .tt-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px}
  .tt-badge{font-family:'DM Mono',monospace;font-size:8px;padding:2px 6px;border-radius:2px;letter-spacing:1px}
  .tt-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .tt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .tt-sq{width:7px;height:7px;border-radius:1px;flex-shrink:0}
  .tt-label{font-size:11px;color:var(--muted2);flex:1}
  .tt-val{font-family:'DM Mono',monospace;font-size:11px}
  .tt-divider{border:none;border-top:1px solid var(--border);margin:7px 0}
  .tt-total{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px}

  /* HUD panels */
  .hud{
    position:absolute;top:14px;right:14px;
    background:rgba(13,13,24,0.88);border:1px solid var(--border2);
    border-radius:8px;padding:12px 14px;backdrop-filter:blur(10px);
    min-width:150px;
  }
  .hud-title{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:6px}
  .hud-val{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;line-height:1}
  .hud-sub{font-size:10px;color:var(--muted);margin-top:2px}
  .hud-divider{border:none;border-top:1px solid var(--border);margin:8px 0}
  .hud-row{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;margin-bottom:3px}
  .hud-row span:first-child{color:var(--muted)}

  /* THREAT METER */
  .threat-bar-wrap{display:flex;gap:2px;margin-top:4px}
  .threat-seg{height:6px;border-radius:1px;flex:1;background:var(--border)}
  .threat-seg.active{background:var(--accent)}
  .threat-seg.warn{background:var(--amber)}
  .threat-seg.safe{background:var(--green)}

  /* BOTTOM CONTROLS */
  .bottom-bar{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    background:rgba(13,13,24,0.88);border:1px solid var(--border2);
    border-radius:24px;padding:8px 18px;display:flex;align-items:center;gap:14px;
    backdrop-filter:blur(10px);white-space:nowrap;
  }
  .bb-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
  .bb-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:1px}
  input[type=range]{
    -webkit-appearance:none;width:120px;height:2px;
    background:var(--border2);border-radius:1px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;
    border-radius:50%;background:var(--accent);cursor:pointer;
  }

  /* WATERMARK */
  .watermark{
    position:absolute;bottom:14px;left:14px;
    font-family:'DM Mono',monospace;font-size:9px;
    color:var(--muted);letter-spacing:.5px;line-height:1.6;pointer-events:none;
  }

  /* LEGEND */
  .legend{
    position:absolute;bottom:14px;right:14px;
    background:rgba(13,13,24,0.88);border:1px solid var(--border2);
    border-radius:8px;padding:10px 12px;backdrop-filter:blur(10px);font-size:10px;
  }
  .legend-title{color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-size:9px;margin-bottom:6px}
  .legend-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .legend-sym{width:20px;height:6px;border-radius:3px;flex-shrink:0}
  .legend-sym.circle{height:10px;width:10px;border-radius:50%}

  /* MAP-SPECIFIC hidden classes */
  .map-panel{display:none}
  .map-panel.active{display:flex;flex-direction:column;height:100%}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">BCN<em>·</em>INTEL</div>
    <div class="logo-sub">City Intelligence Platform</div>
  </div>
  <nav id="mainNav">
    <button class="nav-tab active"  data-map="crime">Crime Analysis</button>

  <main class="main">

    <div class="watermark" id="watermark"></div>

    <div class="bottom-bar" id="bottomBar"></div>
  </main>
</div>

<script>

// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('mapCanvas');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize(){
  W = canvas.width  = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
  draw();
}
window.addEventListener('resize', resize);

function px([nx,ny]){ return [nx*W, ny*H] }
function shapePixels(id){ return DISTRICT_SHAPES[id].map(px) }

function polyCenter(pts){
  return [ pts.reduce((s,p)=>s+p[0],0)/pts.length,
           pts.reduce((s,p)=>s+p[1],0)/pts.length ];
}
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const[xi,yi]=poly[i],[xj,yj]=poly[j];
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function drawGrid(){
  ctx.strokeStyle='rgba(20,20,40,0.7)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

function fillPoly(pts,fill,stroke,lw){
  ctx.beginPath();ctx.moveTo(...pts[0]);
  pts.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}
}

function drawCircle(x,y,r,fill,stroke,lw){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}
}

function lerp(a,b,t){return a+(b-a)*t}
function lerpRGB(c1,c2,t){
  return `rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`
}

function draw(){

// ─── CRIME DRAW ───────────────────────────────────────────────
function getCrimeDistricts(){
  const f=YEAR_FACTOR[sliderVal]||1;
  return Object.entries(CRIME_DATA_BASE).map(([id,d])=>{
    const out={id,name:DISTRICT_NAMES[id]};
    CRIME_TYPES.forEach(ct=>{out[ct.id]=Math.round(d[ct.id]*f)});
    return out;
  });
}
function crimeTotal(d){
  return CRIME_TYPES.filter(ct=>activeLayerFilters.has(ct.id)).reduce((s,ct)=>s+d[ct.id],0);
}
function drawCrime(){
  const districts=getCrimeDistricts();
  const mx=Math.max(...districts.map(crimeTotal));
  districts.forEach(d=>{
    const pts=shapePixels(d.id);
    const t=mx>0?crimeTotal(d)/mx:0;
    const col=lerpRGB([18,18,32],[200,30,60],t);
    const isHov=hovered===d.id, isSel=selected===d.id;
    fillPoly(pts,col,null);
    if(isHov||isSel){fillPoly(pts,'rgba(255,60,95,.2)',null)}
    fillPoly(pts,null,(isHov||isSel)?'rgba(255,60,95,.9)':'rgba(50,50,80,.7)',(isHov||isSel)?2:1);
    const[cx,cy]=polyCenter(pts);
    ctx.textAlign='center';
    ctx.font=`500 10px 'DM Sans',sans-serif`;
    ctx.fillStyle=t>.5?'rgba(255,255,255,.9)':'rgba(160,160,190,.75)';
    ctx.fillText(DISTRICT_NAMES[d.id].split('–')[0].split('–')[0].split(' ')[0],cx,cy-3);
    ctx.font=`400 9px 'DM Mono',monospace`;
    ctx.fillStyle='rgba(130,130,160,.6)';
    ctx.fillText(crimeTotal(d).toLocaleString(),cx,cy+10);
  });
  // Pie on selected
  if(selected){
    const d=districts.find(x=>x.id===selected);
    const pts=shapePixels(selected);
    const[cx,cy]=polyCenter(pts);
    const tot=crimeTotal(d);
    let angle=-Math.PI/2;
    CRIME_TYPES.filter(ct=>activeLayerFilters.has(ct.id)).forEach(ct=>{
      const sweep=(d[ct.id]/(tot||1))*Math.PI*2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,28,angle,angle+sweep);ctx.closePath();
      ctx.fillStyle=ct.color+'cc';ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
      angle+=sweep;
    });
  }
}

// ─── SIGINT DRAW ──────────────────────────────────────────────
function drawSigint(){
  // Base district fill by coverage quality
  Object.entries(SIGINT_COVERAGE).forEach(([id,cov])=>{
    const pts=shapePixels(id);
    const col=lerpRGB([10,10,25],[0,80,120],cov);
    const isHov=hovered===id,isSel=selected===id;
    fillPoly(pts,col,null);
    if(isHov||isSel) fillPoly(pts,'rgba(0,212,232,.15)',null);
    fillPoly(pts,null,(isHov||isSel)?'rgba(0,212,232,.8)':'rgba(30,40,70,.8)',(isHov||isSel)?2:1);
  });

  // Coverage rings for active layers
  SIGINT_NODES.filter(n=>activeLayerFilters.has(n[2])).forEach(n=>{
    const[nx,ny,type,rad,strength]=n;
    const x=nx*W,y=ny*H,r=rad*Math.min(W,H);
    const layer=SIGINT_LAYERS.find(l=>l.id===type);
    if(!layer) return;
    // Coverage ring
    const grd=ctx.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,layer.color+'22');
    grd.addColorStop(1,layer.color+'00');
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();
    // Node marker
    const ms=type==='cctv'?5:type==='wifi'?4:type==='fiver'?5:7;
    drawCircle(x,y,ms,layer.color,layer.color+'44',1);
    if(type==='gsm'||type==='lte'){
      ctx.beginPath();
      ctx.moveTo(x,y-ms-4);ctx.lineTo(x-3,y-ms);ctx.lineTo(x+3,y-ms);ctx.closePath();
      ctx.fillStyle=layer.color;ctx.fill();
    }
  });

  // District labels
  Object.keys(DISTRICT_SHAPES).forEach(id=>{
    const pts=shapePixels(id);
    const[cx,cy]=polyCenter(pts);
    ctx.textAlign='center';
    ctx.font=`400 10px 'DM Sans',sans-serif`;
    ctx.fillStyle='rgba(180,200,220,.6)';
    ctx.fillText(DISTRICT_NAMES[id].split(' ')[0],cx,cy-3);
    ctx.font=`400 9px 'DM Mono',monospace`;
    ctx.fillStyle='rgba(0,212,232,.55)';
    ctx.fillText((SIGINT_COVERAGE[id]*100).toFixed(0)+'%',cx,cy+10);
  });
}

// ─── INFRA DRAW ───────────────────────────────────────────────
function drawInfra(){
  // District fill by vulnerability
  Object.entries(INFRA_VULN).forEach(([id,v])=>{
    const pts=shapePixels(id);
    const col=lerpRGB([14,20,14],[160,80,0],v);
    const isHov=hovered===id,isSel=selected===id;
    fillPoly(pts,col,null);
    if(isHov||isSel) fillPoly(pts,'rgba(255,184,0,.18)',null);
    fillPoly(pts,null,(isHov||isSel)?'rgba(255,184,0,.85)':'rgba(40,50,30,.8)',(isHov||isSel)?2:1);
    const[cx,cy]=polyCenter(pts);
    ctx.textAlign='center';
    ctx.font=`400 10px 'DM Sans',sans-serif`;
    ctx.fillStyle='rgba(200,200,160,.7)';
    ctx.fillText(DISTRICT_NAMES[id].split(' ')[0],cx,cy-3);
    ctx.font=`400 9px 'DM Mono',monospace`;
    ctx.fillStyle='rgba(255,184,0,.55)';
    ctx.fillText('V:'+Math.round(v*100),cx,cy+10);
  });

  // Infrastructure nodes
  INFRA_NODES.filter(n=>activeLayerFilters.has(n[2])).forEach(n=>{
    const[nx,ny,type,label,crit]=n;
    const x=nx*W,y=ny*H;
    const layer=INFRA_LAYERS.find(l=>l.id===type);
    if(!layer) return;
    const r=crit===3?9:crit===2?7:5;
    // Pulse for critical
    if(crit===3){
      drawCircle(x,y,r*2.2,layer.color+'18',null);
      drawCircle(x,y,r*1.5,layer.color+'30',null);
    }
    drawCircle(x,y,r,layer.color,layer.color,1);
    // Icon symbol
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold ${r}px sans-serif`;
    const icons={power:'⚡',water:'💧',transport:'🚉',data:'⬛',hospital:'+',gov:'★'};
    ctx.fillText(icons[type]||'●',x,y);
    ctx.textBaseline='alphabetic';
    // Label on hover vicinity
    if(Math.hypot(mouseX-x,mouseY-y)<r*3){
      ctx.font=`10px 'DM Mono',monospace`;
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.fillText(label,x,y-r-4);
    }
  });
}

// ─── HUMAN TERRAIN DRAW ───────────────────────────────────────
function drawHuman(){
  const maxDens=Math.max(...Object.values(HUMAN_DENSITY));
  Object.entries(HUMAN_DENSITY).forEach(([id,dens])=>{
    const t=dens/maxDens;
    const pts=shapePixels(id);
    const col=lerpRGB([12,14,30],[50,30,160],t);
    const isHov=hovered===id,isSel=selected===id;
    fillPoly(pts,col,null);
    if(isHov||isSel) fillPoly(pts,'rgba(155,108,255,.2)',null);
    fillPoly(pts,null,(isHov||isSel)?'rgba(155,108,255,.9)':'rgba(40,35,80,.75)',(isHov||isSel)?2:1);
    const[cx,cy]=polyCenter(pts);
    ctx.textAlign='center';
    ctx.font=`400 10px 'DM Sans',sans-serif`;
    ctx.fillStyle=t>.55?'rgba(220,210,255,.9)':'rgba(140,130,180,.7)';
    ctx.fillText(DISTRICT_NAMES[id].split(' ')[0],cx,cy-3);
    ctx.font=`400 9px 'DM Mono',monospace`;
    ctx.fillStyle='rgba(155,108,255,.6)';
    ctx.fillText((dens/1000).toFixed(0)+'k/km²',cx,cy+10);
  });

  // POIs
  HUMAN_POIS.filter(p=>activeLayerFilters.has(p[2])).forEach(p=>{
    const[nx,ny,type,label,risk]=p;
    const x=nx*W,y=ny*H;
    const layer=HUMAN_LAYERS.find(l=>l.id===type);
    if(!layer) return;
    const r=risk===3?8:risk===2?6:4;
    if(risk>=2){drawCircle(x,y,r*2.5,layer.color+'18',null)}
    drawCircle(x,y,r,layer.color+'dd',layer.color,1);
    if(Math.hypot(mouseX-x,mouseY-y)<r*3.5){
      ctx.font=`10px 'DM Mono',monospace`;
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.textAlign='center';
      ctx.fillText(label,x,y-r-4);
    }
  });
}

const tip=document.getElementById('tooltip');

function showTip(html){
  tip.innerHTML=html;tip.style.display='block';posTip();
}
function hideTip(){tip.style.display='none'}
function posTip(){
  let x=mouseX+14,y=mouseY-10;
  if(x+270>W) x=mouseX-280;
  if(y+300>H) y=mouseY-310;
  tip.style.left=x+'px';tip.style.top=y+'px';
}

function buildCrimeTip(d){
  const total=crimeTotal(d);
  const risk=total>15000?'HIGH':total>8000?'ELEVATED':'MODERATE';
  const riskCol=risk==='HIGH'?'#ff3c5f':risk==='ELEVATED'?'#ffb800':'#00e5a0';
  let rows=CRIME_TYPES.filter(ct=>activeLayerFilters.has(ct.id)).map(ct=>
    `<div class="tt-row"><div class="tt-dot" style="background:${ct.color}"></div>
     <span class="tt-label">${ct.label}</span>
     <span class="tt-val" style="color:${ct.color}">${d[ct.id].toLocaleString()}</span></div>`
  ).join('');
  return `<div class="tt-head"><div class="tt-name">${d.name}</div>
    <div class="tt-badge" style="background:${riskCol}22;border:1px solid ${riskCol}55;color:${riskCol}">${risk}</div></div>
    ${rows}<hr class="tt-divider">
    <div class="tt-total"><span style="color:var(--muted)">TOTAL INCIDENTS</span>
    <span style="color:var(--accent)">${total.toLocaleString()}</span></div>`;
}

function buildSigintTip(id){
  const cov=SIGINT_COVERAGE[id];
  const nodes=SIGINT_NODES.filter(n=>n[0]*W>0&&DISTRICT_SHAPES[id]).length;
  const q=cov>.85?'EXCELLENT':cov>.7?'GOOD':cov>.55?'MODERATE':'POOR';
  const qCol=cov>.85?'#00e5a0':cov>.7?'#3da8ff':cov>.55?'#ffb800':'#ff3c5f';
  const counts=SIGINT_LAYERS.map(l=>{
    const n=SIGINT_NODES.filter(nd=>nd[2]===l.id&&activeLayerFilters.has(l.id)).length;
    return `<div class="tt-row"><div class="tt-sq" style="background:${l.color}"></div>
      <span class="tt-label">${l.label}</span>
      <span class="tt-val" style="color:${l.color}">${n}</span></div>`;
  }).join('');
  return `<div class="tt-head"><div class="tt-name">${DISTRICT_NAMES[id]}</div>
    <div class="tt-badge" style="background:${qCol}22;border:1px solid ${qCol}55;color:${qCol}">${q}</div></div>
    ${counts}<hr class="tt-divider">
    <div class="tt-total"><span style="color:var(--muted)">RF COVERAGE</span>
    <span style="color:var(--cyan)">${(cov*100).toFixed(0)}%</span></div>`;
}

function buildInfraTip(id){
  const v=INFRA_VULN[id];
  const threat=v>.75?'CRITICAL':v>.5?'HIGH':v>.3?'MODERATE':'LOW';
  const tCol=v>.75?'#ff3c5f':v>.5?'#ffb800':v>.3?'#3da8ff':'#00e5a0';
  const distNodes=INFRA_NODES.filter(n=>{
    const[nx,ny]=n;const x=nx*W,y=ny*H;
    const pts=shapePixels(id);return pointInPoly(x,y,pts);
  });
  const byCat=INFRA_LAYERS.map(l=>{
    const cnt=distNodes.filter(n=>n[2]===l.id).length;
    return cnt>0?`<div class="tt-row"><div class="tt-sq" style="background:${l.color}"></div>
      <span class="tt-label">${l.label}</span>
      <span class="tt-val" style="color:${l.color}">${cnt}</span></div>`:'';
  }).join('');
  return `<div class="tt-head"><div class="tt-name">${DISTRICT_NAMES[id]}</div>
    <div class="tt-badge" style="background:${tCol}22;border:1px solid ${tCol}55;color:${tCol}">${threat}</div></div>
    ${byCat||'<span style="color:var(--muted);font-size:11px">No active layer nodes</span>'}
    <hr class="tt-divider">
    <div class="tt-total"><span style="color:var(--muted)">VULNERABILITY INDEX</span>
    <span style="color:var(--amber)">${Math.round(v*100)}/100</span></div>`;
}

function buildHumanTip(id){
  const dens=HUMAN_DENSITY[id];
  const inst=HUMAN_INSTABILITY[id];
  const risk=inst>.6?'VOLATILE':inst>.4?'ELEVATED':'STABLE';
  const rCol=inst>.6?'#ff3c5f':inst>.4?'#ffb800':'#00e5a0';
  const distPois=HUMAN_POIS.filter(p=>{
    const[nx,ny]=p;const x=nx*W,y=ny*H;
    const pts=shapePixels(id);return pointInPoly(x,y,pts);
  });
  const byCat=HUMAN_LAYERS.filter(l=>l.id!=='density').map(l=>{
    const cnt=distPois.filter(p=>p[2]===l.id).length;
    return cnt>0?`<div class="tt-row"><div class="tt-dot" style="background:${l.color}"></div>
      <span class="tt-label">${l.label}</span>
      <span class="tt-val" style="color:${l.color}">${cnt}</span></div>`:'';
  }).join('');
  return `<div class="tt-head"><div class="tt-name">${DISTRICT_NAMES[id]}</div>
    <div class="tt-badge" style="background:${rCol}22;border:1px solid ${rCol}55;color:${rCol}">${risk}</div></div>
    <div class="tt-row"><div class="tt-dot" style="background:#3da8ff"></div>
      <span class="tt-label">Population density</span>
      <span class="tt-val" style="color:#3da8ff">${dens.toLocaleString()}/km²</span></div>
    ${byCat||''}
    <hr class="tt-divider">
    <div class="tt-total"><span style="color:var(--muted)">INSTABILITY INDEX</span>
    <span style="color:var(--purple)">${Math.round(inst*100)}/100</span></div>`;
}

function updateLayerCounts(){

    let cnt=0;
    if(currentMap==='crime'){
      const districts=getCrimeDistricts();
      cnt=districts.reduce((s,d)=>s+d[l.id],0);
      el.textContent=cnt.toLocaleString();
    } else if(currentMap==='sigint'){
      cnt=SIGINT_NODES.filter(n=>n[2]===l.id).length;
      el.textContent=cnt;
    } else if(currentMap==='infra'){
      cnt=INFRA_NODES.filter(n=>n[2]===l.id).length;
      el.textContent=cnt;
    } else if(currentMap==='human'){
      cnt=HUMAN_POIS.filter(p=>p[2]===l.id).length;
      el.textContent=cnt||'';
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// HUD BUILDERS
// ═══════════════════════════════════════════════════════════════
function buildHUD(){
  const hud=document.getElementById('hud');
  if(currentMap==='crime'){
    const districts=getCrimeDistricts();
    const total=districts.reduce((s,d)=>s+crimeTotal(d),0);
    const worst=districts.sort((a,b)=>crimeTotal(b)-crimeTotal(a))[0];
    hud.innerHTML=`
      <div class="hud-title">Total Incidents · ${sliderVal}</div>
      <div class="hud-val" style="color:var(--accent)">${total.toLocaleString()}</div>
      <div class="hud-sub">All active categories</div>
      <hr class="hud-divider">
      <div class="hud-row"><span>Highest risk</span><span style="color:var(--accent)">${worst.name.split('–')[0]}</span></div>
      <div class="hud-row"><span>Districts</span><span>10</span></div>`;
  } else if(currentMap==='sigint'){
    const avgCov=Object.values(SIGINT_COVERAGE).reduce((a,b)=>a+b,0)/10;
    const total=SIGINT_NODES.filter(n=>activeLayerFilters.has(n[2])).length;
    hud.innerHTML=`
      <div class="hud-title">RF Coverage</div>
      <div class="hud-val" style="color:var(--cyan)">${(avgCov*100).toFixed(0)}%</div>
      <div class="hud-sub">City-wide average</div>
      <hr class="hud-divider">
      <div class="hud-row"><span>Active nodes</span><span style="color:var(--cyan)">${total}</span></div>
      <div class="hud-row"><span>Dead zones</span><span style="color:var(--accent)">3</span></div>`;
  } else if(currentMap==='infra'){
    const avgVuln=Object.values(INFRA_VULN).reduce((a,b)=>a+b,0)/10;
    const critical=INFRA_NODES.filter(n=>n[4]===3&&activeLayerFilters.has(n[2])).length;
    const threat=avgVuln>.65?'HIGH':avgVuln>.45?'ELEVATED':'MODERATE';
    const tCol=avgVuln>.65?'var(--accent)':avgVuln>.45?'var(--amber)':'var(--green)';
    hud.innerHTML=`
      <div class="hud-title">Threat Level</div>
      <div class="hud-val" style="color:${tCol}">${threat}</div>
      <div class="hud-sub">Avg vulnerability ${Math.round(avgVuln*100)}/100</div>
      <hr class="hud-divider">
      <div class="hud-row"><span>Critical nodes</span><span style="color:var(--accent)">${critical}</span></div>
      <div class="hud-row"><span>Categories active</span><span>${activeLayerFilters.size}</span></div>`;
  } else if(currentMap==='human'){
    const totalPop=Object.values(HUMAN_DENSITY).reduce((a,b)=>a+b,0);
    const avgInst=Object.values(HUMAN_INSTABILITY).reduce((a,b)=>a+b,0)/10;
    hud.innerHTML=`
      <div class="hud-title">Population Index</div>
      <div class="hud-val" style="color:var(--purple)">${(totalPop/1000).toFixed(0)}k</div>
      <div class="hud-sub">Total monitored density</div>
      <hr class="hud-divider">
      <div class="hud-row"><span>Avg instability</span><span style="color:var(--purple)">${Math.round(avgInst*100)}/100</span></div>
      <div class="hud-row"><span>PoIs tracked</span><span>${HUMAN_POIS.filter(p=>activeLayerFilters.has(p[2])).length}</span></div>`;
  }
}

// ═══════════════════════════════════════════════════════════════
// BOTTOM BAR & LEGEND & WATERMARK
// ═══════════════════════════════════════════════════════════════
function buildBottom(){
  const bb=document.getElementById('bottomBar');
  const wm=document.getElementById('watermark');
  const lg=document.getElementById('legend');

  if(currentMap==='crime'){
    bb.innerHTML=`<span class="bb-label">YEAR</span>
      <input type="range" id="yearSlider" min="2019" max="2023" value="${sliderVal}" step="1">
      <span class="bb-val" id="yearLabel">${sliderVal}</span>`;
    document.getElementById('yearSlider').addEventListener('input',e=>{
      sliderVal=parseInt(e.target.value);
      document.getElementById('yearLabel').textContent=sliderVal;
      buildHUD();updateLayerCounts();buildCrimeList();draw();
    });
    lg.innerHTML=`<div class="legend-title">Intensity</div>
      <div class="legend-row"><div class="legend-sym" style="background:linear-gradient(90deg,#12121e,#c81e3c)"></div>
      <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:9px">Low → High</span></div>`;
    wm.textContent='BCN·INTEL / CRIME·LAYER / OSINT\nDistrict-level incident data 2019–2023';
  } else if(currentMap==='sigint'){
    bb.innerHTML=`<span class="bb-label">SIGNAL INTELLIGENCE LAYER</span>
      <span class="bb-val">BARCELONA · RF SURVEY 2023</span>`;
    lg.innerHTML=`<div class="legend-title">Coverage Quality</div>
      <div class="legend-row"><div class="legend-sym" style="background:linear-gradient(90deg,#0a0a19,#005080)"></div>
      <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:9px">Low → High</span></div>`;
    wm.textContent='BCN·INTEL / SIGINT·LAYER / OSINT\nRF infrastructure mapping · 2023';
  } else if(currentMap==='infra'){
    bb.innerHTML=`<span class="bb-label">CRITICAL INFRASTRUCTURE ASSESSMENT</span>
      <span class="bb-val" style="color:var(--amber)">BARCELONA · 2023</span>`;
    lg.innerHTML=`<div class="legend-title">Vulnerability Index</div>
      <div class="legend-row"><div class="legend-sym" style="background:linear-gradient(90deg,#0e140e,#a05000)"></div>
      <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:9px">Low → Critical</span></div>`;
    wm.textContent='BCN·INTEL / INFRA·LAYER / OSINT\nCritical node vulnerability mapping';
  } else if(currentMap==='human'){
    bb.innerHTML=`<span class="bb-label">HUMAN TERRAIN INTELLIGENCE</span>
      <span class="bb-val" style="color:var(--purple)">BARCELONA · 2023</span>`;
    lg.innerHTML=`<div class="legend-title">Population Density</div>
      <div class="legend-row"><div class="legend-sym" style="background:linear-gradient(90deg,#0c0e1e,#321ea0)"></div>
      <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:9px">Sparse → Dense</span></div>`;
    wm.textContent='BCN·INTEL / HUMINT·LAYER / OSINT\nSocio-political intelligence overlay';
  }
}

// ═══════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  mouseX=e.clientX-rect.left; mouseY=e.clientY-rect.top;
  hovered=null;
  for(const id of Object.keys(DISTRICT_SHAPES)){
    if(pointInPoly(mouseX,mouseY,shapePixels(id))){hovered=id;break}
  }
  if(hovered){
    let html='';
    if(currentMap==='crime'){
      const d=getCrimeDistricts().find(x=>x.id===hovered);
      if(d) html=buildCrimeTip(d);
    } else if(currentMap==='sigint') html=buildSigintTip(hovered);
    else if(currentMap==='infra')    html=buildInfraTip(hovered);
    else if(currentMap==='human')    html=buildHumanTip(hovered);
    if(html) showTip(html); else hideTip();
  } else hideTip();
  posTip(); draw();
});

canvas.addEventListener('click',()=>{
  if(hovered){ selectDistrict(selected===hovered?null:hovered) }
});
canvas.addEventListener('mouseleave',()=>{hovered=null;hideTip();draw()});

function selectDistrict(id){
  selected=id;
  // rebuild list to reflect selection
  if(currentMap==='crime')  buildCrimeList();
  else if(currentMap==='sigint') buildSigintList();
  else if(currentMap==='infra')  buildInfraList();
  else if(currentMap==='human')  buildHumanList();
  draw();
}

function toggleLayer(id){
  const layerMap={crime:CRIME_TYPES,sigint:SIGINT_LAYERS,infra:INFRA_LAYERS,human:HUMAN_LAYERS};
  const layers=layerMap[currentMap]||[];
  if(activeLayerFilters.has(id)){
    if(activeLayerFilters.size===1) return;
    activeLayerFilters.delete(id);
  } else activeLayerFilters.add(id);
  const row=document.getElementById('lrow_'+id);
  if(row) row.classList.toggle('off',!activeLayerFilters.has(id));
  updateLayerCounts();buildHUD();
  if(currentMap==='crime') buildCrimeList();
  draw();
}

document.getElementById('mainNav').addEventListener('click',e=>{
  const tab=e.target.closest('.nav-tab');
  if(!tab) return;
  currentMap=tab.dataset.map;
  selected=null;hovered=null;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  // Set default active layers for the map
  const defaults={
    crime: new Set(CRIME_TYPES.map(l=>l.id)),
    sigint: new Set(SIGINT_LAYERS.map(l=>l.id)),
    infra: new Set(INFRA_LAYERS.map(l=>l.id)),
    human: new Set(HUMAN_LAYERS.map(l=>l.id)),
  };
  activeLayerFilters=defaults[currentMap];
  buildSidebar();buildHUD();buildBottom();hideTip();draw();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
activeLayerFilters=new Set(CRIME_TYPES.map(l=>l.id));
buildSidebar();
buildHUD();
buildBottom();
resize();
</script>
</body>
</html>
