<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROVIDENCE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;cursor:none}

  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:10;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.01) 2px,rgba(255,255,255,.01) 4px)}

  /* custom cursor */
  .cursor{
    position:fixed;width:6px;height:6px;background:#fff;border-radius:50%;
    pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
    transition:transform .1s,width .2s,height .2s,background .2s;
    mix-blend-mode:difference;
  }
  .cursor-ring{
    position:fixed;width:32px;height:32px;border:1px solid rgba(255,255,255,.25);
    border-radius:50%;pointer-events:none;z-index:9998;
    transform:translate(-50%,-50%);transition:all .12s ease;
  }

  .bracket{position:fixed;width:28px;height:28px;border-color:rgba(255,255,255,.1);border-style:solid;z-index:20}
  .tl{top:24px;left:24px;border-width:1px 0 0 1px}
  .tr{top:24px;right:24px;border-width:1px 1px 0 0}
  .bl{bottom:24px;left:24px;border-width:0 0 1px 1px}
  .br{bottom:24px;right:24px;border-width:0 1px 1px 0}

  .classify{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;
    color:rgba(255,255,255,.4);text-transform:uppercase;
    border:1px solid rgba(255,255,255,.12);padding:3px 12px;
  }
  .timestamp{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;
    color:rgba(255,255,255,.18);text-transform:uppercase;
  }

  .stage{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:48px;
    animation:stageIn 1.4s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes stageIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

  /* EYE CANVAS */
  .eye-container{position:relative;width:400px;height:174px}
  canvas#eyeCanvas{position:absolute;inset:0;width:100%;height:100%}

  .wordmark{text-align:center;animation:wordIn .9s 1s cubic-bezier(.16,1,.3,1) both}
  @keyframes wordIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .wordmark h1{
    font-size:32px;font-weight:600;letter-spacing:.35em;
    color:#fff;text-transform:uppercase;
  }
  .wordmark h1 span{color:#3b82f6}
  .wordmark p{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.22em;
    color:rgba(255,255,255,.25);text-transform:uppercase;margin-top:8px;
  }

  .enter-wrap{animation:wordIn .9s 1.8s cubic-bezier(.16,1,.3,1) both}
  .enter-btn{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 36px;background:transparent;
    border:1px solid rgba(255,255,255,.14);
    color:rgba(255,255,255,.45);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    cursor:none;transition:all .25s;text-decoration:none;
  }
  .enter-btn:hover{
    border-color:rgba(59,130,246,.55);
    color:#3b82f6;background:rgba(59,130,246,.07);
  }
  .arrow{transition:transform .25s;font-size:14px}
  .enter-btn:hover .arrow{transform:translateX(4px)}

  .fade-out{animation:fadeOut .65s ease forwards}
  @keyframes fadeOut{to{opacity:0;transform:scale(1.025)}}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>
<div class="classify">OSINT · Unclassified</div>
<div class="timestamp" id="ts"></div>

<div class="stage" id="stage">
  <div class="eye-container">
    <canvas id="eyeCanvas" width="800" height="348"></canvas>
  </div>

  <div class="wordmark">
    <h1>PROVI<span></span>DENCE</h1>
    <p>City Intelligence Platform</p>
  </div>

  <div class="enter-wrap">
    <a class="enter-btn" href="index.html" id="enterBtn">
      <span>Enter Platform</span>
      <span class="arrow">→</span>
    </a>
  </div>
</div>

<script>
// ── CUSTOM CURSOR ─────────────────────────────────────────────
const cursor     = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');
let mx=window.innerWidth/2, my=window.innerHeight/2;
let rx=mx, ry=my;

document.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY;
  cursor.style.left=mx+'px'; cursor.style.top=my+'px';
});

function animRing(){
  rx+=(mx-rx)*.12; ry+=(my-ry)*.12;
  cursorRing.style.left=rx+'px'; cursorRing.style.top=ry+'px';
  requestAnimationFrame(animRing);
}
animRing();

// ── EYE CANVAS ────────────────────────────────────────────────
const canvas = document.getElementById('eyeCanvas');
const ctx    = canvas.getContext('2d');
const CW=800, CH=348;

// Eye shape control points (normalized)
const CX=CW/2, CY=CH/2;
const EW=320, EH=130; // half-widths

// Globe spin angle
let globeAngle=0;
// Target pupil offset (follows mouse)
let pupilTX=0, pupilTY=0;
let pupilX=0,  pupilY=0;
// Blink
let blinkT=0, nextBlink=4000, lastBlink=Date.now();
let blinking=false, blinkPhase=0;
// Pupil size breathe
let breatheT=0;

// Max pupil travel
const MAX_TRAVEL=22;

function eyePath(scaleY=1){
  ctx.beginPath();
  ctx.moveTo(CX-EW, CY);
  ctx.bezierCurveTo(CX-EW/2, CY-EH*scaleY, CX+EW/2, CY-EH*scaleY, CX+EW, CY);
  ctx.bezierCurveTo(CX+EW/2, CY+EH*scaleY, CX-EW/2, CY+EH*scaleY, CX-EW, CY);
  ctx.closePath();
}

function drawEye(ts){
  ctx.clearRect(0,0,CW,CH);

  // ── BLINK ──
  let lidScale=1;
  const now=Date.now();
  if(!blinking && now-lastBlink>nextBlink){
    blinking=true; blinkPhase=0; lastBlink=now;
    nextBlink=3500+Math.random()*4000;
  }
  if(blinking){
    blinkPhase+=0.12;
    lidScale=Math.abs(Math.cos(blinkPhase));
    if(blinkPhase>Math.PI) blinking=false;
  }

  // ── GLOBE SPIN ──
  globeAngle+=0.004;

  // ── BREATHE ──
  breatheT+=0.018;
  const irisR=90+Math.sin(breatheT)*3;
  const pupilR=28-Math.sin(breatheT*1.1)*3;

  // ── PUPIL FOLLOW ──
  pupilX+=(pupilTX-pupilX)*.08;
  pupilY+=(pupilTY-pupilY)*.08;

  const px=CX+pupilX, py=CY+pupilY*lidScale;

  // ── CLIP TO EYE SHAPE ──
  ctx.save();
  eyePath(lidScale);
  ctx.clip();

  // Iris background
  const irisGrad=ctx.createRadialGradient(px,py,0,px,py,irisR);
  irisGrad.addColorStop(0,'#1a3459');
  irisGrad.addColorStop(.55,'#0b1e3a');
  irisGrad.addColorStop(1,'#040a15');
  ctx.beginPath();
  ctx.arc(CX,CY,irisR,0,Math.PI*2);
  ctx.fillStyle=irisGrad;
  ctx.fill();

  // ── GLOBE LINES ──
  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(globeAngle);
  ctx.translate(-CX,-CY);

  const latitudes=[11,27,44,60];
  const longitudes=[11,27,44,60];

  latitudes.forEach(ry2=>{
    ctx.beginPath();
    ctx.ellipse(CX,CY,irisR,ry2*(irisR/90),0,0,Math.PI*2);
    const a=.06+.08*(1-ry2/90);
    ctx.strokeStyle=`rgba(255,255,255,${a})`;
    ctx.lineWidth=.7;
    ctx.stroke();
  });
  longitudes.forEach(rx2=>{
    ctx.beginPath();
    ctx.ellipse(CX,CY,rx2*(irisR/90),irisR,0,0,Math.PI*2);
    const a=.06+.08*(1-rx2/90);
    ctx.strokeStyle=`rgba(255,255,255,${a})`;
    ctx.lineWidth=.7;
    ctx.stroke();
  });
  // outer ring
  ctx.beginPath();
  ctx.arc(CX,CY,irisR,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.16)';
  ctx.lineWidth=.8;
  ctx.stroke();

  ctx.restore();

  // ── IRIS LIMBAL RING ──
  const limbal=ctx.createRadialGradient(CX,CY,irisR-12,CX,CY,irisR);
  limbal.addColorStop(0,'rgba(0,0,0,0)');
  limbal.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.beginPath();
  ctx.arc(CX,CY,irisR,0,Math.PI*2);
  ctx.fillStyle=limbal;
  ctx.fill();

  // ── PUPIL ──
  ctx.beginPath();
  ctx.arc(px,py,pupilR,0,Math.PI*2);
  ctx.fillStyle='#000';
  ctx.fill();

  // Pupil depth gradient
  const pdg=ctx.createRadialGradient(px,py,0,px,py,pupilR);
  pdg.addColorStop(0,'rgba(20,20,40,.6)');
  pdg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(px,py,pupilR,0,Math.PI*2);
  ctx.fillStyle=pdg;
  ctx.fill();

  // Specular highlights
  ctx.beginPath();
  ctx.arc(px-7,py-7,5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(px-9,py-9,2.5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fill();

  ctx.restore(); // end clip

  // ── EYE OUTLINE ──
  ctx.save();
  eyePath(lidScale);
  ctx.strokeStyle='rgba(255,255,255,.82)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();

  // ── TEAR DUCT DOTS ──
  [[CX-EW,CY],[CX+EW,CY]].forEach(([x,y])=>{
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.fill();
  });

  requestAnimationFrame(drawEye);
}
requestAnimationFrame(drawEye);

// ── MOUSE → PUPIL FOLLOW ──────────────────────────────────────
const eyeEl=document.querySelector('.eye-container');

document.addEventListener('mousemove',e=>{
  const rect=eyeEl.getBoundingClientRect();
  // center of eye in screen coords
  const ecx=rect.left+rect.width/2;
  const ecy=rect.top+rect.height/2;
  // angle and distance from eye center
  const dx=e.clientX-ecx;
  const dy=e.clientY-ecy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const angle=Math.atan2(dy,dx);
  // clamp travel
  const travel=Math.min(dist*.12,MAX_TRAVEL);
  pupilTX=Math.cos(angle)*travel;
  pupilTY=Math.sin(angle)*travel;
});

// ── TIMESTAMP ──────────────────────────────────────────────────
function updateTS(){
  document.getElementById('ts').textContent=new Date().toUTCString().replace('GMT','UTC');
}
updateTS(); setInterval(updateTS,1000);

// ── ENTER BUTTON ───────────────────────────────────────────────
document.getElementById('enterBtn').addEventListener('click',function(e){
  e.preventDefault();
  document.getElementById('stage').classList.add('fade-out');
  setTimeout(()=>{window.location.href='index.html'},650);
});
</script>
</body>
</html>
